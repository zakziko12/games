  // Current car (null when bay empty).
  var car = null;
  var queue = [];       // next cars waiting (specs only)
  var clouds = [];
  var particles = [];   // {x,y,vx,vy,life,maxLife,size,color,type,grav}
  var popups = [];      // floating texts {x,y,vy,life,text,color,size}
  var stageAnimT = 0;   // timer for the drying shine sweep / leaving
  var dryDur = 0.9;
  var shineT = -1;      // shine sweep progress (0..1) or -1 when off
  var scrubbing = false;
  var scrubId = -1;
  var lastScrubX = 0, lastScrubY = 0;
  var waxing = false;
  var waxId = -1;
  var lastWaxX = 0, lastWaxY = 0;
  var hintPulse = 0;
  var carBounce = 0;    // little bounce when a stage completes
  var pendingRequest = null; // debug hook: force the next car's request

  // v4 camera state: current transform + target (eased toward, never snaps).
  // scale = zoom, panX/panY = world-space pan (camera follows the pointer).
  var cam = { scale: 1, panX: 0, panY: 0 };
  var camTarget = { scale: 1, panX: 0, panY: 0 };
  // v4: pointer position in world coords (for spray-follow pan + tool drawing).
  var pointerWorld = { x: CAR_CX, y: CAR_GROUND - 60, active: false };
  // v4: the tool the finger is dragging (drawn following the pointer).
  var dragTool = null;  // 'foam' | 'spray' | 'sponge' | 'towel' | null

  // Buttons (logical coords)
  var muteBtn = { x: W - 56, y: 12, w: 44, h: 44 };
  var pauseBtn = { x: W - 108, y: 12, w: 44, h: 44 };
  var playBtn = { x: 130, y: 600, w: 220, h: 66 };
  var restartBtn = { x: 90, y: 560, w: 300, h: 62 };
  var menuBtnOver = { x: 90, y: 634, w: 300, h: 52 };
  var resumeBtn = { x: 100, y: 370, w: 280, h: 60 };
  var menuBtnPaused = { x: 100, y: 446, w: 280, h: 52 };
  // Shop panel (v2): header + earnings + missions + tools grid + tier card + next.
  var nextCarBtn = { x: 90, y: 600, w: 300, h: 52 };
  // v3 tools grid: 6 one-time purchases in the same area the v2 upgrade rows used.
  var toolBtns = [
    { id: 'washer', x: 50,  y: 366, w: 185, h: 50 },
    { id: 'cannon', x: 245, y: 366, w: 185, h: 50 },
    { id: 'brush',  x: 50,  y: 422, w: 185, h: 50 },
    { id: 'oil',    x: 245, y: 422, w: 185, h: 50 },
    { id: 'dryer',  x: 50,  y: 478, w: 185, h: 50 },
    { id: 'polish', x: 245, y: 478, w: 185, h: 50 }
  ];
  var tierBtn = { x: 50, y: 536, w: 380, h: 54 };
  var menuTierBtn = { x: 40, y: 360, w: 400, h: 40 };
  var skipWaxBtn = { x: 180, y: 694, w: 120, h: 40 };

  function scrubRadius() { return BASE_SCRUB_RADIUS * (selectedTool === 'washer' ? 1.15 : 1); }
  function scrubPower() { return BASE_SCRUB_POWER; }
  function tipBonus() { return 1 + (tools.dryer ? 0.15 : 0); }
  function animSpeed() { return 1 + (tools.dryer ? 0.2 : 0); }
  // v3: the payout multiplier comes from the Perfect Streak, not the wash count.
  function streakMult() {
    if (perfectStreak >= 4) return 2.5;
    if (perfectStreak === 3) return 2;
    if (perfectStreak === 2) return 1.5;
    return 1;
  }
  function comboMult() { return streakMult(); }

  // ============================== Camera (v4) ==============================
  // The camera transform is: translate(pivot) -> scale -> translate(-pivot - pan).
  // World point w maps to screen point s = pivot + (w - pivot - pan) * scale.
  // Inverse (screen -> world): w = pivot + pan + (s - pivot) / scale.
  function screenToWorld(sx, sy) {
    return {
      x: CAM_PIVOT_X + cam.panX + (sx - CAM_PIVOT_X) / cam.scale,
      y: CAM_PIVOT_Y + cam.panY + (sy - CAM_PIVOT_Y) / cam.scale
    };
  }
  function worldToScreen(wx, wy) {
    return {
      x: CAM_PIVOT_X + (wx - CAM_PIVOT_X - cam.panX) * cam.scale,
      y: CAM_PIVOT_Y + (wy - CAM_PIVOT_Y - cam.panY) * cam.scale
    };
  }
  function applyCameraTransform() {
    ctx.translate(CAM_PIVOT_X, CAM_PIVOT_Y);
    ctx.scale(cam.scale, cam.scale);
    ctx.translate(-CAM_PIVOT_X - cam.panX, -CAM_PIVOT_Y - cam.panY);
  }
  // Camera targets per stage (doc: fixed at entry, slight zoom on foam, light
  // follow on water spray, steady while scrubbing, full view at the end).
  function cameraTargetForStage(stage) {
    var tgt = { scale: 1, panX: 0, panY: 0 };
    if (stage === 'foam') {
      tgt.scale = CAM_ZOOM_FOAM;
    } else if (stage === 'pressure' || stage === 'rinse') {
      tgt.scale = CAM_ZOOM_SPRAY;
      if (pointerWorld.active) {
        // Gentle follow: pan a fraction of the pointer's offset from center.
        tgt.panX = clamp((pointerWorld.x - CAM_PIVOT_X) * 0.12, -CAM_PAN_MAX, CAM_PAN_MAX);
        tgt.panY = clamp((pointerWorld.y - CAM_PIVOT_Y) * 0.12, -CAM_PAN_MAX, CAM_PAN_MAX);
      }
    }
    return tgt;
  }
  function updateCamera(dt) {
    // The camera only follows the wash while playing; in the menu/shop the
    // decorative car must not trigger a zoom.
    var stage = (state === 'playing' && car) ? car.stage : null;
    camTarget = cameraTargetForStage(stage);
    var k = 1 - Math.exp(-CAM_EASE * dt);
    cam.scale += (camTarget.scale - cam.scale) * k;
    cam.panX += (camTarget.panX - cam.panX) * k;
    cam.panY += (camTarget.panY - cam.panY) * k;
  }

  // ============================== Car generation ==============================
  function unlockedTypes() {
    var out = [];
    for (var i = 0; i < CAR_TYPES.length; i++) {
      if (CAR_TYPES[i].tier <= unlockedTier) out.push(CAR_TYPES[i]);
    }
    return out.length ? out : [CAR_TYPES[0], CAR_TYPES[1]];
  }

  function randomCarSpec(vip, firstOfRun) {
    var pool = unlockedTypes();
    if (firstOfRun) {
      // The first car of a run is always an easy tier-1 vehicle.
      pool = [];
      for (var i = 0; i < CAR_TYPES.length; i++) if (CAR_TYPES[i].tier === 1) pool.push(CAR_TYPES[i]);
    }
    var type = pick(pool);
    var color = vip ? '#ffd700' : pick(CAR_COLORS);
    if (type.id === 'taxi') color = '#f7c948';
    if (type.id === 'tank' && !vip) color = pick(TANK_COLORS);
    if (type.id === 'jet' && !vip) color = pick(JET_COLORS);
    return { type: type, color: color, vip: !!vip, seed: Math.random() * 1000 };
  }

  // Dirt kind mix per vehicle type (weights; normalized at pick time).
  // v3 adds oil, stuck insects and cement (cement only on big trucks/buses).
  function dirtKindFor(type) {
    var r = Math.random();
    if (type.id === 'jet') {
      if (r < 0.30) return 'bird';
      if (r < 0.65) return 'dust';
      if (r < 0.80) return 'insect';
      return 'mud';
    }
    if (type.id === 'moto') {
      if (r < 0.50) return 'dust';
      if (r < 0.80) return 'mud';
      if (r < 0.92) return 'insect';
      return 'bird';
    }
    if (type.id === 'bigtruck') {
      if (r < 0.38) return 'mud';
      if (r < 0.62) return 'tar';
      if (r < 0.74) return 'oil';
      if (r < 0.84) return 'cement';
      if (r < 0.92) return 'insect';
      if (r < 0.96) return 'bird';
      return 'dust';
    }
    if (type.id === 'bus') {
      if (r < 0.40) return 'mud';
      if (r < 0.60) return 'tar';
      if (r < 0.72) return 'cement';
      if (r < 0.80) return 'oil';
      if (r < 0.92) return 'dust';
      if (r < 0.97) return 'insect';
      return 'bird';
    }
    if (type.id === 'tank' || type.id === 'pickup') {
      if (r < 0.44) return 'mud';
      if (r < 0.68) return 'tar';
      if (r < 0.82) return 'oil';
      if (r < 0.90) return 'insect';
      if (r < 0.95) return 'bird';
      return 'dust';
    }
    // Cars / SUV / sports / taxi.
    if (r < 0.50) return 'mud';
    if (r < 0.75) return 'dust';
    if (r < 0.85) return 'tar';
    if (r < 0.91) return 'oil';
    if (r < 0.96) return 'insect';
    return 'bird';
  }

  // Dirt patches in car-local coords: x relative to car center, y relative to ground.
  // easyDirt: tight-timer orders (hurry/speed/emergency) get v2 dirt only —
  // one challenge axis at a time, so a car is never both rushed AND hard.
  function makeDirt(spec, count, easyDirt) {
    var patches = [];
    var type = spec.type;
    var half = type.len / 2;
    var top = type.top || 116;
    var margin = Math.max(18, half * 0.22);
    var rScale = clamp(type.len / 300, 0.6, 1.25);
    // v3: heavy mud appears on off-roaders (trucks/buses/tanks) and rarely on cars.
    var heavyChance = (type.id === 'bigtruck' || type.id === 'bus' || type.id === 'tank') ? 0.5 : 0.1;
    for (var i = 0; i < count; i++) {
      // Keep patches on the body: inside the length, and above the body bottom
      // (body bottom is ~24px above ground; a patch must not dangle below it).
      var kind = pendingDirt || dirtKindFor(type);
      if (pendingDirt === 'heavymud') kind = 'mud';
      // v3: the first two cars of a run use v2 dirt only (mud/dust/tar/bird).
      // Hard dirt (oil, insects, cement, heavy mud) appears from car 3, once
      // the player has earned coins toward the tools that handle it — a first
      // car with an oil patch would be nearly unwinnable with no tools.
      // The debug hook (pendingDirt) bypasses the gate.
      if (!pendingDirt && (carIndex <= 2 || easyDirt)) {
        if (kind === 'oil' || kind === 'insect') kind = 'mud';
        else if (kind === 'cement') kind = 'tar';
      }
      var heavy = false;
      if (kind === 'mud') {
        heavy = (pendingDirt === 'heavymud') ||
                (carIndex > 2 && !easyDirt && Math.random() < heavyChance);
      }
      var pr = rand(13, 26) * rScale * (heavy ? 1.3 : 1);
      if (kind === 'insect') pr = rand(7, 12) * rScale;
      if (kind === 'cement') pr = rand(14, 22) * rScale;
      var px = rand(-half + margin, half - margin);
      var py;
      if (Math.random() < 0.7) {
        // Lower body / wheel area.
        py = rand(-58, -24 - pr * 0.68);
      } else {
        // Cabin / windows / upper body.
        py = rand(-top + 8, -58);
      }
      var tone = DIRT_TONES[Math.floor(Math.random() * DIRT_TONES.length)];
      if (kind === 'tar') tone = '#1f2937';
      else if (kind === 'bird') tone = '#f8fafc';
      else if (kind === 'dust') tone = '#b0a58e';
      else if (kind === 'oil') tone = '#1a1a2e';
      else if (kind === 'insect') tone = '#2d1a12';
      else if (kind === 'cement') tone = '#9aa0a6';
      else if (heavy) tone = '#4a2f18';
      patches.push({
        x: px, y: py, r: pr,
        amount: 1,
        kind: kind,
        heavy: heavy,
        softened: false,
        tone: tone,
        seed: Math.random() * 1000
      });
    }
    pendingDirt = null; // debug hook applies to one car only
    return patches;
  }

  // Extra dirt on the windows for the "windows" request.
  function addWindowDirt(carObj, count) {
    var type = carObj.spec.type;
    var half = type.len / 2;
    var top = type.top || 116;
    for (var i = 0; i < count; i++) {
      carObj.dirt.push({
        x: rand(-half * 0.5, half * 0.5),
        y: rand(-top + 12, -62),
        r: rand(10, 16) * clamp(type.len / 300, 0.6, 1.2),
        amount: 1,
        kind: 'mud',
        softened: false,
        tone: DIRT_TONES[Math.floor(Math.random() * DIRT_TONES.length)],
        seed: Math.random() * 1000
      });
    }
  }

  // v4 foam coverage grid: cells over the car body. The foam stage completes
  // when 90% of cells are covered (the player drags the spray over the car).
  function initFoamGrid(c) {
    var half = c.spec.type.len / 2;
    var top = c.spec.type.top || 116;
    var x0 = -half + 12, x1 = half - 12;
    var y0 = -top + 6, y1 = -16;
    var cols = Math.max(2, Math.ceil((x1 - x0) / FOAM_CELL));
    var rows = Math.max(2, Math.ceil((y1 - y0) / FOAM_CELL));
    var cells = [];
    for (var r = 0; r < rows; r++) {
      for (var col = 0; col < cols; col++) {
        cells.push({
          x: x0 + (col + 0.5) * (x1 - x0) / cols,
          y: y0 + (r + 0.5) * (y1 - y0) / rows,
          covered: false
        });
      }
    }
    c.foamCells = cells;
    c.foamCovered = 0;
  }
  function foamCoverage(c) {
    if (!c.foamCells || !c.foamCells.length) return 1;
    return c.foamCovered / c.foamCells.length;
  }
  function foamBlobsForCell(c, cell) {
    // One foam blob per covered cell (two + bigger with the Foam Cannon).
    var n = tools.cannon ? 2 : 1;
    var rm = tools.cannon ? 1.3 : 1;
    for (var i = 0; i < n; i++) {
      c.foam.push({
        x: cell.x + rand(-9, 9),
        y: cell.y + rand(-8, 8),
        r: rand(9, 16) * rm,
        amount: 1,
        seed: Math.random() * 1000
      });
    }
  }
  // v4: water droplets for the dry stage (spawned when rinsing finishes).
  function makeDrops(spec, count) {
    var drops = [];
    var half = spec.type.len / 2;
    var top = spec.type.top || 116;
    for (var i = 0; i < count; i++) {
      drops.push({
        x: rand(-half + 16, half - 16),
        y: rand(-top + 10, -16),
        r: rand(3.5, 7),
        amount: 1,
        seed: Math.random() * 1000
      });
    }
    return drops;
  }
  function dropsRemaining(c) {
    if (!c.drops.length) return 0;
    var sum = 0;
    for (var i = 0; i < c.drops.length; i++) sum += c.drops[i].amount;
    return sum / c.drops.length;
  }
  function heavyMudRemaining(c) {
    var sum = 0, n = 0;
    for (var i = 0; i < c.dirt.length; i++) {
      if (c.dirt[i].heavy) { sum += c.dirt[i].amount; n++; }
    }
    return n ? sum / n : 0;
  }
  function hasHeavyMud(c) {
    for (var i = 0; i < c.dirt.length; i++) {
      if (c.dirt[i].heavy && c.dirt[i].amount > 0.02) return true;
    }
    return false;
  }

  function pickRequest(firstOfRun, vip) {
    if (firstOfRun) return null;
    if (pendingRequest) {
      var forced = pendingRequest;
      pendingRequest = null;
      return forced;
    }
    // v3: ~1 in 2 vehicles carries a special order (up from ~1 in 3).
    if (Math.random() > 0.5) return null;
    var pool = ['windows', 'wax', 'hurry', 'perfect', 'speed', 'noscratch', 'emergency'];
    if (vip) pool.push('vipwash');
    var kind = pick(pool);
    var def = REQUEST_DEFS[kind];
    if (!def) return null; // unknown key: no order (never crash the spawn)
    var req = { type: kind };
    if (def.bonus) req.bonus = def.bonus;
    return req;
  }

  function newCar(spec) {
    var type = spec.type;
    var dirtCount = Math.round((6 + Math.min(10, Math.floor(carIndex * 0.9))) * type.dirtMul) + (spec.vip ? 4 : 0);
    dirtCount = clamp(dirtCount, 3, 24);
    var patienceMax = type.pat + dirtCount * 1.1 + (spec.vip ? 8 : 0);
    var firstOfRun = (carIndex === 1); // carIndex is already incremented in spawnNextCar
    var request = pickRequest(firstOfRun, spec.vip);
    if (request) {
      var def = REQUEST_DEFS[request.type];
      if (def && def.patMul) patienceMax *= def.patMul;
    }
    // Tight-timer orders get easy dirt (see makeDirt): rushed AND hard dirt
    // together would be nearly unwinnable without tools.
    var tightTimer = request && (request.type === 'hurry' || request.type === 'speed' || request.type === 'emergency');
    var c = {
      spec: spec,
      x: W + 220,              // starts off-screen right, drives in
      targetX: CAR_CX,
      stage: 'arriving',
      dirt: makeDirt(spec, dirtCount, tightTimer),
      foam: [],
      foamCells: [],           // v4: foam coverage grid (filled below)
      foamCovered: 0,
      drops: [],               // v4: water droplets for the dry stage
      dropsBorn: 0,            // v4: game time when the drops spawned (grace beat)
      puddle: 0,               // v4: foam puddle on the floor (0..1, grows while rinsing)
      dust: 1,                 // overall dust film (0..1)
      patience: patienceMax,
      patienceMax: patienceMax,
      washProgress: 0,
      clean: false,
      angry: false,
      bounceT: 0,
      request: request,
      waxed: false,
      waxProgress: 0,
      // v3 per-car flags.
      soaped: false,           // SOAP tapped (seals heavy mud: resist 1.2 -> 2.5)
      scratched: false,        // Power Washer used on a No-Scratch car
      scratchPenalty: 0,       // coins lost to the scratch (once per car)
      perfectOK: true,         // still eligible for the Perfect order bonus
      eventUrgent: false,      // random event: tip x2 (next-car event applied here)
      eventDoubletip: false,   // random event: tip x2
      eventTipper: false       // random event: +30 if finished with patience >= 50%
    };
    if (request && request.type === 'windows') addWindowDirt(c, 3);
    initFoamGrid(c); // v4: foam coverage grid for the foam stage
    return c;
  }

  function dirtRemaining(c) {
    if (!c.dirt.length) return 0;
    var sum = 0;
    for (var i = 0; i < c.dirt.length; i++) sum += c.dirt[i].amount;
    return sum / c.dirt.length;
  }

  // v3: one-time hint the first time each new dirt kind shows up (one per car).
  function showDirtHints(c) {
    var kinds = {};
    var hasHeavy = false;
    for (var i = 0; i < c.dirt.length; i++) {
      kinds[c.dirt[i].kind] = true;
      if (c.dirt[i].heavy) hasHeavy = true;
    }
    var hint = null;
    if (hasHeavy && !hintsShown.mud) { hint = 'mudHint'; hintsShown.mud = true; }
    else if (kinds.oil && !hintsShown.oil) { hint = 'oilHint'; hintsShown.oil = true; }
    else if (kinds.insect && !hintsShown.insect) { hint = 'insectHint'; hintsShown.insect = true; }
    else if (kinds.cement && !hintsShown.cement) { hint = 'cementHint'; hintsShown.cement = true; }
    // Drawn high in the wash bay (y=225) so it never collides with the
    // patience bar or the request chip as it floats up and fades.
    if (hint) addPopup(c.x, 225, t(hint), '#7ec8ff', 17);
  }

  function fillQueue() {
    while (queue.length < 2) {
      var upcoming = carIndex + queue.length + 1;
      var vip = (upcoming % 5 === 0);
      queue.push(randomCarSpec(vip, upcoming === 1));
    }
  }

  // ============================== Particles & popups ==============================
  function spawnParticle(x, y, vx, vy, life, size, color, type, grav) {
    if (particles.length > 220) particles.splice(0, particles.length - 220);
    particles.push({ x: x, y: y, vx: vx, vy: vy, life: life, maxLife: life,
                     size: size, color: color, type: type || 'dot', grav: grav || 0 });
  }
  function spawnFoamBurst(x, y, n) {
    for (var i = 0; i < n; i++) {
      spawnParticle(x + rand(-40, 40), y + rand(-20, 20), rand(-30, 30), rand(-70, -10),
        rand(0.5, 1.1), rand(4, 10), '#ffffff', 'bubble', -40);
    }
  }
  function spawnWater(x, y, n) {
    for (var i = 0; i < n; i++) {
      spawnParticle(x + rand(-130, 130), y + rand(-10, 10), rand(-20, 20), rand(180, 340),
        rand(0.4, 0.8), rand(2, 5), '#7ec8ff', 'drop', 500);
    }
  }
  function spawnSparkles(x, y, n) {
    for (var i = 0; i < n; i++) {
      spawnParticle(x + rand(-140, 140), y + rand(-90, 10), rand(-25, 25), rand(-60, -5),
        rand(0.5, 1.0), rand(3, 7), '#fff7ae', 'star', 30);
    }
  }
  function spawnCoinBurst(x, y, n) {
    for (var i = 0; i < n; i++) {
      spawnParticle(x + rand(-20, 20), y, rand(-90, 90), rand(-260, -120),
        rand(0.6, 1.0), rand(5, 8), '#ffd94d', 'coin', 700);
    }
  }
  function spawnPuff(x, y, color, n) {
    for (var i = 0; i < n; i++) {
      spawnParticle(x + rand(-15, 15), y + rand(-15, 15), rand(-60, 60), rand(-80, -10),
        rand(0.4, 0.8), rand(4, 9), color, 'dot', 120);
    }
  }
  function addPopup(x, y, text, color, size) {
    if (popups.length > 12) popups.shift();
    popups.push({ x: x, y: y, vy: -46, life: 1.2, text: text, color: color || '#ffffff', size: size || 26 });
  }
  function updateParticles(dt) {
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.vy += p.grav * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.type === 'bubble') p.x += Math.sin(time * 6 + p.maxLife * 40) * 12 * dt;
    }
    for (var j = popups.length - 1; j >= 0; j--) {
      var q = popups[j];
      q.life -= dt;
      if (q.life <= 0) { popups.splice(j, 1); continue; }
      q.y += q.vy * dt;
      q.vy *= (1 - 1.6 * dt);
    }
  }

  // ============================== State transitions ==============================
  function resetRun() {
    score = 0;
    wallet = 0;
    hearts = MAX_HEARTS;
    combo = 0;
    carsWashed = 0;
    carsLost = 0;
    carIndex = 0;
    lastEarned = 0;
    lastTip = 0;
    newBest = false;
    tools = { washer: false, cannon: false, brush: false, oil: false, dryer: false, polish: false };
    selectedTool = 'sponge';
    perfectStreak = 0;
    vipStreak = 0;
    carsSinceEvent = 0;
    eventGap = EVENT_GAP_MIN + Math.floor(Math.random() * (EVENT_GAP_MAX - EVENT_GAP_MIN + 1));
    activeEvent = null;
    pendingNextEvent = null;
    outageT = 0;
    eventBanner = null;
    particles.length = 0;
    popups.length = 0;
    queue.length = 0;
    car = null;
    scrubbing = false;
    waxing = false;
    dragTool = null;
    pointerWorld.active = false;
    cam = { scale: 1, panX: 0, panY: 0 };
    camTarget = { scale: 1, panX: 0, panY: 0 };
    mStats = { washed: 0, earned: 0, tips: 0, vip: 0, streak: 0, byType: {} };
    doneMissions = {};
    initMissions();
    fillQueue();
  }

  // ============================== Missions ==============================
  function eligibleMissionDefs() {
    var out = [];
    for (var i = 0; i < MISSION_DEFS.length; i++) {
      // A mission def can only be completed once per run (no re-farming).
      if (doneMissions[MISSION_DEFS[i].id]) continue;
      if ((MISSION_DEFS[i].minTier || 1) <= unlockedTier) out.push(MISSION_DEFS[i]);
    }
    return out;
  }

  function initMissions() {
    missions = [];
    var pool = eligibleMissionDefs().slice();
    while (missions.length < 3 && pool.length > 0) {
      var idx = Math.floor(Math.random() * pool.length);
      missions.push({ def: pool[idx], progress: 0 });
      pool.splice(idx, 1);
    }
  }

  function missionProgress(def) {
    if (!mStats) return 0;
    switch (def.kind) {
      case 'wash': return mStats.washed;
      case 'earn': return mStats.earned;
      case 'tip': return mStats.tips;
      case 'vip': return mStats.vip;
      case 'streak': return mStats.streak;
      case 'type': return mStats.byType[def.typeId] || 0;
    }
    return 0;
  }

  function missionText(def) {
    switch (def.kind) {
      case 'wash': return t('mWash').replace('%d', def.target);
      case 'earn': return t('mEarn').replace('%d', def.target);
      case 'tip': return t('mTip').replace('%d', def.target);
      case 'vip': return t('mVip').replace('%d', def.target);
      case 'streak': return t('mStreak').replace('%d', def.target);
      case 'type': return t('mType').replace('%s', vehicleTypeById(def.typeId).label);
    }
    return '';
  }

  function refreshMissionProgress() {
    for (var i = 0; i < missions.length; i++) {
      missions[i].progress = missionProgress(missions[i].def);
    }
  }

  function replaceMission(slot) {
    var activeIds = {};
    for (var i = 0; i < missions.length; i++) activeIds[missions[i].def.id] = true;
    var pool = [];
    var elig = eligibleMissionDefs();
    for (var j = 0; j < elig.length; j++) {
      if (!activeIds[elig[j].id]) pool.push(elig[j]);
    }
    if (!pool.length) { missions.splice(slot, 1); return; } // pool exhausted: slot closes
    missions[slot] = { def: pick(pool), progress: 0 };
    missions[slot].progress = missionProgress(missions[slot].def);
  }

  function checkMissions() {
    // Loop until nothing is completable: a replacement mission may already
    // be satisfied by work done earlier in this run (e.g. wash5 drawn after
    // 7 washes) and must pay out immediately, not sit at 7/5. Each def pays
    // at most once per run (doneMissions), so the loop always terminates;
    // the guard is belt-and-braces.
    refreshMissionProgress();
    var guard = 0;
    var changed = true;
    while (changed && guard++ < 20) {
      changed = false;
      for (var i = 0; i < missions.length; i++) {
        var m = missions[i];
        if (m.progress >= m.def.target && !doneMissions[m.def.id]) {
          var reward = m.def.reward;
          doneMissions[m.def.id] = true;
          wallet += reward;
          bank += reward;
          Bridge.saveProgress('bank', bank);
          addPopup(W / 2, 300, t('missionDone') + ' +' + reward, '#ffd94d', 28);
          AudioSys.buy();
          spawnCoinBurst(W / 2, 320, 14);
          replaceMission(i);
          refreshMissionProgress();
          changed = true;
        }
      }
    }
  }

  function startRun() {
    AudioSys.unlock();
    AudioSys.click();
    resetRun();
    state = 'playing';
    spawnNextCar();
    Bridge.send('level_started');
  }

  function spawnNextCar() {
    fillQueue();
    var spec = queue.shift();
    carIndex++; // count this car BEFORE refilling, so the VIP-every-5th
    fillQueue(); // math in fillQueue (carIndex + queue.length + 1) is exact
    // v3: a pending next-car event applies to this car before it is built.
    if (pendingNextEvent === 'vipnext') {
      spec.vip = true;
      spec.color = '#ffd700';
    }
    car = newCar(spec);
    if (pendingNextEvent === 'urgent') {
      car.eventUrgent = true;
      car.patienceMax *= 0.7;
      car.patience = car.patienceMax;
    }
    pendingNextEvent = null;
    activeEvent = null;
    outageT = 0; // an outage never carries over to the next car
    stageAnimT = 0;
    shineT = -1;
    AudioSys.horn();
    AudioSys.vroom();
    rollRandomEvent();
  }

  // ============================== Random events (v3) ==============================
  // Roughly one event every 3-5 cars, never on the first two cars of a run,
  // never more than one active at a time. Events feel like bonuses/surprises;
  // the water outage is the only disruptive one (short, clearly explained).
  function showEventBanner(text, color) {
    eventBanner = { text: text, color: color || '#2563eb', t: 3 };
  }

  function applyEventToCurrentCar(kind) {
    if (!car) return;
    if (kind === 'tipper') {
      activeEvent = 'tipper';
      car.eventTipper = true;
      showEventBanner(t('evTipper'), '#16a34a');
    } else if (kind === 'outage') {
      activeEvent = 'outage';
      outageT = OUTAGE_SECS;
      showEventBanner(t('evOutage'), '#dc2626');
      AudioSys.denied();
    } else if (kind === 'doubletip') {
      activeEvent = 'doubletip';
      car.eventDoubletip = true;
      showEventBanner(t('evDoubleTip'), '#d97706');
    }
  }

  function triggerEvent(kind) {
    // 'urgent' and 'vipnext' target the NEXT car; the rest hit the current one.
    if (kind === 'urgent') {
      pendingNextEvent = 'urgent';
      showEventBanner(t('evUrgent'), '#dc2626');
    } else if (kind === 'vipnext') {
      pendingNextEvent = 'vipnext';
      showEventBanner(t('evVipNext'), '#ca8a04');
    } else {
      applyEventToCurrentCar(kind);
    }
    AudioSys.ding();
  }

  function rollRandomEvent() {
    if (carIndex < 3) return; // never on the first two cars of a run
    carsSinceEvent++;
    if (carsSinceEvent < eventGap) return;
    carsSinceEvent = 0;
    eventGap = EVENT_GAP_MIN + Math.floor(Math.random() * (EVENT_GAP_MAX - EVENT_GAP_MIN + 1));
    // Outage is rarer (weighted pool).
    var pool = ['tipper', 'doubletip', 'urgent', 'vipnext', 'tipper', 'doubletip', 'outage'];
    triggerEvent(pick(pool));
  }

  function pauseGame(source) {
    if (state !== 'playing' && state !== 'shop') return;
    pausedFrom = state;
    state = 'paused';
    pausedBy = source;
    scrubbing = false;
    waxing = false;
    dragTool = null;
    pointerWorld.active = false;
    AudioSys.setPaused(true);
    Bridge.send('level_paused');
  }

  function resumeGame() {
    if (state !== 'paused') return;
    state = pausedFrom;
    pausedBy = null;
    AudioSys.setPaused(false);
    AudioSys.click();
    Bridge.send('level_resumed');
  }

  function toMenu() {
    AudioSys.click();
    AudioSys.setPaused(false);
    pausedBy = null;
    scrubbing = false;
    waxing = false;
    resetRun();
    // A dirty car waits in the bay on the menu (instant hook).
    car = newCar(randomCarSpec(false));
    car.x = CAR_CX;
    car.stage = 'foam';
    car.patience = car.patienceMax;
    state = 'menu';
  }

  function toggleMute() {
    AudioSys.unlock();
    AudioSys.setUserMuted(!AudioSys.userMuted);
    if (!AudioSys.userMuted) AudioSys.click();
    Bridge.saveProgress('muted', AudioSys.userMuted ? '1' : '0');
  }

  function gameOver() {
    if (state === 'over') return;
    state = 'over';
    overAt = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
    AudioSys.sad();
    if (score > best) {
      best = score;
      newBest = true;
      Bridge.saveProgress('best_score', best);
      Bridge.send('player_got_achievement');
    }
    Bridge.send('level_failed');
    Bridge.showInterstitial();
  }

  function onPlatformPause(isPaused) {
    if (isPaused) {
      if (state === 'playing' || state === 'shop') pauseGame('platform');
    } else {
      if (state === 'paused' && pausedBy === 'platform') resumeGame();
    }
  }

  // ============================== Stage logic (v4: all drag-based) ==============================
  function advanceStage() {
    if (!car) return;
    var idx = STAGE_ORDER.indexOf(car.stage);
    if (idx < 0 || idx >= STAGE_ORDER.length - 1) return;
    var next = STAGE_ORDER[idx + 1];
    // Leaving the foam stage: the car is now soaped. Heavy mud stays visible
    // THROUGH the foam (v3 layering, adapted): foam alone never removes it,
    // only the pressure wash does.
    if (car.stage === 'foam') completeFoam();
    // The pressure stage is skipped when the car has no heavy mud.
    if (next === 'pressure' && !hasHeavyMud(car)) {
      next = 'scrub';
      addPopup(car.x, CAR_GROUND - 130, t('noMud'), '#7ec8ff', 20);
    }
    car.stage = next;
    carBounce = 1;
    if (next === 'rinse') {
      if (outageT > 0) {
        // v3 water outage: can't rinse yet — wait for the water to return.
        car.stage = 'nowater';
        addPopup(car.x, CAR_GROUND - 130, t('noWater'), '#ff7b7b', 24);
      } else {
        AudioSys.splash();
      }
    } else if (next === 'dry') {
      // Water droplets appear for the towel to wipe away.
      var dropCount = Math.round(22 * clamp(car.spec.type.len / 300, 0.6, 1.4));
      car.drops = makeDrops(car.spec, dropCount);
      car.dropsBorn = time;
    }
    AudioSys.ding();
  }

  function completeFoam() {
    car.soaped = true;
    // Soap softens bird droppings (they are very hard to scrub dry).
    var hasBird = false;
    for (var i = 0; i < car.dirt.length; i++) {
      if (car.dirt[i].kind === 'bird') { car.dirt[i].softened = true; hasBird = true; }
    }
    if (hasBird && !birdHintShown) {
      birdHintShown = true;
      addPopup(car.x, 225, t('birdHint'), '#7ec8ff', 17);
    }
  }

  // Drying finished: a short shine sweep, then the wax step (if requested)
  // or payment. (The 'drying' update branch runs the sweep.)
  function completeDry() {
    car.stage = 'drying';
    stageAnimT = 0;
    dryDur = 0.6 / animSpeed();
    shineT = 0;
    spawnSparkles(car.x, CAR_GROUND - 60, 18);
    AudioSys.ding();
  }

  function finishCar() {
    // Payment: base + tip (patience fraction) x streak multiplier, + bonuses.
    var spec = car.spec;
    var base = spec.type.base * (spec.vip ? 2.2 : 1);
    var patienceFrac = clamp(car.patience / car.patienceMax, 0, 1);
    // v3 quality: a wash is "perfect" with no scratch mistake and enough
    // patience left (Polish Tool lowers the bar from 0.40 to 0.25).
    var perfectThreshold = tools.polish ? 0.25 : 0.4;
    var isPerfect = !car.scratched && patienceFrac >= perfectThreshold;
    if (isPerfect) {
      perfectStreak++;
      if (perfectStreak >= 2) {
        addPopup(car.x, CAR_GROUND - 178, t('perfectStreak') + ' x' + perfectStreak + '!', '#ffd93b', 22);
        AudioSys.ding();
      }
    } else {
      perfectStreak = 0;
    }
    // v3 VIP combo: consecutive VIP washes pay extra.
    if (spec.vip) {
      vipStreak++;
    } else {
      vipStreak = 0;
    }
    var tip = Math.round(base * 0.8 * patienceFrac * tipBonus());
    if (car.request && car.request.type === 'hurry') tip *= REQUEST_DEFS.hurry.tipMul;
    if (car.eventUrgent || car.eventDoubletip) tip *= 2;
    var mult = streakMult();
    var earned = Math.round((base + tip) * mult);
    var bonus = 0;
    var req = car.request;
    if (req) {
      if (req.type === 'windows') bonus += req.bonus;
      else if (req.type === 'wax' && car.waxed) bonus += req.bonus;
      else if (req.type === 'speed') bonus += req.bonus;
      else if (req.type === 'perfect' && car.perfectOK && !car.scratched) bonus += req.bonus;
      else if (req.type === 'noscratch' && !car.scratched) bonus += req.bonus;
      else if (req.type === 'vipwash') bonus += req.bonus;
      if (req.type === 'emergency') earned *= REQUEST_DEFS.emergency.payMul;
    }
    // v3 speed bonus: finish with lots of patience left.
    var speedBonus = 0;
    if (patienceFrac >= 0.6) speedBonus = Math.round(base * 0.15);
    // v3 event + tool bonuses.
    if (car.eventTipper && patienceFrac >= 0.5) bonus += 30;
    if (vipStreak >= 2) bonus += 20;
    if (tools.polish) bonus += 15;
    earned += bonus + speedBonus;
    // v3 No-Scratch penalty (once per car, already warned).
    if (car.scratchPenalty > 0) earned = Math.max(0, earned - car.scratchPenalty);
    lastEarned = earned;
    lastTip = tip;
    score += earned;
    wallet += earned;
    bank += earned;
    Bridge.saveProgress('bank', bank);
    carsWashed++;
    combo++;
    if (mStats) {
      mStats.washed++;
      mStats.earned += earned;
      mStats.tips += tip;
      if (spec.vip) mStats.vip++;
      mStats.streak++;
      mStats.byType[spec.type.id] = (mStats.byType[spec.type.id] || 0) + 1;
    }
    spawnCoinBurst(car.x, CAR_GROUND - 90, 16);
    addPopup(car.x, CAR_GROUND - 150, '+' + earned, '#ffd94d', 34);
    if (tip > 0) addPopup(car.x, CAR_GROUND - 118, t('tip') + ' +' + tip, '#7CFC9A', 20);
    if (bonus > 0) addPopup(car.x, CAR_GROUND - 94, '+' + bonus, '#7ec8ff', 20);
    if (speedBonus > 0) addPopup(car.x, CAR_GROUND - 70, t('speedBonus') + ' +' + speedBonus, '#f0abfc', 18);
    if (tools.polish) spawnSparkles(car.x, CAR_GROUND - 60, 10);
    AudioSys.coin();
    checkMissions();
    car.clean = true;
    car.stage = 'leaving';
    stageAnimT = 0;
    scrubbing = false;
    waxing = false;
    dragTool = null;
    pointerWorld.active = false;
  }

  function loseCustomer() {
    if (!car) return;
    carsLost++;
    hearts--;
    combo = 0;
    perfectStreak = 0; // a lost customer breaks the Perfect Streak
    vipStreak = 0;
    if (mStats) mStats.streak = 0;
    car.angry = true;
    car.stage = 'leaving';
    stageAnimT = 0;
    scrubbing = false;
    waxing = false;
    dragTool = null;
    pointerWorld.active = false;
    addPopup(car.x, CAR_GROUND - 150, t('lostCustomer'), '#ff7b7b', 20);
    AudioSys.sad();
    spawnPuff(car.x, CAR_GROUND - 60, '#94a3b8', 8);
  }

  function buyTool(id) {
    var def = TOOLS[id];
    if (!def || tools[id]) { AudioSys.denied(); return; }
    if (wallet < def.price) { AudioSys.denied(); return; }
    wallet -= def.price;
    tools[id] = true;
    AudioSys.buy();
    spawnSparkles(W / 2, 420, 10);
  }

  function nextLockedTier() {
    for (var i = 0; i < TIERS.length; i++) {
      if (TIERS[i].id > unlockedTier) return TIERS[i];
    }
    return null;
  }

  function buyTier() {
    var next = nextLockedTier();
    if (!next) { AudioSys.denied(); return false; }
    if (bank < next.price) { AudioSys.denied(); return false; }
    bank -= next.price;
    unlockedTier = next.id;
    Bridge.saveProgress('bank', bank);
    Bridge.saveProgress('unlocked_tier', unlockedTier);
    AudioSys.buy();
    spawnSparkles(W / 2, 360, 24);
    addPopup(W / 2, 300, t('tierUnlocked') + ' ' + t(next.key), '#ffd94d', 26);
    return true;
  }

  // ============================== Drag actions (v4) ==============================
  // All apply* functions take WORLD coords (the input handler converts the
  // pointer through the camera transform first), so dragging hits exactly
  // where the finger is at every zoom/pan.
  function carBounds(c) {
    // Generous margins: small vehicles (motorcycle) must stay easy to grab.
    var half = c.spec.type.len / 2;
    var top = c.spec.type.top || 116;
    return { x: c.x - half - 45, y: CAR_GROUND - top - 26, w: c.spec.type.len + 90, h: top + 36 };
  }

  // v4 No-Scratch check, shared by the pressure and scrub stages: the Power
  // Washer on a sensitive car costs 20 coins, once per car. The player was
  // warned (chip + red tool border), so it is never a surprise.
  function checkScratch() {
    if (selectedTool === 'washer' && car && car.request && car.request.type === 'noscratch' && !car.scratched) {
      car.scratched = true;
      car.scratchPenalty = 20;
      addPopup(car.x, CAR_GROUND - 150, t('scratchPenalty') + ' -20', '#ff7b7b', 24);
      AudioSys.denied();
    }
  }

  // FOAM: the spray covers the cells it passes over; foam blobs appear where
  // it lands. Completes at 90% coverage.
  function applyFoam(wx, wy) {
    if (!car || car.stage !== 'foam') return false;
    var r = FOAM_SPRAY_RADIUS * (tools.cannon ? 1.4 : 1);
    var lx = wx - car.x, ly = wy - CAR_GROUND;
    var coveredAny = false;
    for (var i = 0; i < car.foamCells.length; i++) {
      var cell = car.foamCells[i];
      if (cell.covered) continue;
      var dx = lx - cell.x, dy = ly - cell.y;
      if (Math.sqrt(dx * dx + dy * dy) < r) {
        cell.covered = true;
        car.foamCovered++;
        foamBlobsForCell(car, cell);
        coveredAny = true;
      }
    }
    if (coveredAny) {
      if (Math.random() < 0.5) {
        spawnParticle(wx + rand(-12, 12), wy + rand(-12, 12), rand(-20, 20), rand(-50, -10),
          rand(0.3, 0.6), rand(3, 7), '#ffffff', 'bubble', -30);
      }
      if (Math.random() < 0.25) AudioSys.foamPop();
    }
    if (foamCoverage(car) >= FOAM_COVER_TARGET) {
      spawnFoamBurst(car.x, CAR_GROUND - 60, tools.cannon ? 34 : 22);
      AudioSys.foamPop();
      advanceStage(); // foam -> pressure (or scrub if no heavy mud)
    }
    return coveredAny;
  }

  // PRESSURE WASH: the water spray blasts HEAVY MUD only (regular dirt stays
  // for the sponge). Heavy mud was sealed in by the foam: 5x with the basic
  // hose, 2x with the Power Washer. Completes when the heavy mud is gone.
  function applyPressure(wx, wy) {
    if (!car || car.stage !== 'pressure') return false;
    checkScratch();
    var r = PRESSURE_RADIUS * (selectedTool === 'washer' ? 1.25 : 1);
    var power = BASE_SCRUB_POWER * (selectedTool === 'washer' ? 2.5 : 1);
    var resist = selectedTool === 'washer' ? 2.0 : 5.0;
    var lx = wx - car.x, ly = wy - CAR_GROUND;
    var cleanedAny = false;
    for (var i = 0; i < car.dirt.length; i++) {
      var d = car.dirt[i];
      if (d.amount <= 0 || !d.heavy) continue;
      var dx = lx - d.x, dy = ly - d.y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < r + d.r * 0.6) {
        var fall = 1 - clamp(dist / (r + d.r * 0.6), 0, 1) * 0.6;
        d.amount = Math.max(0, d.amount - (power / resist) * fall);
        cleanedAny = true;
        // Mud chunks loosen and wash away with the water.
        if (Math.random() < 0.4) {
          spawnParticle(wx + rand(-14, 14), wy + rand(-8, 8), rand(-30, 30), rand(40, 120),
            rand(0.3, 0.5), rand(2, 5), '#6b4a2b', 'dot', 300);
        }
      }
    }
    if (cleanedAny) {
      if (Math.random() < 0.6) {
        spawnParticle(wx + rand(-10, 10), wy + rand(-10, 10), rand(-40, 40), rand(60, 160),
          rand(0.3, 0.5), rand(2, 4), '#7ec8ff', 'drop', 400);
      }
      AudioSys.scrubTick();
    }
    if (!hasHeavyMud(car)) {
      for (var k = 0; k < car.dirt.length; k++) if (car.dirt[k].heavy) car.dirt[k].amount = 0;
      addPopup(car.x, CAR_GROUND - 130, t('scrub') + '!', '#ffffff', 24);
      advanceStage(); // pressure -> scrub
    }
    return cleanedAny;
  }

  function foamTotal(c) {
    if (!c.foam.length) return 0;
    var sum = 0;
    for (var i = 0; i < c.foam.length; i++) sum += c.foam[i].amount;
    return sum / c.foam.length;
  }

  // RINSE: the spray washes the foam off where it passes; foam runs DOWN and
  // collects in a puddle on the floor. Completes when the foam is gone.
  // During a water outage the spray does nothing (the outage always ends).
  function applyRinse(wx, wy) {
    if (!car || car.stage !== 'rinse') return false;
    if (outageT > 0) return false;
    var r = RINSE_RADIUS;
    var lx = wx - car.x, ly = wy - CAR_GROUND;
    var rinsedAny = false;
    for (var i = 0; i < car.foam.length; i++) {
      var f = car.foam[i];
      if (f.amount <= 0) continue;
      var dx = lx - f.x, dy = ly - f.y;
      if (Math.sqrt(dx * dx + dy * dy) < r) {
        f.amount = Math.max(0, f.amount - 0.12);
        rinsedAny = true;
      }
    }
    if (rinsedAny) {
      car.dust = Math.max(0, car.dust - 0.02);
      car.puddle = clamp(1 - foamTotal(car), 0, 1);
      if (Math.random() < 0.5) {
        spawnParticle(wx + rand(-8, 8), wy + rand(-4, 4), rand(-10, 10), rand(120, 220),
          rand(0.3, 0.5), rand(2, 4), '#dbeafe', 'drop', 500);
      }
      AudioSys.scrubTick();
    }
    if (foamTotal(car) <= 0.02) {
      car.foam.length = 0;
      car.dust = 0;
      car.puddle = 1;
      addPopup(car.x, CAR_GROUND - 160, t('dry') + '!', '#fff7ae', 24);
      advanceStage(); // rinse -> dry (drops appear)
    }
    return rinsedAny;
  }

  // DRY: the towel wipes water droplets away where it passes, with sparkles
  // on dried areas. The Turbo Dryer makes the towel wider. Completes when
  // the droplets are (nearly) gone.
  function applyDry(wx, wy) {
    if (!car || car.stage !== 'dry') return false;
    // Grace beat: the drops need a moment to appear (and be seen) before
    // the towel can wipe them — otherwise the tail of the rinse drag wipes
    // most of them before the player ever notices the dry stage.
    if (time - car.dropsBorn < 0.4) return false;
    var r = DRY_RADIUS * (tools.dryer ? 1.35 : 1);
    var lx = wx - car.x, ly = wy - CAR_GROUND;
    var driedAny = false;
    for (var i = 0; i < car.drops.length; i++) {
      var d = car.drops[i];
      if (d.amount <= 0) continue;
      var dx = lx - d.x, dy = ly - d.y;
      if (Math.sqrt(dx * dx + dy * dy) < r) {
        d.amount = Math.max(0, d.amount - 0.15);
        driedAny = true;
      }
    }
    if (driedAny) {
      if (Math.random() < 0.4) spawnSparkles(wx, wy, 1);
      AudioSys.scrubTick();
    }
    if (dropsRemaining(car) <= 0.05) {
      for (var k = 0; k < car.drops.length; k++) car.drops[k].amount = 0;
      completeDry(); // shine sweep, then wax or payment
    }
    return driedAny;
  }

  function dirtResist(d) {
    // v3: resistance depends on the dirt kind, the selected tool and whether
    // the car was already soaped (soap seals heavy mud in). Values are high
    // because one scrub pass hits each patch ~20-30 times: resist 1 clears
    // in ~1 pass, resist 4 in ~3 passes, resist 8 in ~5 passes. Hard dirt
    // without its tool is slow but winnable — a bus with cement/oil must
    // still be scrubbable inside its patience, just barely.
    if (d.kind === 'mud' && d.heavy) {
      if (selectedTool === 'washer') return 2.0;
      return (car && car.soaped) ? 5.0 : 4.0;
    }
    if (d.kind === 'mud') return selectedTool === 'washer' ? 0.7 : 1.0;
    if (d.kind === 'oil') return tools.oil ? 1.0 : 8.0;
    if (d.kind === 'insect') return selectedTool === 'brush' ? 1.0 : 6.0;
    if (d.kind === 'cement') return selectedTool === 'brush' ? 1.5 : 8.0;
    if (d.kind === 'tar') return selectedTool === 'brush' ? 1.2 : 2.0;
    var kind = DIRT_KINDS[d.kind] || DIRT_KINDS.mud;
    if (d.kind === 'bird' && !d.softened) return kind.resistUnsoaped;
    return kind.resist;
  }

  // SCRUB: the sponge the player moves directly; each swipe cleans an area
  // and leaves a foam trail. All v3 dirt-layer rules apply (oil needs the
  // Oil Cleaner, insects/cement need the Special Brush, tar needs passes).
  function applyScrub(wx, wy) {
    if (!car || car.stage !== 'scrub') return false;
    checkScratch();
    var r = scrubRadius();
    var power = scrubPower();
    var cleanedAny = false;
    var lx = wx - car.x, ly = wy - CAR_GROUND;
    for (var i = 0; i < car.dirt.length; i++) {
      var d = car.dirt[i];
      if (d.amount <= 0) continue;
      var dx = lx - d.x, dy = ly - d.y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < r + d.r * 0.6) {
        var fall = 1 - clamp(dist / (r + d.r * 0.6), 0, 1) * 0.6;
        d.amount = Math.max(0, d.amount - (power / dirtResist(d)) * fall);
        cleanedAny = true;
      }
    }
    // v4: the sponge thins the foam right under the finger (clean streaks
    // appear) but does NOT strip it — most of the foam must survive to the
    // rinse stage, or rinsing would have nothing to wash off. The rate is
    // deliberately tiny: a thorough scrub hits each blob dozens of times,
    // and even power * 0.5 cleared the truck's foam before rinse started.
    for (var j = 0; j < car.foam.length; j++) {
      var f = car.foam[j];
      if (f.amount <= 0) continue;
      var fdx = lx - f.x, fdy = ly - f.y;
      if (Math.sqrt(fdx * fdx + fdy * fdy) < r * 0.6) {
        f.amount = Math.max(0, f.amount - power * 0.15);
        cleanedAny = true;
      }
    }
    if (cleanedAny) {
      car.dust = Math.max(0, car.dust - power * 0.5);
      AudioSys.scrubTick();
      // Particles match the selected tool (water jet / brush dust / foam).
      if (selectedTool === 'washer') {
        if (Math.random() < 0.7) {
          spawnParticle(wx + rand(-10, 10), wy + rand(-10, 10), rand(-40, 40), rand(60, 160),
            rand(0.3, 0.5), rand(2, 4), '#7ec8ff', 'drop', 400);
        }
      } else {
        if (Math.random() < 0.5) {
          spawnParticle(wx + rand(-14, 14), wy + rand(-14, 14), rand(-20, 20), rand(-50, -10),
            rand(0.3, 0.6), rand(3, 7), '#ffffff', 'bubble', -30);
        }
      }
      if (Math.random() < 0.25) {
        spawnParticle(wx, wy, rand(-30, 30), rand(-20, 40),
          rand(0.3, 0.5), rand(2, 4), '#8a6d4b', 'dot', 200);
      }
    }
    var remaining = dirtRemaining(car);
    car.washProgress = 1 - remaining;
    if (remaining <= 0.02) {
      // Clean sweep: no half-visible speck may survive.
      for (var k = 0; k < car.dirt.length; k++) car.dirt[k].amount = 0;
      car.dust = 0;
      car.washProgress = 1;
      if (outageT <= 0) addPopup(car.x, CAR_GROUND - 145, t('rinse') + '!', '#7ec8ff', 24);
      advanceStage(); // scrub -> rinse (or 'nowater' if the water is out)
    }
    return cleanedAny;
  }

  // ============================== Updates ==============================
  function updatePlaying(dt) {
    updateClouds(dt);
    updateParticles(dt);
    hintPulse += dt;
    if (carBounce > 0) carBounce = Math.max(0, carBounce - dt * 2.2);

    if (!car) return;
    var c = car;

    if (c.stage === 'arriving') {
      // v4: the car drives in from the side and stops in the wash bay — a
      // short (~1s) animation, no long wait. Patience starts once it stops.
      var dx = c.targetX - c.x;
      c.x += dx * Math.min(1, dt * 4.5);
      c.bounceT += dt;
      if (Math.abs(dx) < 3) {
        c.x = c.targetX;
        c.stage = 'foam';
        addPopup(c.x, CAR_GROUND - 175, t('foam') + '!', '#ffffff', 24);
        showDirtHints(c); // v3: one-time hint for each new dirt kind
      }
      return;
    }

    if (c.stage === 'leaving') {
      stageAnimT += dt;
      c.x -= 420 * dt;
      c.bounceT += dt;
      if (c.x < -260) {
        car = null;
        if (hearts <= 0) { gameOver(); return; }
        if (c.clean) {
          state = 'shop';
          shopAutoT = 12; // auto-continue after 12s (missions + tier card to read)
        } else {
          spawnNextCar();
        }
      }
      return;
    }

    // v3: the water outage always ends on its own (never soft-locks the game).
    if (outageT > 0) outageT = Math.max(0, outageT - dt);
    if (eventBanner && eventBanner.t > 0) eventBanner.t -= dt;

    // Patience drains while the car is being washed.
    if (c.stage === 'foam' || c.stage === 'pressure' || c.stage === 'scrub' || c.stage === 'nowater' || c.stage === 'rinse' || c.stage === 'dry' || c.stage === 'drying' || c.stage === 'wax') {
      c.patience -= dt;
      // v3 Perfect order: patience must never drop below 50%.
      if (c.request && c.request.type === 'perfect' && c.patience / c.patienceMax < 0.5) {
        c.perfectOK = false;
      }
      if (c.patience <= 0) {
        c.patience = 0;
        loseCustomer();
        return;
      }
    }

    // v4 safety nets: no drag stage may stall if its goal is already met
    // (e.g. the foam was popped during scrubbing, or a debug hook cleared
    // the dirt). Each stage advances on its own instead of waiting forever.
    if (c.stage === 'foam' && foamCoverage(c) >= FOAM_COVER_TARGET) {
      advanceStage();
      return;
    }
    if (c.stage === 'pressure' && !hasHeavyMud(c)) {
      advanceStage();
      return;
    }
    if (c.stage === 'scrub' && dirtRemaining(c) <= 0.02) {
      for (var z = 0; z < c.dirt.length; z++) c.dirt[z].amount = 0;
      c.dust = 0;
      c.washProgress = 1;
      advanceStage(); // scrub -> rinse (or 'nowater' if the water is out)
      return;
    }
    if (c.stage === 'rinse' && foamTotal(c) <= 0.02) {
      c.foam.length = 0;
      c.dust = 0;
      c.puddle = 1;
      advanceStage(); // rinse -> dry
      return;
    }
    if (c.stage === 'dry' && dropsRemaining(c) <= 0.05) {
      completeDry();
      return;
    }

    // v3 water outage: wait here until the water returns, then rinse.
    if (c.stage === 'nowater') {
      if (outageT <= 0) {
        c.stage = 'rinse';
        AudioSys.splash();
        addPopup(c.x, CAR_GROUND - 140, t('waterBack'), '#7ec8ff', 20);
      }
      return;
    }

    if (c.stage === 'drying') {
      stageAnimT += dt;
      shineT = clamp(stageAnimT / dryDur, 0, 1);
      if (Math.random() < 0.5) spawnSparkles(c.x + rand(-130, 130), CAR_GROUND - rand(10, 100), 1);
      if (stageAnimT >= dryDur) {
        shineT = -1;
        if (c.request && c.request.type === 'wax' && !c.waxed) {
          // Optional wax step: drag in circles for a bonus, or skip it.
          c.stage = 'wax';
          c.waxProgress = 0;
          addPopup(c.x, CAR_GROUND - 140, t('wax') + '! +' + c.request.bonus, '#ffd93b', 24);
          AudioSys.ding();
        } else {
          finishCar();
        }
      }
      return;
    }

    if (c.stage === 'wax') {
      if (c.waxProgress >= 1) {
        c.waxed = true;
        finishCar();
      }
      return;
    }
  }

  function updateShop(dt) {
    updateClouds(dt);
    updateParticles(dt);
    hintPulse += dt;
    if (shopAutoT > 0) {
      shopAutoT -= dt;
      if (shopAutoT <= 0) {
        state = 'playing';
        spawnNextCar();
      }
    }
  }

  function updateMenu(dt) {
    updateClouds(dt);
    updateParticles(dt);
    hintPulse += dt;
    if (car) car.bounceT += dt;
    if (carBounce > 0) carBounce = Math.max(0, carBounce - dt * 2.2);
  }

  function updateOver(dt) {
    updateClouds(dt);
    updateParticles(dt);
    if (car) { car.x -= 200 * dt; }
  }

  function updateClouds(dt) {
    for (var i = 0; i < clouds.length; i++) {
      clouds[i].x += clouds[i].v * dt;
      if (clouds[i].x > W + 90) clouds[i].x = -90;
    }
  }

  function initScenery() {
    clouds = [];
    for (var i = 0; i < 5; i++) {
      clouds.push({ x: rand(-60, W), y: rand(70, 210), s: rand(0.7, 1.3), v: rand(6, 14) });
    }
  }

  // ============================== Drawing helpers ==============================
  function flatText(str, x, y, font, fill, align, baseline) {
    ctx.font = font;
    ctx.fillStyle = fill;
    ctx.textAlign = align || 'center';
    ctx.textBaseline = baseline || 'alphabetic';
    ctx.fillText(str, x, y);
  }
  function textWithShadow(str, x, y, font, fill, shadow, dy) {
    ctx.font = font;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = shadow;
    ctx.fillText(str, x, y + (dy || 3));
    ctx.fillStyle = fill;
    ctx.fillText(str, x, y);
  }
  function ellipse(c, x, y, rx, ry) {
    c.beginPath();
    c.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    c.fill();
  }
  function shade(hex, amt) {
    // Lighten (amt>0) or darken (amt<0) a #rrggbb color.
    var n = parseInt(hex.slice(1), 16);
    var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    r = clamp(r + amt, 0, 255); g = clamp(g + amt, 0, 255); b = clamp(b + amt, 0, 255);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }
  function drawButton(r, label, bg, fg, font, disabled) {
    ctx.fillStyle = disabled ? '#94a3b8' : shade(bg, -45);
    rr(ctx, r.x, r.y + 4, r.w, r.h, 14);
    ctx.fill();
    ctx.fillStyle = disabled ? '#cbd5e1' : bg;
    rr(ctx, r.x, r.y, r.w, r.h, 14);
    ctx.fill();
    flatText(label, r.x + r.w / 2, r.y + r.h / 2 + 1, font || 'bold 22px Arial, sans-serif', fg || '#ffffff', 'center', 'middle');
  }
  function drawCoinIcon(x, y, r) {
    ctx.fillStyle = '#f59e0b';
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffd94d';
    ctx.beginPath(); ctx.arc(x, y, r * 0.78, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#b45309';
    ctx.font = 'bold ' + Math.round(r * 1.1) + 'px Arial, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('$', x, y + 1);
  }
  function drawHeart(x, y, s, filled) {
    ctx.fillStyle = filled ? '#ef4444' : '#cbd5e1';
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.35);
    ctx.bezierCurveTo(x, y, x - s * 0.55, y - s * 0.1, x - s * 0.55, y + s * 0.15);
    ctx.bezierCurveTo(x - s * 0.55, y + s * 0.45, x, y + s * 0.7, x, y + s * 0.95);
    ctx.bezierCurveTo(x, y + s * 0.7, x + s * 0.55, y + s * 0.45, x + s * 0.55, y + s * 0.15);
    ctx.bezierCurveTo(x + s * 0.55, y - s * 0.1, x, y, x, y + s * 0.35);
    ctx.fill();
    if (filled) {
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ellipse(ctx, x - s * 0.28, y + s * 0.12, s * 0.14, s * 0.1);
    }
  }
  function drawStar(x, y, r, color, rot) {
    ctx.fillStyle = color;
    ctx.beginPath();
    for (var i = 0; i < 8; i++) {
      var a = (rot || 0) + i * Math.PI / 4;
      var rad = (i % 2 === 0) ? r : r * 0.45;
      var px = x + Math.cos(a) * rad, py = y + Math.sin(a) * rad;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
  }

  // ============================== Background ==============================
  function drawSky() {
    if (!skyGrad) {
      skyGrad = ctx.createLinearGradient(0, 0, 0, 620);
      skyGrad.addColorStop(0, '#6ec1ff');
      skyGrad.addColorStop(0.55, '#a5dcff');
      skyGrad.addColorStop(1, '#d9f2ff');
    }
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, 620);
    // Sun with soft glow.
    var sx = 72, sy = 92;
    var glow = ctx.createRadialGradient(sx, sy, 10, sx, sy, 70);
    glow.addColorStop(0, 'rgba(255, 236, 120, 0.9)');
    glow.addColorStop(1, 'rgba(255, 236, 120, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(sx - 70, sy - 70, 140, 140);
    ctx.fillStyle = '#ffe94d';
    ctx.beginPath(); ctx.arc(sx, sy, 30, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff7ae';
    ctx.beginPath(); ctx.arc(sx - 7, sy - 7, 18, 0, Math.PI * 2); ctx.fill();
    // Clouds.
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    for (var i = 0; i < clouds.length; i++) {
      var cl = clouds[i];
      var s = cl.s;
      ellipse(ctx, cl.x, cl.y, 34 * s, 16 * s);
      ellipse(ctx, cl.x - 24 * s, cl.y + 5 * s, 22 * s, 12 * s);
      ellipse(ctx, cl.x + 26 * s, cl.y + 5 * s, 24 * s, 13 * s);
    }
    // Distant city silhouettes.
    ctx.fillStyle = '#b7d9f2';
    var bx = 0;
    for (var b = 0; b < 8; b++) {
      var bw = 52 + hash(b * 3 + 1) * 46;
      var bh = 60 + hash(b * 7 + 2) * 90;
      ctx.fillRect(bx, 420 - bh, bw, bh);
      bx += bw + 6;
    }
    // Trees at the sides.
    drawTree(24, 420);
    drawTree(456, 420);
  }
  function drawTree(x, y) {
    ctx.fillStyle = '#8d5a2b';
    ctx.fillRect(x - 5, y - 34, 10, 34);
    ctx.fillStyle = '#4caf50';
    ctx.beginPath(); ctx.arc(x, y - 48, 24, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#66bb6a';

  }

  function drawWashBuilding() {

    // Sign bubbles.

  function drawBrush(x, topY, sway) {

  function drawGround() {
    if (!groundGrad) {
      groundGrad = ctx.createLinearGradient(0, 560, 0, 800);

      groundGrad.addColorStop(0.35, '#b0bec5');

  // ============================== Car rendering ==============================
  // Draws a side-view vehicle facing LEFT. (cx, gy) = center x, wheel-bottom y.
  function drawCarShape(cx, gy, spec, scale, opts) {
    opts = opts || {};
    var type = spec.type;
    var half = type.len * scale / 2;
    ctx.save();
    // Ground shadow (v4 3/4 view: wider, shifted slightly right).
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ellipse(ctx, cx + 8 * scale, gy + 3 * scale, half * 1.06, 10 * scale);
    if (type.kind === 'moto') drawMotoShape(cx, gy, spec, scale);
    else if (type.kind === 'bigtruck') drawBigTruckShape(cx, gy, spec, scale);
    else if (type.kind === 'bus') drawBusShape(cx, gy, spec, scale);
    else if (type.kind === 'tank') drawTankShape(cx, gy, spec, scale);
    else if (type.kind === 'plane') drawJetShape(cx, gy, spec, scale);
    else drawAutoShape(cx, gy, spec, scale);
    // VIP crown above any vehicle.
    if (spec.vip) drawCrown(cx, gy - (type.top || 116) * scale - 6 * scale, 20 * scale);
    ctx.restore();
  }

  // Sedan-style cars + pickup (the v1 car drawing, unchanged except kind checks).
  function drawAutoShape(cx, gy, spec, scale) {
    var type = spec.type;
    var L = type.len * scale;
    var bh = type.bodyH * scale;
    var col = spec.color;
    var dark = shade(col, -38);
    var darker = shade(col, -70);
    var light = shade(col, 32);
    var half = L / 2;
    var wheelR = (type.id === 'suv' ? 30 : type.id === 'sports' ? 24 : 26) * scale;
    var bodyBottom = gy - wheelR * 0.9;
    var bodyTop = bodyBottom - bh;
    var fx = cx - L * 0.30, rx = cx + L * 0.30; // wheel centers
    if (type.kind === 'truck') { fx = cx - L * 0.36; rx = cx + L * 0.28; }

    // Wheels (behind body).
    drawWheel(fx, gy, wheelR);
    drawWheel(rx, gy, wheelR);

    // --- Body ---
    ctx.beginPath();
    if (type.kind === 'truck') {
      // Cab (front-left) + flat bed.
      var cabFront = cx - half;
      var cabBack = cx - L * 0.10;
      var bedTop = bodyTop + bh * 0.28;
      ctx.moveTo(cabFront + 6 * scale, bodyBottom);
      ctx.lineTo(cabFront + 2 * scale, bodyTop + bh * 0.42);
      ctx.quadraticCurveTo(cabFront + 2 * scale, bodyTop + bh * 0.1, cabFront + 26 * scale, bodyTop - 6 * scale);
      ctx.lineTo(cabBack - 30 * scale, bodyTop - 6 * scale);
      ctx.quadraticCurveTo(cabBack - 8 * scale, bodyTop - 6 * scale, cabBack, bodyTop + bh * 0.3);
      ctx.lineTo(cx + half - 4 * scale, bedTop);
      ctx.lineTo(cx + half, bedTop + 10 * scale);
      ctx.lineTo(cx + half, bodyBottom);
      ctx.closePath();
    } else {
      var hoodY = bodyTop + bh * 0.30;
      var trunkY = bodyTop + bh * 0.26;
      ctx.moveTo(cx - half + 6 * scale, bodyBottom);
      ctx.lineTo(cx - half + 2 * scale, bodyTop + bh * 0.5);
      ctx.quadraticCurveTo(cx - half, hoodY, cx - half + 34 * scale, hoodY);
      ctx.lineTo(cx - half + 44 * scale, hoodY);
      ctx.lineTo(cx + half - 40 * scale, trunkY);
      ctx.quadraticCurveTo(cx + half, trunkY, cx + half - 2 * scale, bodyTop + bh * 0.5);
      ctx.lineTo(cx + half - 4 * scale, bodyBottom);

    }
    ctx.fillStyle = col;
    ctx.fill();
    // Top highlight + bottom shade for depth.
    ctx.save();
    ctx.clip();
    ctx.fillStyle = 'rgba(255,255,255,0.20)';
    ctx.fillRect(cx - half, bodyTop - 40 * scale, L, bh * 0.55);
    ctx.fillStyle = 'rgba(0,0,0,0.10)';
    ctx.fillRect(cx - half, bodyBottom - bh * 0.22, L, bh * 0.22);

    ctx.fillStyle = darker;
    ctx.fillRect(cx - half + 6 * scale, bodyBottom - 6 * scale, L - 12 * scale, 6 * scale);

    // --- Cabin + windows ---

      // v4 3/4 view: cab roof + windshield planes, and the open bed floor.
      // (The cab is at the FRONT-LEFT: its windshield slope starts at

      topQuad(cx - half + 2 * scale, bodyTop + bh * 0.42, cx - half + 26 * scale, cabTop, scale, '#a8d8f0');
      topQuad(cx - half + 26 * scale, cabTop, cabX1 - 4 * scale, cabTop, scale, light);

      ctx.fillStyle = '#a8d8f0';
      ctx.beginPath();
      ctx.moveTo(cabX0 + 4 * scale, winBot);
      ctx.lineTo(cabX0 + 10 * scale, winTop + 4 * scale);
      ctx.lineTo(cabX1 - 4 * scale, winTop + 4 * scale);
      ctx.lineTo(cabX1 - 2 * scale, winBot);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.beginPath();
      ctx.moveTo(cabX0 + 12 * scale, winBot);
      ctx.lineTo(cabX0 + 22 * scale, winTop + 4 * scale);
      ctx.lineTo(cabX0 + 30 * scale, winTop + 4 * scale);
      ctx.lineTo(cabX0 + 20 * scale, winBot);
      ctx.closePath();
      ctx.fill();
      // Bed rails.
      ctx.fillStyle = dark;
      ctx.fillRect(cx - L * 0.10, bodyTop + bh * 0.28, L * 0.58, 5 * scale);
    } else {
      var cab = cabinGeom(type, cx, bodyTop, bh, L);

      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(cab.x0, cab.yBase);
      ctx.lineTo(cab.x0 + cab.slope, cab.yTop);
      ctx.lineTo(cab.x1 - cab.slope2, cab.yTop);
      ctx.lineTo(cab.x1, cab.yBase);
      ctx.closePath();
      ctx.fill();
      ctx.save();
      ctx.clip();
      ctx.fillStyle = 'rgba(255,255,255,0.18)';
      ctx.fillRect(cab.x0, cab.yTop, cab.x1 - cab.x0, (cab.yBase - cab.yTop) * 0.4);
      ctx.restore();
      // v4 3/4 view: visible top surfaces — hood, windshield, roof, rear
      // window and trunk — extruded up-right from the side profile.
      topQuad(cx - half + 34 * scale, hoodY, cab.x0, cab.yBase, scale, light);
      topQuad(cab.x0, cab.yBase, cab.x0 + cab.slope, cab.yTop, scale, '#a8d8f0');
      topQuad(cab.x0 + cab.slope, cab.yTop, cab.x1 - cab.slope2, cab.yTop, scale, light);
      topQuad(cab.x1 - cab.slope2, cab.yTop, cab.x1, cab.yBase, scale, '#a8d8f0');
      topQuad(cab.x1, cab.yBase, cx + half - 40 * scale, trunkY, scale, light);
      // Windows.
      var wx0 = cab.x0 + 8 * scale, wx1 = cab.x1 - 8 * scale;
      var wyTop = cab.yTop + 6 * scale, wyBot = cab.yBase - 2 * scale;
      ctx.fillStyle = '#a8d8f0';
      ctx.beginPath();
      ctx.moveTo(wx0, wyBot);
      ctx.lineTo(wx0 + cab.slope * 0.7, wyTop);
      ctx.lineTo(wx1 - cab.slope2 * 0.7, wyTop);
      ctx.lineTo(wx1, wyBot);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.beginPath();

      ctx.lineTo(shx + 14 * scale, wyTop);
      ctx.lineTo(shx + 26 * scale, wyTop);
      ctx.lineTo(shx + 12 * scale, wyBot);
      ctx.closePath();
      ctx.fill();
      // B-pillar.
      ctx.fillStyle = col;
      var midX = (wx0 + wx1) / 2;
      ctx.fillRect(midX - 3 * scale, wyTop, 6 * scale, wyBot - wyTop);
      // Door lines + handles.
      ctx.strokeStyle = darker;
      ctx.lineWidth = 2 * scale;
      ctx.beginPath();
      ctx.moveTo(midX, wyBot + 4 * scale);
      ctx.lineTo(midX, bodyBottom - 8 * scale);
      ctx.moveTo(wx0 + 6 * scale, wyBot + 4 * scale);
      ctx.lineTo(wx0 + 2 * scale, bodyBottom - 8 * scale);
      ctx.moveTo(wx1 - 6 * scale, wyBot + 4 * scale);
      ctx.lineTo(wx1 - 2 * scale, bodyBottom - 8 * scale);
      ctx.stroke();
      ctx.fillStyle = dark;
      rr(ctx, midX - 22 * scale, wyBot + 10 * scale, 14 * scale, 5 * scale, 2 * scale); ctx.fill();
      rr(ctx, midX + 8 * scale, wyBot + 10 * scale, 14 * scale, 5 * scale, 2 * scale); ctx.fill();
    }

    // Headlight (front-left) + taillight (rear-right).
    ctx.fillStyle = '#fff7ae';
    rr(ctx, cx - half + 2 * scale, bodyTop + bh * 0.52, 16 * scale, 9 * scale, 4 * scale);
    ctx.fill();
    ctx.fillStyle = 'rgba(255, 247, 174, 0.35)';
    ellipse(ctx, cx - half - 2 * scale, bodyTop + bh * 0.56, 12 * scale, 8 * scale);
    ctx.fillStyle = '#e11d48';
    rr(ctx, cx + half - 18 * scale, bodyTop + bh * 0.5, 15 * scale, 9 * scale, 4 * scale);
    ctx.fill();
    // Bumpers.
    ctx.fillStyle = dark;
    rr(ctx, cx - half - 2 * scale, bodyBottom - 12 * scale, 14 * scale, 8 * scale, 3 * scale); ctx.fill();
    rr(ctx, cx + half - 12 * scale, bodyBottom - 12 * scale, 14 * scale, 8 * scale, 3 * scale); ctx.fill();

    // VIP gold trim (the crown is drawn centrally in drawCarShape).
    if (spec.vip) {
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 3 * scale;
      ctx.beginPath();
      ctx.moveTo(cx - half + 10 * scale, bodyBottom - 10 * scale);
      ctx.lineTo(cx + half - 10 * scale, bodyBottom - 10 * scale);
      ctx.stroke();
    }
    // Taxi sign + checker strip.
    if (type.id === 'taxi') {
      ctx.fillStyle = '#f7c948';
      rr(ctx, cx - 26 * scale, bodyTop - 56 * scale, 52 * scale, 18 * scale, 4 * scale);
      ctx.fill();
      ctx.fillStyle = '#111827';
      ctx.font = 'bold ' + Math.round(11 * scale) + 'px Arial, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('TAXI', cx, bodyTop - 47 * scale);
      ctx.fillStyle = '#111827';
      for (var i = 0; i < 10; i++) {
        if (i % 2 === 0) ctx.fillRect(cx - half + 20 * scale + i * 10 * scale, bodyTop + bh * 0.42, 10 * scale, 7 * scale);

    }

  }

  // ============================== New vehicle shapes (v2) ==============================
  // All drawn side-view, facing LEFT. (cx, gy) = center x, ground y.

  function drawMotoShape(cx, gy, spec, scale) {
    var col = spec.color;
    var dark = shade(col, -38);
    var darker = shade(col, -70);
    var s = scale;
    var wheelR = 17 * s;
    var fx = cx - 46 * s, rx = cx + 46 * s; // wheel centers
    var wy = gy - wheelR * 0.4;
    // Wheels.
    drawWheel(fx, wy, wheelR);
    drawWheel(rx, wy, wheelR);
    // Fenders.
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(fx, wy, wheelR + 5 * s, Math.PI * 1.05, Math.PI * 1.95); ctx.lineTo(fx, wy); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(rx, wy, wheelR + 5 * s, Math.PI * 1.05, Math.PI * 1.95); ctx.lineTo(rx, wy); ctx.closePath(); ctx.fill();
    // Frame: front fork + swing arm.
    ctx.strokeStyle = '#94a3b8';
    ctx.lineWidth = 5 * s;
    ctx.beginPath(); ctx.moveTo(fx, wy); ctx.lineTo(cx - 28 * s, gy - 62 * s); ctx.stroke();
    ctx.strokeStyle = '#475569';
    ctx.lineWidth = 4 * s;
    ctx.beginPath(); ctx.moveTo(rx, wy); ctx.lineTo(cx + 10 * s, gy - 34 * s); ctx.stroke();
    // Engine block.
    ctx.fillStyle = '#334155';
    rr(ctx, cx - 22 * s, gy - 36 * s, 44 * s, 22 * s, 6 * s); ctx.fill();
    ctx.fillStyle = '#64748b';
    rr(ctx, cx - 18 * s, gy - 32 * s, 36 * s, 6 * s, 3 * s); ctx.fill();
    // Fuel tank (teardrop).
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(cx - 30 * s, gy - 52 * s);
    ctx.quadraticCurveTo(cx - 12 * s, gy - 66 * s, cx + 12 * s, gy - 60 * s);
    ctx.quadraticCurveTo(cx + 22 * s, gy - 56 * s, cx + 18 * s, gy - 46 * s);
    ctx.lineTo(cx - 28 * s, gy - 44 * s);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath(); ctx.ellipse(cx - 8 * s, gy - 58 * s, 12 * s, 4 * s, -0.3, 0, Math.PI * 2); ctx.fill();
    // v4 3/4 view: tank top surface (lighter, offset up-right).
    ctx.fillStyle = shade(col, 32);
    ctx.beginPath(); ctx.ellipse(cx - 4 * s, gy - 64 * s, 15 * s, 4.5 * s, -0.15, 0, Math.PI * 2); ctx.fill();
    // Seat.
    ctx.fillStyle = '#1f2937';
    rr(ctx, cx + 8 * s, gy - 58 * s, 40 * s, 10 * s, 5 * s); ctx.fill();
    // v4 3/4 view: seat top surface.
    topQuad(cx + 8 * s, gy - 58 * s, cx + 48 * s, gy - 58 * s, s, '#374151');
    // Handlebars.
    ctx.strokeStyle = '#1f2937';
    ctx.lineWidth = 4 * s;
    ctx.beginPath(); ctx.moveTo(cx - 28 * s, gy - 62 * s); ctx.lineTo(cx - 38 * s, gy - 78 * s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx - 38 * s, gy - 78 * s); ctx.lineTo(cx - 28 * s, gy - 80 * s); ctx.stroke();
    // v4 3/4 view: far handlebar grip (suggests the bar's width).
    ctx.strokeStyle = '#4b5563';
    ctx.lineWidth = 3 * s;
    ctx.beginPath(); ctx.moveTo(cx - 32 * s, gy - 82 * s); ctx.lineTo(cx - 22 * s, gy - 84 * s); ctx.stroke();
    // Headlight.
    ctx.fillStyle = '#fff7ae';
    ctx.beginPath(); ctx.arc(cx - 52 * s, gy - 58 * s, 6 * s, 0, Math.PI * 2); ctx.fill();
    // Exhaust pipe.
    ctx.strokeStyle = '#cbd5e1';
    ctx.lineWidth = 6 * s;
    ctx.beginPath(); ctx.moveTo(cx + 6 * s, gy - 22 * s); ctx.lineTo(cx + 52 * s, gy - 26 * s); ctx.stroke();
    ctx.fillStyle = '#475569';
    ctx.beginPath(); ctx.arc(cx + 54 * s, gy - 26 * s, 4 * s, 0, Math.PI * 2); ctx.fill();
  }

  function drawBigTruckShape(cx, gy, spec, scale) {
    var col = spec.color;
    var dark = shade(col, -38);
    var darker = shade(col, -70);
    var s = scale;
    var L = spec.type.len * s;
    var half = L / 2;
    var wheelR = 26 * s;
    var boxTop = gy - wheelR * 0.9 - spec.type.bodyH * s;
    var cabX0 = cx - half, cabX1 = cx - half + 108 * s;
    var boxX0 = cabX1, boxX1 = cx + half;
    // Wheels: front under cab, two under the box.
    drawWheel(cx - half + 52 * s, gy, wheelR);
    drawWheel(cx + half - 88 * s, gy, wheelR);
    drawWheel(cx + half - 34 * s, gy, wheelR);
    // Cargo box.
    ctx.fillStyle = '#eef2f7';
    rr(ctx, boxX0, boxTop, boxX1 - boxX0, gy - wheelR * 0.9 - boxTop, 8 * s); ctx.fill();
    ctx.strokeStyle = '#cbd5e1';
    ctx.lineWidth = 2 * s;
    rr(ctx, boxX0, boxTop, boxX1 - boxX0, gy - wheelR * 0.9 - boxTop, 8 * s); ctx.stroke();
    // Box ribs + colored stripe.
    ctx.strokeStyle = '#dbe4ee';
    ctx.lineWidth = 2 * s;
    for (var i = 1; i < 5; i++) {
      var bx = boxX0 + (boxX1 - boxX0) * i / 5;
      ctx.beginPath(); ctx.moveTo(bx, boxTop + 6 * s); ctx.lineTo(bx, gy - wheelR * 0.9 - 6 * s); ctx.stroke();
    }
    ctx.fillStyle = col;
    ctx.fillRect(boxX0, boxTop + 22 * s, boxX1 - boxX0, 12 * s);
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(boxX0, boxTop, boxX1 - boxX0, 8 * s);
    // v4 3/4 view: cargo box top surface.
    topQuad(boxX0, boxTop, boxX1, boxTop, s, '#f8fafc');
    // Cab (boxy, body color).
    var cabTop = boxTop + 6 * s;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(cabX0 + 4 * s, gy - wheelR * 0.9);
    ctx.lineTo(cabX0 + 2 * s, cabTop + 26 * s);
    ctx.quadraticCurveTo(cabX0 + 2 * s, cabTop + 8 * s, cabX0 + 22 * s, cabTop);
    ctx.lineTo(cabX1 - 4 * s, cabTop);
    ctx.lineTo(cabX1, cabTop + 10 * s);
    ctx.lineTo(cabX1, gy - wheelR * 0.9);
    ctx.closePath(); ctx.fill();
    ctx.save(); ctx.clip();
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.fillRect(cabX0, cabTop, cabX1 - cabX0, 20 * s);
    ctx.fillStyle = 'rgba(0,0,0,0.10)';
    ctx.fillRect(cabX0, gy - wheelR * 0.9 - 12 * s, cabX1 - cabX0, 12 * s);
    ctx.restore();
    // v4 3/4 view: cab roof + windshield planes.
    topQuad(cabX0 + 2 * s, cabTop + 26 * s, cabX0 + 22 * s, cabTop, s, '#a8d8f0');
    topQuad(cabX0 + 22 * s, cabTop, cabX1 - 4 * s, cabTop, s, shade(col, 32));
    // Windshield + side window.
    ctx.fillStyle = '#a8d8f0';
    ctx.beginPath();
    ctx.moveTo(cabX0 + 10 * s, cabTop + 30 * s);
    ctx.lineTo(cabX0 + 16 * s, cabTop + 10 * s);
    ctx.lineTo(cabX1 - 12 * s, cabTop + 10 * s);
    ctx.lineTo(cabX1 - 12 * s, cabTop + 30 * s);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillRect(cabX0 + 22 * s, cabTop + 12 * s, 8 * s, 16 * s);
    // Grille + bumper + headlight + roof lights.
    ctx.fillStyle = darker;
    rr(ctx, cabX0 + 2 * s, gy - wheelR * 0.9 - 20 * s, 20 * s, 14 * s, 3 * s); ctx.fill();
    ctx.fillStyle = '#fff7ae';
    rr(ctx, cabX0 + 2 * s, gy - wheelR * 0.9 - 34 * s, 14 * s, 8 * s, 3 * s); ctx.fill();
    ctx.fillStyle = '#e11d48';
    rr(ctx, boxX1 - 14 * s, gy - wheelR * 0.9 - 30 * s, 12 * s, 8 * s, 3 * s); ctx.fill();
    ctx.fillStyle = '#f59e0b';
    for (var m = 0; m < 3; m++) {
      ctx.beginPath(); ctx.arc(cabX0 + 26 * s + m * 18 * s, cabTop - 2 * s, 3 * s, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawBusShape(cx, gy, spec, scale) {
    var col = spec.color;

    drawWheel(cx + half - 58 * s, gy, wheelR);

    ctx.fillStyle = 'rgba(0,0,0,0.08)';
    ctx.fillRect(cx - half, bodyBottom - 14 * s, L, 14 * s);

    topQuad(cx - half + 8 * s, bodyTop, cx + half - 8 * s, bodyTop, s, shade(col, 28));
    topQuad(cx - half + 8 * s, bodyTop + 34 * s, cx - half + 16 * s, bodyTop + 10 * s, s, '#a8d8f0');

    ctx.lineTo(cx - half + 16 * s, bodyTop + 10 * s);

    ctx.lineTo(cx - half + 62 * s, bodyTop + 34 * s);

    var winY = bodyTop + 12 * s, winH = 24 * s;
    for (var i = 0; i < 4; i++) {
      var wx = cx - half + 74 * s + i * 62 * s;
