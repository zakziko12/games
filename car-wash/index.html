    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath();
    ctx.moveTo(cx - half + 22 * s, bodyTop + 34 * s);
    ctx.lineTo(cx - half + 34 * s, bodyTop + 10 * s);
    ctx.lineTo(cx - half + 44 * s, bodyTop + 10 * s);
    ctx.lineTo(cx - half + 32 * s, bodyTop + 34 * s);
    ctx.closePath(); ctx.fill();
    // Side stripe + door.
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillRect(cx - half + 6 * s, bodyTop + 44 * s, L - 12 * s, 7 * s);
    ctx.strokeStyle = darker;
    ctx.lineWidth = 2 * s;
    rr(ctx, cx - half + 66 * s, bodyTop + 56 * s, 34 * s, bodyBottom - bodyTop - 62 * s, 4 * s); ctx.stroke();
    // Headlights / taillights / mirrors.
    ctx.fillStyle = '#fff7ae';
    rr(ctx, cx - half + 2 * s, bodyBottom - 22 * s, 16 * s, 10 * s, 4 * s); ctx.fill();
    ctx.fillStyle = '#e11d48';
    rr(ctx, cx + half - 18 * s, bodyBottom - 22 * s, 15 * s, 10 * s, 4 * s); ctx.fill();
    ctx.strokeStyle = '#1f2937';
    ctx.lineWidth = 3 * s;
    ctx.beginPath(); ctx.moveTo(cx - half + 6 * s, bodyTop + 16 * s); ctx.lineTo(cx - half - 6 * s, bodyTop + 8 * s); ctx.stroke();
    ctx.fillStyle = '#1f2937';
    rr(ctx, cx - half - 10 * s, bodyTop + 2 * s, 8 * s, 12 * s, 3 * s); ctx.fill();
    // Destination sign.
    ctx.fillStyle = '#1f2937';
    rr(ctx, cx - half + 70 * s, bodyTop - 2 * s, 60 * s, 12 * s, 3 * s); ctx.fill();
    ctx.fillStyle = '#facc15';
    ctx.font = 'bold ' + Math.round(8 * s) + 'px Arial, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('CITY', cx - half + 100 * s, bodyTop + 4 * s);
  }

  function drawTankShape(cx, gy, spec, scale) {
    var col = spec.color;
    var dark = shade(col, -38);
    var darker = shade(col, -70);
    var s = scale;
    var L = spec.type.len * s;
    var half = L / 2;
    var treadH = 30 * s;
    var treadTop = gy - treadH;
    var hullH = 34 * s;
    var hullTop = treadTop - hullH;
    // Treads.
    ctx.fillStyle = '#26262a';
    rr(ctx, cx - half, treadTop, L, treadH, 14 * s); ctx.fill();
    ctx.fillStyle = '#3a3a3f';
    rr(ctx, cx - half + 6 * s, treadTop + 5 * s, L - 12 * s, treadH - 10 * s, 10 * s); ctx.fill();
    // Road wheels.
    for (var i = 0; i < 6; i++) {
      var wx = cx - half + 30 * s + i * (L - 60 * s) / 5;
      ctx.fillStyle = '#52525b';
      ctx.beginPath(); ctx.arc(wx, treadTop + treadH / 2, 9 * s, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#a1a1aa';
      ctx.beginPath(); ctx.arc(wx, treadTop + treadH / 2, 4 * s, 0, Math.PI * 2); ctx.fill();
    }
    // Hull (sloped front).
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(cx - half + 14 * s, treadTop);
    ctx.lineTo(cx - half + 34 * s, hullTop + 6 * s);
    ctx.lineTo(cx + half - 20 * s, hullTop + 6 * s);
    ctx.quadraticCurveTo(cx + half - 4 * s, hullTop + 10 * s, cx + half - 6 * s, treadTop);
    ctx.closePath(); ctx.fill();
    ctx.save(); ctx.clip();
    ctx.fillStyle = 'rgba(255,255,255,0.14)';
    ctx.fillRect(cx - half, hullTop, L, 12 * s);
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.fillRect(cx - half, treadTop - 8 * s, L, 8 * s);
    ctx.restore();
    // v4 3/4 view: hull top surface (the turret covers its middle).
    topQuad(cx - half + 34 * s, hullTop + 6 * s, cx + half - 20 * s, hullTop + 6 * s, s, shade(col, 26));
    // Turret.
    var turX0 = cx - half + 96 * s, turX1 = cx + half - 70 * s;
    var turTop = hullTop - 24 * s;
    ctx.fillStyle = shade(col, 10);
    ctx.beginPath();
    ctx.moveTo(turX0, hullTop + 6 * s);
    ctx.lineTo(turX0 + 10 * s, turTop + 6 * s);
    ctx.lineTo(turX1 - 10 * s, turTop + 6 * s);
    ctx.lineTo(turX1, hullTop + 6 * s);
    ctx.closePath(); ctx.fill();
    // v4 3/4 view: turret top surface.
    topQuad(turX0 + 10 * s, turTop + 6 * s, turX1 - 10 * s, turTop + 6 * s, s, shade(col, 34));
    // Cannon barrel (points left). v4: 40px past the hull (was 52) so the
    // muzzle stays on screen at the 1.15x foam zoom.
    ctx.fillStyle = darker;
    ctx.fillRect(cx - half - 40 * s, turTop + 12 * s, (turX0 - (cx - half - 40 * s)) + 30 * s, 8 * s);
    ctx.fillStyle = '#1f2937';
    ctx.fillRect(cx - half - 40 * s, turTop + 10 * s, 10 * s, 12 * s);
    // Hatch + antenna + star.
    ctx.fillStyle = darker;
    ctx.beginPath(); ctx.arc(cx + 10 * s, turTop + 8 * s, 9 * s, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#1f2937';
    ctx.lineWidth = 2 * s;
    ctx.beginPath(); ctx.moveTo(cx + half - 84 * s, turTop + 6 * s); ctx.lineTo(cx + half - 76 * s, turTop - 26 * s); ctx.stroke();
    drawStar(cx - 6 * s, hullTop + 22 * s, 11 * s, '#f8fafc', 0);
    // Headlight + exhaust.
    ctx.fillStyle = '#fff7ae';
    ctx.beginPath(); ctx.arc(cx - half + 22 * s, hullTop + 16 * s, 4 * s, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3f3f46';
    rr(ctx, cx + half - 26 * s, hullTop + 12 * s, 14 * s, 10 * s, 3 * s); ctx.fill();
  }

  function drawJetShape(cx, gy, spec, scale) {
    var col = spec.color;
    var dark = shade(col, -38);
    var darker = shade(col, -70);
    var s = scale;
    var L = spec.type.len * s;
    var half = L / 2;
    var fusY = gy - 46 * s;      // fuselage centerline
    var fusH = 30 * s;
    // Landing gear (nose + main wheels).
    ctx.strokeStyle = '#475569';
    ctx.lineWidth = 4 * s;
    ctx.beginPath(); ctx.moveTo(cx - half + 92 * s, fusY + fusH / 2); ctx.lineTo(cx - half + 92 * s, gy - 8 * s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + 20 * s, fusY + fusH / 2); ctx.lineTo(cx + 20 * s, gy - 8 * s); ctx.stroke();
    ctx.fillStyle = '#0f172a';
    ctx.beginPath(); ctx.arc(cx - half + 92 * s, gy - 6 * s, 9 * s, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 20 * s, gy - 6 * s, 10 * s, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#94a3b8';
    ctx.beginPath(); ctx.arc(cx - half + 92 * s, gy - 6 * s, 4 * s, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 20 * s, gy - 6 * s, 4 * s, 0, Math.PI * 2); ctx.fill();
    // v4 3/4 view: far wing peeking above the fuselage (drawn first, so the
    // fuselage overlaps its root).
    ctx.fillStyle = shade(col, -55);
    ctx.beginPath();
    ctx.moveTo(cx - 10 * s, fusY - fusH * 0.3);
    ctx.lineTo(cx + 78 * s, fusY - fusH * 0.4 - 26 * s);
    ctx.lineTo(cx + 118 * s, fusY - fusH * 0.4 - 20 * s);
    ctx.lineTo(cx + 62 * s, fusY + fusH * 0.2);
    ctx.closePath(); ctx.fill();
    // Main wing (swept back, below fuselage) — larger in 3/4, the near wing
    // reaching toward the viewer.
    ctx.fillStyle = dark;
    ctx.beginPath();
    ctx.moveTo(cx - 30 * s, fusY + 6 * s);
    ctx.lineTo(cx + 60 * s, fusY + 2 * s);
    ctx.lineTo(cx + 168 * s, gy - 6 * s);
    ctx.lineTo(cx + 130 * s, gy - 4 * s);
    ctx.lineTo(cx + 10 * s, fusY + 16 * s);
    ctx.closePath(); ctx.fill();
    // Wing top surface: a lighter strip along the leading edge.
    ctx.fillStyle = shade(dark, 22);
    ctx.beginPath();
    ctx.moveTo(cx - 30 * s, fusY + 6 * s);
    ctx.lineTo(cx + 60 * s, fusY + 2 * s);
    ctx.lineTo(cx + 70 * s, fusY + 12 * s);
    ctx.lineTo(cx - 22 * s, fusY + 16 * s);
    ctx.closePath(); ctx.fill();
    // Horizontal stabilizer (rear, small).
    ctx.fillStyle = dark;
    ctx.beginPath();
    ctx.moveTo(cx + half - 110 * s, fusY + 4 * s);
    ctx.lineTo(cx + half - 40 * s, fusY + 0 * s);
    ctx.lineTo(cx + half - 6 * s, fusY + 16 * s);
    ctx.lineTo(cx + half - 60 * s, fusY + 18 * s);
    ctx.closePath(); ctx.fill();
    // Fuselage (pointed nose left, tail right).
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(cx - half, fusY);
    ctx.quadraticCurveTo(cx - half + 60 * s, fusY - fusH * 0.72, cx - half + 150 * s, fusY - fusH * 0.5);
    ctx.lineTo(cx + half - 40 * s, fusY - fusH * 0.42);
    ctx.lineTo(cx + half, fusY - fusH * 0.2);
    ctx.lineTo(cx + half, fusY + fusH * 0.3);
    ctx.lineTo(cx + half - 60 * s, fusY + fusH * 0.5);
    ctx.quadraticCurveTo(cx - half + 120 * s, fusY + fusH * 0.55, cx - half + 40 * s, fusY + fusH * 0.25);
    ctx.closePath(); ctx.fill();
    ctx.save(); ctx.clip();
    ctx.fillStyle = 'rgba(255,255,255,0.30)';
    ctx.fillRect(cx - half, fusY - fusH * 0.72, L, fusH * 0.5);
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.fillRect(cx - half, fusY + fusH * 0.2, L, fusH * 0.35);
    ctx.restore();
    // v4 3/4 view: tail fin top edge.
    topQuad(cx + half - 88 * s, fusY - fusH * 0.42 - 52 * s, cx + half - 58 * s, fusY - fusH * 0.42 - 50 * s, s, shade(dark, 25));
    // Tail fin (vertical stabilizer, swept back).
    ctx.fillStyle = dark;
    ctx.beginPath();
    ctx.moveTo(cx + half - 120 * s, fusY - fusH * 0.42);
    ctx.lineTo(cx + half - 88 * s, fusY - fusH * 0.42 - 52 * s);
    ctx.lineTo(cx + half - 58 * s, fusY - fusH * 0.42 - 50 * s);
    ctx.lineTo(cx + half - 44 * s, fusY - fusH * 0.4);
    ctx.closePath(); ctx.fill();
    // Canopy bubble.
    ctx.fillStyle = '#a8d8f0';
    ctx.beginPath();
    ctx.ellipse(cx - half + 118 * s, fusY - fusH * 0.52, 30 * s, 13 * s, -0.08, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath(); ctx.ellipse(cx - half + 108 * s, fusY - fusH * 0.58, 11 * s, 5 * s, -0.2, 0, Math.PI * 2); ctx.fill();
    // Intake + nozzle + roundel.
    ctx.fillStyle = darker;
    rr(ctx, cx - half + 150 * s, fusY + fusH * 0.28, 44 * s, 10 * s, 4 * s); ctx.fill();
    ctx.fillStyle = '#1f2937';
    rr(ctx, cx + half - 8 * s, fusY - fusH * 0.18, 10 * s, fusH * 0.44, 3 * s); ctx.fill();
    ctx.fillStyle = '#e11d48';
    ctx.beginPath(); ctx.arc(cx + 30 * s, fusY - 2 * s, 8 * s, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f8fafc';
    ctx.beginPath(); ctx.arc(cx + 30 * s, fusY - 2 * s, 5 * s, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2563eb';
    ctx.beginPath(); ctx.arc(cx + 30 * s, fusY - 2 * s, 2.5 * s, 0, Math.PI * 2); ctx.fill();
  }

  function cabinGeom(type, cx, bodyTop, bh, L) {
    var g = { yBase: bodyTop + bh * 0.28 };
    if (type.id === 'sedan' || type.id === 'taxi') {
      g.x0 = cx - L * 0.20; g.x1 = cx + L * 0.24;
      g.yTop = bodyTop - 34 * (L / type.len); g.slope = 30 * (L / type.len); g.slope2 = 26 * (L / type.len);
    } else if (type.id === 'hatch') {
      g.x0 = cx - L * 0.16; g.x1 = cx + L * 0.30;
      g.yTop = bodyTop - 40 * (L / type.len); g.slope = 30 * (L / type.len); g.slope2 = 44 * (L / type.len);
    } else if (type.id === 'suv') {
      g.x0 = cx - L * 0.24; g.x1 = cx + L * 0.27;
      g.yTop = bodyTop - 46 * (L / type.len); g.slope = 22 * (L / type.len); g.slope2 = 18 * (L / type.len);
    } else { // sports
      g.x0 = cx - L * 0.10; g.x1 = cx + L * 0.20;
      g.yTop = bodyTop - 28 * (L / type.len); g.slope = 34 * (L / type.len); g.slope2 = 36 * (L / type.len);
    }
    return g;
  }
  // v4 3/4 view: wheels are foreshortened ellipses (ry = 0.82r) with the
  // bottom kept at y, so they still sit on the ground.
  function drawWheel(x, y, r) {
    var sq = 0.82;
    var cy = y - r * (1 - sq);
    function wheelEllipse(rx, ry) {
      ctx.beginPath();
      ctx.ellipse(x, cy, rx, ry, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = '#0f172a';
    wheelEllipse(r, r * sq);
    ctx.fillStyle = '#1f2937';
    wheelEllipse(r * 0.92, r * 0.92 * sq);
    ctx.fillStyle = '#d7dee8';
    wheelEllipse(r * 0.55, r * 0.55 * sq);
    ctx.fillStyle = '#94a3b8';
    wheelEllipse(r * 0.42, r * 0.42 * sq);
    // Spokes.
    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = Math.max(2, r * 0.14);
    for (var i = 0; i < 5; i++) {
      var a = i * Math.PI * 2 / 5 + time * 0.5;
      ctx.beginPath();
      ctx.moveTo(x, cy);
      ctx.lineTo(x + Math.cos(a) * r * 0.5, cy + Math.sin(a) * r * 0.5 * sq);
      ctx.stroke();
    }
    ctx.fillStyle = '#64748b';
    wheelEllipse(r * 0.14, r * 0.14 * sq);
  }
  // v4: draw a top surface (roof / hood / deck) as a parallelogram: the edge
  // (x0,y0)-(x1,y1) extruded by the 3/4 offset (TOP_DX, TOP_DY) * scale.
  function topQuad(x0, y0, x1, y1, scale, fill) {
    var dx = TOP_DX * scale, dy = TOP_DY * scale;
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.lineTo(x1 + dx, y1 + dy);
    ctx.lineTo(x0 + dx, y0 + dy);
    ctx.closePath();
    ctx.fill();
  }
  function drawCrown(x, y, s) {
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.moveTo(x - s, y + s * 0.5);
    ctx.lineTo(x - s, y - s * 0.2);
    ctx.lineTo(x - s * 0.5, y + s * 0.1);
    ctx.lineTo(x, y - s * 0.5);
    ctx.lineTo(x + s * 0.5, y + s * 0.1);
    ctx.lineTo(x + s, y - s * 0.2);
    ctx.lineTo(x + s, y + s * 0.5);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#e11d48';
    ctx.beginPath(); ctx.arc(x, y + s * 0.15, s * 0.16, 0, Math.PI * 2); ctx.fill();
  }

  // Dirt + foam overlays for the main car (car-local coords).
  function drawCarDirt(c) {
    var cx = c.x, gy = CAR_GROUND;
    var half = c.spec.type.len / 2;
    var top = c.spec.type.top || 116;
    // Dust film over the body only (clipped so it never halos around the car).
    if (c.dust > 0.02) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(cx - half, gy - top - 4, c.spec.type.len, top);
      ctx.clip();
      ctx.fillStyle = 'rgba(139, 109, 71, ' + (0.14 * c.dust).toFixed(3) + ')';
      ctx.beginPath();
      ctx.ellipse(cx, gy - top * 0.5, half * 0.96, top * 0.45, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    for (var i = 0; i < c.dirt.length; i++) {
      var d = c.dirt[i];
      if (d.amount <= 0) continue;
      // v3: heavy mud is drawn OVER the foam (it stays visible when soaped
      // over) — see drawCarFoam. Everything else is drawn under the foam.
      if (d.heavy && c.soaped) continue;
      drawDirtPatch(c, d);
    }
  }

  // One dirt patch. Shared by drawCarDirt and drawCarFoam (heavy mud on top).
  function drawDirtPatch(c, d) {
    var cx = c.x, gy = CAR_GROUND;
    // Alpha fades fast as the patch is scrubbed, so half-clean patches
    // look faint instead of staying a solid blob.
    var a = 0.92 * Math.pow(d.amount, 0.7);
    var px = cx + d.x, py = gy + d.y;
    if (d.kind === 'dust') {
      // Dust: soft flat ellipse, light and quick to remove.
      ctx.globalAlpha = a * 0.55;
      ctx.fillStyle = d.tone;
      ellipse(ctx, px, py, d.r, d.r * 0.5);
      ctx.globalAlpha = 1;
      return;
    }
    if (d.kind === 'insect') {
      // v3: stuck insects — a cluster of tiny dark dots with a small splat.
      ctx.globalAlpha = a;
      ctx.fillStyle = d.tone;
      ellipse(ctx, px, py, d.r * 0.9, d.r * 0.55);
      ctx.fillStyle = '#0f0a08';
      for (var s = 0; s < 5; s++) {
        var sx = px + (hash(d.seed + s * 13) - 0.5) * d.r * 1.6;
        var sy = py + (hash(d.seed + s * 19) - 0.5) * d.r;
        ctx.beginPath(); ctx.arc(sx, sy, 1.6 + hash(d.seed + s) * 1.8, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
      return;
    }
    if (d.kind === 'cement') {
      // v3: cement — hard grey angular chunk with a lighter top edge.
      ctx.globalAlpha = a;
      ctx.fillStyle = d.tone;
      ctx.beginPath();
      ctx.moveTo(px - d.r, py + d.r * 0.4);
      ctx.lineTo(px - d.r * 0.5, py - d.r * 0.5);
      ctx.lineTo(px + d.r * 0.6, py - d.r * 0.4);
      ctx.lineTo(px + d.r, py + d.r * 0.3);
      ctx.lineTo(px + d.r * 0.3, py + d.r * 0.55);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = a * 0.7;
      ctx.fillStyle = '#c9ced4';
      ctx.beginPath();
      ctx.moveTo(px - d.r * 0.5, py - d.r * 0.5);
      ctx.lineTo(px + d.r * 0.6, py - d.r * 0.4);
      ctx.lineTo(px + d.r * 0.2, py - d.r * 0.1);
      ctx.lineTo(px - d.r * 0.2, py - d.r * 0.15);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = 1;
      return;
    }
    ctx.fillStyle = d.tone;
    ctx.globalAlpha = a;
    // Wobbly splat: irregular radius per angle, flatter than round.
    ctx.beginPath();
    for (var k = 0; k <= 12; k++) {
      var ang = k / 12 * Math.PI * 2;
      var wob = 0.72 + 0.5 * hash(d.seed + k * 3.7);
      var rr2 = d.r * wob;
      var vx = px + Math.cos(ang) * rr2;
      var vy = py + Math.sin(ang) * rr2 * 0.62;
      if (k === 0) ctx.moveTo(vx, vy); else ctx.lineTo(vx, vy);
    }
    ctx.closePath();
    ctx.fill();
    if (d.kind === 'tar') {
      // Tar: glossy highlight, and it stays dark while scrubbed.
      ctx.globalAlpha = a * 0.7;
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ellipse(ctx, px - d.r * 0.3, py - d.r * 0.25, d.r * 0.22, d.r * 0.13);
    } else if (d.kind === 'bird') {
      // Bird droppings: white splat; a blue sheen once soap softens it.
      ctx.globalAlpha = a * 0.6;
      ctx.fillStyle = d.softened ? '#93c5fd' : '#e2e8f0';
      ellipse(ctx, px, py, d.r * 0.5, d.r * 0.3);
    } else if (d.kind === 'oil') {
      // v3: oil — dark glossy stain with a rainbow sheen.
      ctx.globalAlpha = a * 0.75;
      ctx.fillStyle = '#a78bfa';
      ellipse(ctx, px - d.r * 0.25, py - d.r * 0.2, d.r * 0.28, d.r * 0.14);
      ctx.fillStyle = '#2dd4bf';
      ellipse(ctx, px + d.r * 0.2, py + d.r * 0.1, d.r * 0.22, d.r * 0.11);
      ctx.fillStyle = '#f472b6';
      ellipse(ctx, px + d.r * 0.05, py - d.r * 0.3, d.r * 0.16, d.r * 0.09);
      ctx.globalAlpha = a * 0.5;
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ellipse(ctx, px - d.r * 0.35, py - d.r * 0.3, d.r * 0.14, d.r * 0.08);
    } else {
      // Mud (heavy mud is darker with a thicker core + speckles).
      ctx.globalAlpha = a * 0.55;
      ctx.fillStyle = shade(d.tone, -30);
      ellipse(ctx, px, py, d.r * 0.45, d.r * 0.3);
      ctx.globalAlpha = a * 0.8;
      ctx.fillStyle = d.tone;
      for (var s2 = 0; s2 < 5; s2++) {
        var sx2 = px + (hash(d.seed + s2 * 11) - 0.5) * d.r * 2.2;
        var sy2 = py + (hash(d.seed + s2 * 17) - 0.5) * d.r * 1.4;
        ctx.beginPath(); ctx.arc(sx2, sy2, 1.5 + hash(d.seed + s2) * 2.5, 0, Math.PI * 2); ctx.fill();
      }
      if (d.heavy) {
        // Heavy mud: chunky lumps so it reads as thick caked mud.
        ctx.globalAlpha = a * 0.9;
        ctx.fillStyle = '#3a2412';
        for (var s3 = 0; s3 < 3; s3++) {
          var lx = px + (hash(d.seed + s3 * 23) - 0.5) * d.r * 1.2;
          var ly = py + (hash(d.seed + s3 * 29) - 0.5) * d.r * 0.8;
          ctx.beginPath(); ctx.arc(lx, ly, d.r * 0.22, 0, Math.PI * 2); ctx.fill();
        }
      }
    }
    ctx.globalAlpha = 1;
  }
  function drawCarFoam(c) {
    for (var i = 0; i < c.foam.length; i++) {
      var f = c.foam[i];
      if (f.amount <= 0) continue;
      var px = c.x + f.x, py = CAR_GROUND + f.y;
      ctx.globalAlpha = 0.9 * f.amount;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(px, py, f.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#dbeafe';
      ctx.beginPath(); ctx.arc(px + f.r * 0.3, py + f.r * 0.35, f.r * 0.55, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath(); ctx.arc(px - f.r * 0.3, py - f.r * 0.35, f.r * 0.28, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    // v3: heavy mud stays visible THROUGH the foam when soaped over.
    if (c.soaped) {
      for (var j = 0; j < c.dirt.length; j++) {
        var d = c.dirt[j];
        if (d.amount > 0 && d.heavy) drawDirtPatch(c, d);
      }
    }
  }
  function drawCarShine(c) {
    if (shineT < 0) return;
    var half = c.spec.type.len / 2;
    var top = c.spec.type.top || 116;
    var bx = c.x - half + shineT * c.spec.type.len;
    ctx.save();
    ctx.beginPath();
    ctx.rect(c.x - half, CAR_GROUND - top - 4, c.spec.type.len, top + 4);
    ctx.clip();
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath();
    ctx.moveTo(bx - 30, CAR_GROUND - top - 4);
    ctx.lineTo(bx + 10, CAR_GROUND - top - 4);
    ctx.lineTo(bx - 20, CAR_GROUND);
    ctx.lineTo(bx - 60, CAR_GROUND);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // v4: water droplets on the car during the dry stage (wiped away by the towel).
  function drawCarDrops(c) {
    // Drops fade in over the grace beat so the player sees them appear.
    var appear = clamp((time - (c.dropsBorn || 0)) / 0.4, 0, 1);
    for (var i = 0; i < c.drops.length; i++) {
      var d = c.drops[i];
      if (d.amount <= 0) continue;
      var px = c.x + d.x, py = CAR_GROUND + d.y;
      ctx.globalAlpha = 0.85 * d.amount * appear;
      ctx.fillStyle = '#7ec8ff';
      ctx.beginPath(); ctx.arc(px, py, d.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath(); ctx.arc(px - d.r * 0.3, py - d.r * 0.35, d.r * 0.35, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  // v4: foam puddle on the floor — grows as foam is rinsed off the car.
  function drawPuddle(c) {
    if (c.puddle <= 0.02) return;
    // A clearer blue so the puddle reads against the light-grey floor.
    var a = 0.6 * c.puddle;
    ctx.fillStyle = 'rgba(147, 197, 253, ' + a.toFixed(3) + ')';
    ellipse(ctx, c.x, CAR_GROUND + 10, 60 + 130 * c.puddle, 8 + 12 * c.puddle);
    ctx.fillStyle = 'rgba(255, 255, 255, ' + (0.6 * c.puddle).toFixed(3) + ')';
    for (var i = 0; i < 5; i++) {
      var bx = c.x + (hash(i * 7 + 1) - 0.5) * 220 * c.puddle;
      var by = CAR_GROUND + 8 + (hash(i * 13 + 2) - 0.5) * 16 * c.puddle;
      ctx.beginPath(); ctx.arc(bx, by, 3 + hash(i * 3) * 5, 0, Math.PI * 2); ctx.fill();
    }
  }

  // v4: uncovered-area indicator during the foam stage — faint pulsing dots
  // on the cells the spray has not reached yet, plus a coverage pill.
  function drawFoamCoverage(c) {
    if (state !== 'playing' || c.stage !== 'foam') return;
    var pulse = 0.18 + 0.14 * Math.sin(time * 4);
    ctx.fillStyle = 'rgba(255,255,255,' + pulse.toFixed(3) + ')';
    for (var i = 0; i < c.foamCells.length; i++) {
      var cell = c.foamCells[i];
      if (cell.covered) continue;
      ctx.beginPath();
      ctx.arc(c.x + cell.x, CAR_GROUND + cell.y, 5, 0, Math.PI * 2);
      ctx.fill();
    }
    var cov = Math.round(foamCoverage(c) * 100);
    var label = t('foamCov').replace('%d', cov);
    ctx.font = 'bold 15px Arial, sans-serif';
    var tw = ctx.measureText(label).width;
    // Pill above the car (below the patience bar, clear of the progress bar
    // even under the foam zoom).
    var py = CAR_GROUND - (c.spec.type.top || 116) - 34;
    ctx.fillStyle = 'rgba(15, 23, 42, 0.6)';
    rr(ctx, c.x - tw / 2 - 12, py, tw + 24, 26, 13); ctx.fill();
    flatText(label, c.x, py + 18, 'bold 15px Arial, sans-serif', '#ffffff', 'center', 'middle');
  }

  // v4: the tool the finger is dragging, drawn following the pointer so the
  // drag feels tactile (foam gun / spray nozzle / sponge / towel).
  function drawDragTool() {
    if (!pointerWorld.active || !dragTool || !car) return;
    var x = pointerWorld.x, y = pointerWorld.y;
    ctx.save();
    ctx.translate(x, y);
    if (dragTool === 'foam') {
      // Foam spray gun + cone of foam.
      ctx.fillStyle = '#38bdf8';
      rr(ctx, -6, -22, 12, 20, 4); ctx.fill();
      ctx.fillStyle = '#0369a1';
      rr(ctx, -3, -26, 6, 6, 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.beginPath();
      ctx.moveTo(-4, -2); ctx.lineTo(4, -2); ctx.lineTo(16, 22); ctx.lineTo(-16, 22);
      ctx.closePath(); ctx.fill();
    } else if (dragTool === 'spray') {
      // Water spray nozzle + fan of water.
      ctx.fillStyle = '#0ea5e9';
      rr(ctx, -5, -20, 10, 18, 3); ctx.fill();
      ctx.fillStyle = '#0369a1';
      rr(ctx, -7, -24, 14, 6, 3); ctx.fill();
      ctx.strokeStyle = 'rgba(126,200,255,0.8)';
      ctx.lineWidth = 2;
      for (var i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.moveTo(0, -2);
        ctx.lineTo(i * 9, 20);
        ctx.stroke();
      }
    } else if (dragTool === 'sponge') {
      // Sponge (yellow, with holes) tilted with the drag.
      ctx.rotate(-0.2);
      ctx.fillStyle = '#facc15';
      rr(ctx, -20, -13, 40, 26, 8); ctx.fill();
      ctx.fillStyle = '#eab308';
      rr(ctx, -20, -13, 40, 8, 8); ctx.fill();
      ctx.fillStyle = '#b45309';
      ctx.beginPath(); ctx.arc(-10, -2, 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(2, 4, 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(11, -4, 2.5, 0, Math.PI * 2); ctx.fill();
    } else if (dragTool === 'towel') {
      // Towel (light blue cloth, wavy).
      ctx.rotate(0.15);
      ctx.fillStyle = '#bae6fd';
      ctx.beginPath();
      ctx.moveTo(-22, -10);
      ctx.quadraticCurveTo(0, -16, 22, -10);
      ctx.quadraticCurveTo(24, 2, 20, 12);
      ctx.quadraticCurveTo(0, 18, -20, 12);
      ctx.quadraticCurveTo(-24, 0, -22, -10);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-18, 0); ctx.quadraticCurveTo(0, 6, 18, 0);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawQueue() {
    for (var i = 0; i < queue.length; i++) {
      var qx = 352 + i * 92;
      var qy = 486 - i * 6;
      drawCarShape(qx, qy, queue[i], 0.4, {});
      // Small "waiting" dots above the first queued car.
      if (i === 0) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.55)';
        for (var d = 0; d < 3; d++) {
          var pulse = 0.5 + 0.5 * Math.sin(time * 4 + d * 0.9);
          ctx.globalAlpha = 0.4 + 0.6 * pulse;
          ctx.beginPath(); ctx.arc(qx - 12 + d * 12, qy - 78, 3.5, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
    }
  }

  // ============================== Foreground UI ==============================
  function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      var a = clamp(p.life / p.maxLife, 0, 1);
      if (p.type === 'bubble') {
        ctx.globalAlpha = 0.85 * a;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#dbeafe';
        ctx.beginPath(); ctx.arc(p.x + p.size * 0.3, p.y + p.size * 0.3, p.size * 0.5, 0, Math.PI * 2); ctx.fill();
      } else if (p.type === 'drop') {
        ctx.globalAlpha = 0.8 * a;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
      } else if (p.type === 'star') {
        ctx.globalAlpha = a;
        drawStar(p.x, p.y, p.size, p.color, time * 3 + p.maxLife * 10);
      } else if (p.type === 'coin') {
        ctx.globalAlpha = a;
        drawCoinIcon(p.x, p.y, p.size);
      } else {
        ctx.globalAlpha = 0.7 * a;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }
  function drawPopups() {
    for (var i = 0; i < popups.length; i++) {
      var q = popups[i];
      var a = clamp(q.life / 0.5, 0, 1);
      ctx.globalAlpha = a;
      textWithShadow(q.text, q.x, q.y, 'bold ' + q.size + 'px Arial, sans-serif', q.color, 'rgba(0,0,0,0.45)', 2);
    }
    ctx.globalAlpha = 1;
  }

  function drawCustomerFace() {
    if (!car || car.stage === 'arriving' || car.stage === 'leaving') return;
    var frac = clamp(car.patience / car.patienceMax, 0, 1);
    var fx = PATIENCE_BAR.x + PATIENCE_BAR.w + 28, fy = PATIENCE_BAR.y + PATIENCE_BAR.h / 2;
    // Bubble.
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(fx, fy, 22, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#cbd5e1';
    ctx.lineWidth = 2;
    ctx.stroke();
    // Face.
    ctx.fillStyle = '#f2c29b';
    ctx.beginPath(); ctx.arc(fx, fy, 15, 0, Math.PI * 2); ctx.fill();
    // Hair.
    ctx.fillStyle = '#5b3a1e';
    ctx.beginPath(); ctx.arc(fx, fy - 5, 14, Math.PI, Math.PI * 2); ctx.fill();
    // Eyes.
    ctx.fillStyle = '#111827';
    var worried = frac < 0.6;
    ctx.beginPath(); ctx.arc(fx - 5, fy - 1, 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(fx + 5, fy - 1, 1.8, 0, Math.PI * 2); ctx.fill();
    // Brows + mouth by mood.
    ctx.strokeStyle = '#111827';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    if (frac > 0.6) {
      ctx.moveTo(fx - 8, fy - 6); ctx.lineTo(fx - 2, fy - 7);
      ctx.moveTo(fx + 2, fy - 7); ctx.lineTo(fx + 8, fy - 6);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(fx, fy + 3, 6, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();
    } else if (frac > 0.3) {
      ctx.moveTo(fx - 8, fy - 8); ctx.lineTo(fx - 2, fy - 6);
      ctx.moveTo(fx + 2, fy - 6); ctx.lineTo(fx + 8, fy - 8);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(fx - 5, fy + 7); ctx.lineTo(fx + 5, fy + 7);
      ctx.stroke();
    } else {
      ctx.moveTo(fx - 8, fy - 4); ctx.lineTo(fx - 2, fy - 7);
      ctx.moveTo(fx + 2, fy - 7); ctx.lineTo(fx + 8, fy - 4);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(fx, fy + 11, 5, 1.15 * Math.PI, 1.85 * Math.PI);
      ctx.stroke();
      // Sweat drop.
      ctx.fillStyle = '#7ec8ff';
      ctx.beginPath(); ctx.arc(fx + 14, fy - 8, 3.5, 0, Math.PI * 2); ctx.fill();
    }
    // VIP crown on the face bubble.
    if (car.spec.vip) drawCrown(fx, fy - 26, 9);
  }

  function drawPatience() {
    if (!car || car.stage === 'arriving' || car.stage === 'leaving') return;
    var r = PATIENCE_BAR;
    var frac = clamp(car.patience / car.patienceMax, 0, 1);
    var col = frac > 0.5 ? '#22c55e' : (frac > 0.25 ? '#f59e0b' : '#ef4444');
    ctx.fillStyle = 'rgba(15, 23, 42, 0.55)';
    rr(ctx, r.x - 3, r.y - 3, r.w + 6, r.h + 6, 10); ctx.fill();
    ctx.fillStyle = '#e2e8f0';
    rr(ctx, r.x, r.y, r.w, r.h, 8); ctx.fill();
    if (frac > 0) {
      ctx.fillStyle = col;
      rr(ctx, r.x, r.y, Math.max(10, r.w * frac), r.h, 8); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      rr(ctx, r.x, r.y, Math.max(10, r.w * frac), r.h * 0.45, 8); ctx.fill();
    }
    if (frac <= 0.25 && Math.floor(time * 3) % 2 === 0) {
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 2;
      rr(ctx, r.x - 3, r.y - 3, r.w + 6, r.h + 6, 10); ctx.stroke();
    }
    drawCustomerFace();
    drawRequestChip();
  }

  // Special order chip (v3: windows / wax / hurry / perfect / speed /
  // no-scratch / VIP wash / emergency) above the patience bar.
  function drawRequestChip() {
    if (!car || !car.request || car.stage === 'arriving' || car.stage === 'leaving') return;
    var req = car.request;
    var label = '';
    var bg = '#2563eb';
    if (req.type === 'windows') { label = t('reqWindows') + '  +' + req.bonus; bg = '#0284c7'; }
    else if (req.type === 'wax') { label = t('reqWax') + '  +' + req.bonus; bg = '#d97706'; }
    else if (req.type === 'hurry') { label = t('reqHurry') + '  2x ' + t('tip'); bg = '#dc2626'; }
    else if (req.type === 'perfect') { label = t('reqPerfect') + '  +' + req.bonus; bg = '#b45309'; }
    else if (req.type === 'speed') { label = t('reqSpeed') + '  +' + req.bonus; bg = '#7c3aed'; }
    else if (req.type === 'noscratch') { label = t('reqNoscratch') + '  +' + req.bonus; bg = '#0d9488'; }
    else if (req.type === 'vipwash') { label = t('reqVipwash') + '  +' + req.bonus; bg = '#ca8a04'; }
    else if (req.type === 'emergency') { label = t('reqEmergency') + '  2x'; bg = '#dc2626'; }
    ctx.font = 'bold 14px Arial, sans-serif';
    var tw = ctx.measureText(label).width;
    var w = tw + 46, x = PATIENCE_BAR.x, y = PATIENCE_BAR.y - 32;
    // No-Scratch chip pulses so the warning is impossible to miss.
    if (req.type === 'noscratch') {
      var pulse = 0.6 + 0.4 * Math.sin(time * 5);
      ctx.strokeStyle = 'rgba(255,255,255,' + pulse.toFixed(2) + ')';
      ctx.lineWidth = 2.5;
      rr(ctx, x - 2, y - 2, w + 4, 28, 13); ctx.stroke();
    }
    ctx.fillStyle = bg;
    rr(ctx, x, y, w, 24, 12); ctx.fill();
    // Icon.
    var ix = x + 14, iy = y + 12;
    if (req.type === 'windows') {
      ctx.fillStyle = '#bae6fd';
      rr(ctx, ix - 6, iy - 6, 12, 12, 2); ctx.fill();
      ctx.strokeStyle = bg; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(ix, iy - 6); ctx.lineTo(ix, iy + 6); ctx.moveTo(ix - 6, iy); ctx.lineTo(ix + 6, iy); ctx.stroke();
    } else if (req.type === 'wax') {
      drawStar(ix, iy, 7, '#fef08a', 0);
    } else if (req.type === 'perfect') {
      drawStar(ix, iy, 8, '#ffffff', 0);
    } else if (req.type === 'speed') {
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(ix + 2, iy - 8); ctx.lineTo(ix - 4, iy + 1); ctx.lineTo(ix, iy + 1);
      ctx.lineTo(ix - 2, iy + 8); ctx.lineTo(ix + 5, iy - 1); ctx.lineTo(ix + 1, iy - 1);
      ctx.closePath(); ctx.fill();
    } else if (req.type === 'noscratch') {
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(ix, iy - 7); ctx.lineTo(ix + 6, iy - 4); ctx.lineTo(ix + 6, iy + 1);
      ctx.quadraticCurveTo(ix + 6, iy + 6, ix, iy + 8);
      ctx.quadraticCurveTo(ix - 6, iy + 6, ix - 6, iy + 1);
      ctx.lineTo(ix - 6, iy - 4); ctx.closePath(); ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(ix, iy - 1, 1.6, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(ix - 1, iy + 2, 2, 3);
    } else if (req.type === 'vipwash') {
      drawCrown(ix, iy - 1, 9);
    } else if (req.type === 'emergency') {
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(ix, iy, 5, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
      for (var a = 0; a < 8; a++) {
        var an = a * Math.PI / 4;
        ctx.beginPath();
        ctx.moveTo(ix + Math.cos(an) * 7, iy + Math.sin(an) * 7);
        ctx.lineTo(ix + Math.cos(an) * 10, iy + Math.sin(an) * 10);
        ctx.stroke();
      }
    } else {
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(ix, iy, 7, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ix, iy); ctx.lineTo(ix, iy - 4.5); ctx.moveTo(ix, iy); ctx.lineTo(ix + 4, iy + 1); ctx.stroke();
    }
    flatText(label, x + 26 + tw / 2, y + 12, 'bold 14px Arial, sans-serif', '#ffffff', 'center', 'middle');
  }

  // v3 dirt legend: small icons of the dirt types on this vehicle, so the
  // player can plan (heavy mud first, oil needs the cleaner...).
  function drawDirtLegend() {
    if (!car || car.stage === 'arriving' || car.stage === 'leaving' || car.stage === 'dry' || car.stage === 'drying' || car.stage === 'wax') return;
    var kinds = [];
    var seen = {};
    for (var i = 0; i < car.dirt.length; i++) {
      var d = car.dirt[i];
      if (d.amount <= 0) continue;
      var key = (d.kind === 'mud' && d.heavy) ? 'heavymud' : d.kind;
      if (!seen[key]) { seen[key] = true; kinds.push(key); }
    }
    if (!kinds.length) return;
    var y = 254;
    var w = kinds.length * 28 + 12;
    var x = W / 2 - w / 2;
    ctx.fillStyle = 'rgba(15, 23, 42, 0.55)';
    rr(ctx, x, y, w, 26, 13); ctx.fill();
    for (var k = 0; k < kinds.length; k++) {
      var ix = x + 20 + k * 28, iy = y + 13;
      var kind = kinds[k];
      if (kind === 'mud') { ctx.fillStyle = '#7d5a35'; ctx.beginPath(); ctx.arc(ix, iy, 8, 0, Math.PI * 2); ctx.fill(); }
      else if (kind === 'heavymud') {
        ctx.fillStyle = '#4a2f18'; ctx.beginPath(); ctx.arc(ix, iy, 9, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#3a2412';
        ctx.beginPath(); ctx.arc(ix - 3, iy - 2, 3, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(ix + 3, iy + 2, 3, 0, Math.PI * 2); ctx.fill();
      }
      else if (kind === 'dust') { ctx.fillStyle = '#b0a58e'; ellipse(ctx, ix, iy, 9, 5); }
      else if (kind === 'tar') {
        ctx.fillStyle = '#1f2937'; ctx.beginPath(); ctx.arc(ix, iy, 8, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ellipse(ctx, ix - 3, iy - 3, 3, 2);
      }
      else if (kind === 'bird') {
        ctx.fillStyle = '#f8fafc'; ctx.beginPath(); ctx.arc(ix, iy, 8, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1.5; ctx.stroke();
      }
      else if (kind === 'oil') {
        ctx.fillStyle = '#1a1a2e'; ctx.beginPath(); ctx.arc(ix, iy, 8, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#a78bfa'; ctx.beginPath(); ctx.arc(ix - 2, iy - 2, 2.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#2dd4bf'; ctx.beginPath(); ctx.arc(ix + 2, iy + 1, 2, 0, Math.PI * 2); ctx.fill();
      }
      else if (kind === 'insect') {
        ctx.fillStyle = '#2d1a12';
        ctx.beginPath(); ctx.arc(ix - 3, iy - 2, 2.5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(ix + 3, iy + 1, 2.5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(ix, iy + 3, 2, 0, Math.PI * 2); ctx.fill();
      }
      else if (kind === 'cement') {
        ctx.fillStyle = '#9aa0a6';
        ctx.beginPath();
        ctx.moveTo(ix - 7, iy + 5); ctx.lineTo(ix - 4, iy - 6); ctx.lineTo(ix + 5, iy - 5);
        ctx.lineTo(ix + 7, iy + 4); ctx.closePath(); ctx.fill();
      }
    }
  }

  // v3 random-event banner (top of the wash area, fades after ~3s).
  function drawEventBanner() {
    if (!eventBanner || eventBanner.t <= 0) return;
    var a = clamp(eventBanner.t / 0.6, 0, 1);
    ctx.globalAlpha = a;
    ctx.font = 'bold 17px Arial, sans-serif';
    var tw = ctx.measureText(eventBanner.text).width;
    var w = Math.min(W - 40, tw + 36);
    var x = W / 2 - w / 2, y = 186;
    ctx.fillStyle = eventBanner.color;
    rr(ctx, x, y, w, 34, 17); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.font = 'bold 15px Arial, sans-serif';
    flatText(eventBanner.text, W / 2, y + 22, 'bold 15px Arial, sans-serif', '#ffffff', 'center', 'middle');
    ctx.globalAlpha = 1;
  }

  // Draw text shrunk to fit a max width (tool names vary a lot by language).
  function fitText(text, x, y, maxW, fontSize, color) {
    var size = fontSize;
    ctx.font = 'bold ' + size + 'px Arial, sans-serif';
    while (size > 9 && ctx.measureText(text).width > maxW) {
      size -= 1;
      ctx.font = 'bold ' + size + 'px Arial, sans-serif';
    }
    flatText(text, x, y, 'bold ' + size + 'px Arial, sans-serif', color, 'left', 'middle');
  }

  // Small icon for a tool (shop grid).
  function drawToolIcon(id, cx, cy) {
    if (id === 'washer') {
      ctx.fillStyle = '#0ea5e9';
      ctx.fillRect(cx - 9, cy - 6, 14, 12);
      ctx.fillStyle = '#0369a1';
      ctx.fillRect(cx + 5, cy - 2, 7, 4);
      ctx.fillStyle = '#7dd3fc';
      for (var i = 0; i < 3; i++) {
        ctx.beginPath(); ctx.arc(cx + 10 + i * 3, cy - 3 + i * 3, 1.8, 0, Math.PI * 2); ctx.fill();
      }
    } else if (id === 'cannon') {
      ctx.fillStyle = '#f8fafc';
      ctx.beginPath(); ctx.arc(cx - 3, cy, 8, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + 5, cy - 4, 6, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + 6, cy + 4, 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath(); ctx.arc(cx - 3, cy - 2, 3, 0, Math.PI * 2); ctx.fill();
    } else if (id === 'brush') {
      ctx.fillStyle = '#a16207';
      ctx.fillRect(cx - 10, cy - 7, 9, 14);
      ctx.fillStyle = '#f59e0b';
      ctx.fillRect(cx - 1, cy - 7, 8, 14);
      ctx.fillStyle = '#92400e';
      ctx.fillRect(cx + 7, cy - 7, 3, 14);
    } else if (id === 'oil') {
      ctx.fillStyle = '#1a1a2e';
      ctx.beginPath(); ctx.arc(cx, cy, 9, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#a78bfa';
      ctx.beginPath(); ctx.arc(cx - 3, cy - 2, 3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#2dd4bf';
      ctx.beginPath(); ctx.arc(cx + 3, cy + 2, 2.5, 0, Math.PI * 2); ctx.fill();
    } else if (id === 'dryer') {
      ctx.fillStyle = '#ffd93b';
      ctx.beginPath(); ctx.arc(cx, cy, 8, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 2;
      for (var a = 0; a < 8; a++) {
        var an = a * Math.PI / 4;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(an) * 10, cy + Math.sin(an) * 10);
        ctx.lineTo(cx + Math.cos(an) * 13, cy + Math.sin(an) * 13);
        ctx.stroke();
      }
    } else { // polish
      drawStar(cx, cy, 11, '#facc15', 0);
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(cx - 3, cy - 3, 2.5, 0, Math.PI * 2); ctx.fill();
    }
  }

  // v3 tool strip: scrub-mode toggles (sponge / Power Washer / Special Brush)
  // during the soap and scrub stages. Unowned tools show a lock.
  // v4 tool strip: during the scrub stage it is sponge / washer / brush (v3);
  // during the pressure stage it is hose / washer (the brush does not apply).
  // The hose is the basic spray; 'sponge' is the shared "default tool" id.
  function drawToolStrip() {
    if (!car || (car.stage !== 'pressure' && car.stage !== 'scrub')) return;
    var noscratch = car.request && car.request.type === 'noscratch';
    for (var i = 0; i < TOOL_BTNS.length; i++) {
      var b = TOOL_BTNS[i];
      if (car.stage === 'pressure' && b.id === 'brush') continue; // no brush for mud
      var owned = b.id === 'sponge' || tools[b.id];
      var selected = selectedTool === b.id;
      var bg = selected ? '#facc15' : (owned ? '#e2e8f0' : '#cbd5e1');
      var fg = selected ? '#422006' : '#334155';
      ctx.fillStyle = bg;
      rr(ctx, b.x, b.y, b.w, b.h, 10); ctx.fill();
      // No-Scratch: the washer button pulses red — using it costs coins.
      if (b.id === 'washer' && noscratch) {
        var pulse = 0.6 + 0.4 * Math.sin(time * 5);
        ctx.strokeStyle = 'rgba(220,38,38,' + pulse.toFixed(2) + ')';
        ctx.lineWidth = 3;
        rr(ctx, b.x, b.y, b.w, b.h, 10); ctx.stroke();
      } else if (selected) {
        ctx.strokeStyle = '#ca8a04'; ctx.lineWidth = 2;
        rr(ctx, b.x, b.y, b.w, b.h, 10); ctx.stroke();
      }
      if (b.id === 'sponge') {
        if (car.stage === 'pressure') {
          // Hose icon (water drops).
          ctx.fillStyle = '#0ea5e9';
          ctx.beginPath(); ctx.arc(b.x + 18, b.y + b.h / 2 - 2, 5, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#7dd3fc';
          ctx.beginPath(); ctx.arc(b.x + 24, b.y + b.h / 2 + 4, 3, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(b.x + 12, b.y + b.h / 2 + 5, 2.5, 0, Math.PI * 2); ctx.fill();
        } else {
          ctx.fillStyle = '#facc15';

  // Compact mission tracker during play (one line under the hint).
  function drawMissionTracker() {
    if (state !== 'playing' || !car || car.stage === 'wax') return;
    if (!missions.length) return;
    var bestM = null, bestFrac = -1;
    for (var i = 0; i < missions.length; i++) {
      var f = clamp(missions[i].progress / missions[i].def.target, 0, 1);
      if (f > bestFrac) { bestFrac = f; bestM = missions[i]; }
    }
    if (!bestM) return;
    var label = '★ ' + missionText(bestM.def) + '  ' + Math.min(bestM.progress, bestM.def.target) + '/' + bestM.def.target;
    ctx.fillStyle = 'rgba(15, 23, 42, 0.55)';
    ctx.font = 'bold 13px Arial, sans-serif';
    var tw = ctx.measureText(label).width;
    rr(ctx, W / 2 - tw / 2 - 10, 742, tw + 20, 22, 11); ctx.fill();
    flatText(label, W / 2, 753, 'bold 13px Arial, sans-serif', '#ffffff', 'center', 'middle');
  }

  function drawProgress() {
    if (!car) return;
    var r = PROGRESS_BAR;
    var prog = 0;
    // v4: five drag stages, each a slice of the bar (foam 0-0.15, pressure
    // 0.15-0.3, scrub 0.3-0.6, rinse 0.6-0.85, dry 0.85-1).
    if (car.stage === 'foam') prog = foamCoverage(car) * 0.15;
    else if (car.stage === 'pressure') prog = 0.15 + (1 - heavyMudRemaining(car)) * 0.15;
    else if (car.stage === 'scrub') prog = 0.3 + car.washProgress * 0.3;
    else if (car.stage === 'nowater') prog = 0.6; // v3: scrub done, waiting for water
    else if (car.stage === 'rinse') prog = 0.6 + (1 - foamTotal(car)) * 0.25;
    else if (car.stage === 'dry') prog = 0.85 + (1 - dropsRemaining(car)) * 0.15;
    else if (car.stage === 'drying') prog = 0.85 + 0.15 * clamp(stageAnimT / dryDur, 0, 1);
    else if (car.stage === 'wax') prog = car.waxProgress;
    else if (car.stage === 'leaving' || car.stage === 'arriving') prog = car.clean ? 1 : 0;
    ctx.fillStyle = 'rgba(15, 23, 42, 0.55)';
    rr(ctx, r.x - 3, r.y - 3, r.w + 6, r.h + 6, 9); ctx.fill();
    ctx.fillStyle = '#e2e8f0';
    rr(ctx, r.x, r.y, r.w, r.h, 7); ctx.fill();
    if (prog > 0) {
      var grad = ctx.createLinearGradient(r.x, 0, r.x + r.w, 0);
      grad.addColorStop(0, '#38bdf8');
      grad.addColorStop(1, '#22c55e');
      ctx.fillStyle = grad;
      rr(ctx, r.x, r.y, Math.max(12, r.w * prog), r.h, 7); ctx.fill();
    }
    flatText(Math.round(prog * 100) + '%', r.x + r.w + 34, r.y + r.h / 2 + 1, 'bold 15px Arial, sans-serif', '#ffffff', 'center', 'middle');
  }

  function stageState(id) {
    if (!car) return 'todo';
    if (car.stage === 'wax') return 'done'; // wax is an extra step after all 5 stages
    var cur = STAGE_ORDER.indexOf(car.stage === 'nowater' ? 'rinse' : (car.stage === 'drying' ? 'dry' : car.stage));
    var mine = STAGE_ORDER.indexOf(id);
    if (car.stage === 'arriving' || car.stage === 'leaving') return mine === 0 ? 'current' : 'todo';
    if (mine < cur) return 'done';
    if (mine === cur) return 'current';
    return 'todo';
  }
  function drawStageIcon(id, cx, cy, active) {
    if (id === 'foam') {
      ctx.fillStyle = active ? '#ffffff' : '#cbd5e1';
      ctx.beginPath(); ctx.arc(cx - 6, cy + 3, 8, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + 6, cy - 2, 10, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + 2, cy + 8, 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = active ? '#38bdf8' : '#94a3b8';
      ctx.beginPath(); ctx.arc(cx + 3, cy - 4, 3, 0, Math.PI * 2); ctx.fill();
    } else if (id === 'pressure') {
      // Water jet: nozzle + spray fan.
      ctx.fillStyle = active ? '#0ea5e9' : '#cbd5e1';
      ctx.fillRect(cx - 10, cy - 8, 12, 7);
      ctx.fillStyle = active ? '#0369a1' : '#94a3b8';
      ctx.fillRect(cx + 2, cy - 6, 5, 3);
      ctx.strokeStyle = active ? '#7dd3fc' : '#cbd5e1';
      ctx.lineWidth = 2;
      for (var i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.moveTo(cx + 7, cy - 4);
        ctx.lineTo(cx + 14, cy + 2 + i * 5);
        ctx.stroke();
      }
    } else if (id === 'scrub') {
      ctx.fillStyle = active ? '#ffd93b' : '#cbd5e1';
      rr(ctx, cx - 14, cy - 9, 28, 18, 6); ctx.fill();
      ctx.fillStyle = active ? '#b45309' : '#94a3b8';
      ctx.beginPath(); ctx.arc(cx - 6, cy - 2, 2.2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + 3, cy + 3, 2.2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + 8, cy - 4, 2.2, 0, Math.PI * 2); ctx.fill();
    } else if (id === 'rinse') {
      ctx.fillStyle = active ? '#38bdf8' : '#cbd5e1';
      ctx.beginPath();
      ctx.moveTo(cx, cy - 13);
      ctx.quadraticCurveTo(cx + 10, cy + 2, cx, cy + 11);
      ctx.quadraticCurveTo(cx - 10, cy + 2, cx, cy - 13);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.beginPath(); ctx.arc(cx - 3, cy + 2, 2.5, 0, Math.PI * 2); ctx.fill();
    } else { // dry (v4: towel)
      ctx.fillStyle = active ? '#bae6fd' : '#cbd5e1';
      rr(ctx, cx - 13, cy - 9, 26, 18, 5); ctx.fill();
      ctx.strokeStyle = active ? '#38bdf8' : '#94a3b8';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx - 9, cy + 1); ctx.quadraticCurveTo(cx, cy + 5, cx + 9, cy + 1);
      ctx.stroke();
      ctx.fillStyle = active ? '#ffffff' : '#e2e8f0';
      ctx.beginPath(); ctx.arc(cx - 6, cy - 4, 2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + 5, cy - 5, 2, 0, Math.PI * 2); ctx.fill();
    }
  }
  function drawStageButtons() {
    for (var i = 0; i < STAGE_BTNS.length; i++) {
      var b = STAGE_BTNS[i];
      var st = stageState(b.id);
      var isCurrent = st === 'current';
      var pulse = isCurrent ? 1 + 0.04 * Math.sin(time * 5) : 1;
      var cx = b.x + b.w / 2, cy = b.y + b.h / 2;
      var w = b.w * pulse, h = b.h * pulse;
      // v3: the rinse button is greyed with a red X while the water is out.
      var noWater = b.id === 'rinse' && outageT > 0;
      var bg = noWater ? '#94a3b8' : (st === 'done' ? '#22c55e' : (isCurrent ? '#2563eb' : '#64748b'));
      ctx.fillStyle = shade(bg, -45);
      rr(ctx, cx - w / 2, cy - h / 2 + 4, w, h, 14); ctx.fill();
      ctx.fillStyle = bg;
      rr(ctx, cx - w / 2, cy - h / 2, w, h, 14); ctx.fill();
      if (noWater) {
        ctx.strokeStyle = '#dc2626';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(cx - 14, cy - 14); ctx.lineTo(cx + 14, cy + 14);
        ctx.moveTo(cx + 14, cy - 14); ctx.lineTo(cx - 14, cy + 14);
        ctx.stroke();
      }
      if (isCurrent) {
        ctx.strokeStyle = 'rgba(255,255,255,0.9)';
        ctx.lineWidth = 2.5;
        rr(ctx, cx - w / 2 - 2, cy - h / 2 - 2, w + 4, h + 4, 15); ctx.stroke();
      }
      drawStageIcon(b.id, cx, cy - 10, st !== 'todo');
      flatText(t(b.id), cx, cy + 24, 'bold 14px Arial, sans-serif', '#ffffff');
      if (st === 'done') {
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(cx + w / 2 - 10, cy - h / 2 + 10, 9, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#22c55e';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(cx + w / 2 - 15, cy - h / 2 + 10);
        ctx.lineTo(cx + w / 2 - 11, cy - h / 2 + 14);
        ctx.lineTo(cx + w / 2 - 5, cy - h / 2 + 6);
        ctx.stroke();
      }
    }
  }

  function drawHint() {
    if (state !== 'playing' || !car) return;
    var msg = '';
    var y = 724;
    if (car.stage === 'foam') msg = t('dragFoam');
    else if (car.stage === 'pressure') msg = t('dragPressure');
    else if (car.stage === 'scrub') msg = t('dragToScrub');
    else if (car.stage === 'nowater') msg = t('noWater') + '  ' + Math.ceil(outageT) + 's';
    else if (car.stage === 'rinse') msg = outageT > 0 ? (t('noWater') + '  ' + Math.ceil(outageT) + 's') : t('dragRinse');
    else if (car.stage === 'dry') msg = t('dragDry');
    else if (car.stage === 'wax') { msg = t('waxHint'); y = 762; }
    else return;
    var a = 0.75 + 0.25 * Math.sin(hintPulse * 4);
    ctx.globalAlpha = a;
    flatText(msg, W / 2, y, 'bold 17px Arial, sans-serif', '#ffffff');
    ctx.globalAlpha = 1;
    // Pointing hand hint during the drag stages: a moving finger dot over
    // the car (only while the player has not started dragging yet). The dot
    // is a world position, converted to screen space for this UI layer.
    if ((car.stage === 'foam' || car.stage === 'scrub' || car.stage === 'rinse' || car.stage === 'dry') && !pointerWorld.active) {
      var fw = worldToScreen(car.x + Math.sin(hintPulse * 1.6) * 70,
                             CAR_GROUND - 60 + Math.cos(hintPulse * 2.2) * 14);
      var fx = fw.x, fy = fw.y;
      ctx.globalAlpha = 0.55 + 0.3 * Math.sin(hintPulse * 4);
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(fx, fy, 16, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#2563eb';
      ctx.beginPath(); ctx.arc(fx, fy, 10, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function drawIconButton(r, kind) {
    ctx.fillStyle = 'rgba(15, 23, 42, 0.6)';
    ctx.beginPath(); ctx.arc(r.x + r.w / 2, r.y + r.h / 2, 21, 0, Math.PI * 2); ctx.fill();
    var cx = r.x + r.w / 2, cy = r.y + r.h / 2;
    ctx.fillStyle = '#ffffff';
    if (kind === 'pause') {
      ctx.fillRect(cx - 8, cy - 9, 6, 18);
      ctx.fillRect(cx + 2, cy - 9, 6, 18);
    } else if (kind === 'sound') {
      ctx.beginPath();
      ctx.moveTo(cx - 8, cy - 5); ctx.lineTo(cx - 3, cy - 5); ctx.lineTo(cx + 2, cy - 10);
      ctx.lineTo(cx + 2, cy + 10); ctx.lineTo(cx - 3, cy + 5); ctx.lineTo(cx - 8, cy + 5);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx + 2, cy, 8, -0.9, 0.9); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx + 2, cy, 12, -0.9, 0.9); ctx.stroke();
    } else { // muted
      ctx.beginPath();
      ctx.moveTo(cx - 8, cy - 5); ctx.lineTo(cx - 3, cy - 5); ctx.lineTo(cx + 2, cy - 10);
      ctx.lineTo(cx + 2, cy + 10); ctx.lineTo(cx - 3, cy + 5); ctx.lineTo(cx - 8, cy + 5);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#ff7b7b';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(cx + 5, cy - 7); ctx.lineTo(cx + 13, cy + 7);
      ctx.moveTo(cx + 13, cy - 7); ctx.lineTo(cx + 5, cy + 7);
      ctx.stroke();
    }
  }

    ctx.fillStyle = 'rgba(10, 20, 40, 0.6)';
    ctx.fillRect(0, 0, W, H);
    flatText(t('paused'), W / 2, 330, 'bold 38px Arial, sans-serif', '#ffffff');
    drawButton(resumeBtn, t('resume'), '#22c55e', '#ffffff', 'bold 24px Arial, sans-serif');
    drawButton(menuBtnPaused, t('menu'), '#475569', '#ffffff', 'bold 20px Arial, sans-serif');
    drawIconButton(muteBtn, AudioSys.userMuted ? 'muted' : 'sound');
  }

  function drawGameOver() {
    ctx.fillStyle = 'rgba(10, 20, 40, 0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffffff';
    rr(ctx, 40, 170, 400, 500, 22); ctx.fill();
    flatText(t('gameOver'), W / 2, 232, 'bold 34px Arial, sans-serif', '#0f172a');
    flatText(t('score'), W / 2, 300, 'bold 15px Arial, sans-serif', '#64748b');
    flatText(String(score), W / 2, 352, 'bold 58px Arial, sans-serif', '#0f172a');
    flatText(t('best') + '  ' + best, W / 2, 396, 'bold 19px Arial, sans-serif', '#b45309');
    flatText(t('vehiclesWashed') + ': ' + carsWashed, W / 2, 428, 'bold 17px Arial, sans-serif', '#64748b');
    if (newBest) {
      ctx.fillStyle = '#ffd93b';
      rr(ctx, 160, 448, 160, 34, 17); ctx.fill();
      flatText(t('newBest'), W / 2, 471, 'bold 16px Arial, sans-serif', '#422006');
    }
    drawButton(restartBtn, t('restart'), '#22c55e', '#ffffff', 'bold 22px Arial, sans-serif');
    drawButton(menuBtnOver, t('menu'), '#475569', '#ffffff', 'bold 19px Arial, sans-serif');
    drawIconButton(muteBtn, AudioSys.userMuted ? 'muted' : 'sound');
  }

  function drawLoading() {
    ctx.fillStyle = '#7ec8f7';
    ctx.fillRect(0, 0, W, H);
    flatText('CAR WASH', W / 2, 360, 'bold 36px Arial, sans-serif', '#ffffff');
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.arc(W / 2, 430, 18, time * 4, time * 4 + Math.PI * 1.5);
    ctx.stroke();
    flatText(t('loading'), W / 2, 480, '16px Arial, sans-serif', '#e0f2fe');
  }

  function render(dt) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (state === 'loading') { drawLoading(); return; }
    drawSky();
    // v4 camera: the world (building, ground, queue, car, particles, popups)
    // is drawn through the camera transform; the sky and all UI stay fixed.
    ctx.save();
    applyCameraTransform();
    drawWashBuilding();
    drawGround();
    drawQueue();
    // Main car.
    if (car) {
      var bounceY = 0;
      if (car.stage === 'arriving' || car.stage === 'leaving') {
        bounceY = Math.sin(car.bounceT * 18) * 1.5;
      }
      if (carBounce > 0) bounceY -= Math.sin(carBounce * Math.PI) * 6;
      ctx.save();
      ctx.translate(0, bounceY);
      drawCarShape(car.x, CAR_GROUND, car.spec, 1, {});
      if (!car.clean) {
        drawCarDirt(car);
        drawCarFoam(car);
        drawCarDrops(car);
      } else {
        // Clean car twinkles.
        if (Math.sin(time * 6) > 0.2) drawStar(car.x - 60, CAR_GROUND - 90, 7, '#fff7ae', time);
        if (Math.cos(time * 5) > 0.3) drawStar(car.x + 70, CAR_GROUND - 60, 6, '#ffffff', time * 2);
      }
      drawCarShine(car);
      ctx.restore();
      drawPuddle(car); // v4: foam puddle on the floor (not bounced with the car)
      drawFoamCoverage(car); // v4: uncovered-cell dots + coverage pill
    }
    drawParticles();
    drawDragTool(); // v4: the dragged tool follows the pointer
    drawPopups();
    ctx.restore();
    if (state === 'playing' || state === 'paused' || state === 'shop') {
      drawPatience();
      drawProgress();
    }
    if (state === 'playing') {
      drawStageButtons();
      drawHint();
      drawMissionTracker();
      // v3 overlays.
      drawDirtLegend();
      drawToolStrip();
      drawEventBanner();
      if (car && car.stage === 'wax') {
        drawButton(skipWaxBtn, t('skip'), '#475569', '#ffffff', 'bold 18px Arial, sans-serif');
      }
      drawHUD();
    } else if (state === 'menu') {
      drawMenu();
    } else if (state === 'shop') {
      drawHUD();
      drawShop();
    } else if (state === 'paused') {
      drawHUD();
      drawPaused();
    } else if (state === 'over') {
      drawGameOver();
    }
  }

  // ============================== Input ==============================
  function toLogical(e) {
    var r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
  }
  // Pointer event -> world coords (through the camera transform). All drag
  // hit-testing uses world coords, so the finger always hits where it points.
  function toWorld(e) {
    var p = toLogical(e);
    return screenToWorld(p.x, p.y);
  }
  // v4: which tool the finger drags in each stage (null = no drag stage).
  function dragToolForStage(stage) {
    if (stage === 'foam') return 'foam';
    if (stage === 'pressure' || stage === 'rinse') return 'spray';
    if (stage === 'scrub') return 'sponge';
    if (stage === 'dry') return 'towel';
    return null;
  }
  function applyDragAction(wx, wy) {
    if (!car) return false;
    if (car.stage === 'foam') return applyFoam(wx, wy);
    if (car.stage === 'pressure') return applyPressure(wx, wy);
    if (car.stage === 'scrub') return applyScrub(wx, wy);
    if (car.stage === 'rinse') return applyRinse(wx, wy);
    if (car.stage === 'dry') return applyDry(wx, wy);
    return false;
  }

  function onPointerDown(e) {
    e.preventDefault();
    AudioSys.unlock();
    var p = toLogical(e);
    if (state === 'menu') {
      if (hit(p.x, p.y, muteBtn)) { toggleMute(); return; }
      if (hit(p.x, p.y, menuTierBtn)) {
        // Tapping the tier pill unlocks when affordable; never starts the run.
        if (nextLockedTier()) buyTier();
        return;
      }
      startRun();
      return;
    }
    if (state === 'playing') {
      if (hit(p.x, p.y, pauseBtn)) { pauseGame('user'); return; }
      if (hit(p.x, p.y, muteBtn)) { toggleMute(); return; }
      if (car && car.stage === 'wax') {
        if (hit(p.x, p.y, skipWaxBtn)) {
          AudioSys.click();
          finishCar(); // skip the wax bonus
          return;
        }
        var w0 = screenToWorld(p.x, p.y);
        var wb = carBounds(car);
        if (hit(w0.x, w0.y, wb)) {
          waxing = true;
          waxId = e.pointerId;
          lastWaxX = w0.x; lastWaxY = w0.y;
        }
        return;
      }
      // v4: tool strip taps (hose / washer during pressure, sponge / washer /
      // brush during scrub). The stage chips are indicators, not buttons.
      if (car && (car.stage === 'pressure' || car.stage === 'scrub')) {
        for (var ti = 0; ti < TOOL_BTNS.length; ti++) {
          if (car.stage === 'pressure' && TOOL_BTNS[ti].id === 'brush') continue;
          if (hit(p.x, p.y, TOOL_BTNS[ti])) {
            var toolId = TOOL_BTNS[ti].id;
            if (toolId === 'sponge' || tools[toolId]) {
              selectedTool = toolId;
              AudioSys.click();
            } else {
              AudioSys.denied();
              addPopup(car.x, CAR_GROUND - 150, t('buyInShop'), '#ff7b7b', 18);
            }
            return;
          }
        }
      }
      // Start dragging on the car (v4: all five wash stages are drag-based).
      if (car && dragToolForStage(car.stage)) {
        var wp = screenToWorld(p.x, p.y);
        var bnds = carBounds(car);
        if (hit(wp.x, wp.y, bnds)) {
          scrubbing = true;
          scrubId = e.pointerId;
          lastScrubX = wp.x; lastScrubY = wp.y;
          pointerWorld.x = wp.x; pointerWorld.y = wp.y; pointerWorld.active = true;
          dragTool = dragToolForStage(car.stage);
          applyDragAction(wp.x, wp.y);
        }
      }
      return;
    }
    if (state === 'shop') {
      if (hit(p.x, p.y, muteBtn)) { toggleMute(); return; }
      if (hit(p.x, p.y, pauseBtn)) { pauseGame('user'); return; }
      if (hit(p.x, p.y, nextCarBtn)) {
        AudioSys.click();
        state = 'playing';
        spawnNextCar();
        return;
      }
      if (hit(p.x, p.y, tierBtn)) { buyTier(); return; }
      for (var i = 0; i < toolBtns.length; i++) {
        if (hit(p.x, p.y, toolBtns[i])) { buyTool(toolBtns[i].id); return; }
      }
      return;
    }
    if (state === 'paused') {
      if (hit(p.x, p.y, resumeBtn)) { resumeGame(); return; }
      if (hit(p.x, p.y, menuBtnPaused)) { toMenu(); return; }
      if (hit(p.x, p.y, muteBtn)) { toggleMute(); return; }
      return;
    }
    if (state === 'over') {
      if (hit(p.x, p.y, restartBtn)) { startRun(); return; }
      if (hit(p.x, p.y, menuBtnOver)) { toMenu(); return; }
      if (hit(p.x, p.y, muteBtn)) { toggleMute(); return; }
      return;
    }
  }

  function onPointerMove(e) {
    if (state !== 'playing') return;
    if (waxing && car && car.stage === 'wax') {
      if (e.pointerId !== undefined && waxId !== -1 && e.pointerId !== waxId) return;
      e.preventDefault();
      var wp = toWorld(e);
      var wdx = wp.x - lastWaxX, wdy = wp.y - lastWaxY;
      var wdist = Math.sqrt(wdx * wdx + wdy * wdy);
      if (wdist > 2) {
        // Circling fills the wax meter; ~3-4s of steady dragging completes it.
        car.waxProgress = clamp(car.waxProgress + wdist * 0.0016, 0, 1);
        if (Math.random() < 0.4) spawnSparkles(wp.x, wp.y, 1);
        if (Math.random() < 0.3) AudioSys.foamPop();
      }
      lastWaxX = wp.x; lastWaxY = wp.y;
      return;
    }
    if (!scrubbing) return;
    if (e.pointerId !== undefined && scrubId !== -1 && e.pointerId !== scrubId) return;
    e.preventDefault();
    var p = toWorld(e);
    pointerWorld.x = p.x; pointerWorld.y = p.y; pointerWorld.active = true;
    // Interpolate between last and current point so fast drags cover a path.
    var dx = p.x - lastScrubX, dy = p.y - lastScrubY;
    var dist = Math.sqrt(dx * dx + dy * dy);
    var steps = Math.min(12, Math.max(1, Math.ceil(dist / 14)));
    for (var i = 1; i <= steps; i++) {
      applyDragAction(lastScrubX + dx * i / steps, lastScrubY + dy * i / steps);
    }
    lastScrubX = p.x; lastScrubY = p.y;
    // The stage may have advanced mid-drag: the dragged tool follows it, so
    // one continuous drag flows from foam into pressure into scrub.
    if (car) dragTool = dragToolForStage(car.stage);
  }

  function onPointerUp(e) {
    if (scrubbing && (e.pointerId === undefined || e.pointerId === scrubId)) {
      scrubbing = false;
      scrubId = -1;
      dragTool = null;
      pointerWorld.active = false;
    }
    if (waxing && (e.pointerId === undefined || e.pointerId === waxId)) {
      waxing = false;
      waxId = -1;
    }
  }

  function onKeyDown(e) {
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      if (e.repeat) return;
      AudioSys.unlock();
      if (state === 'menu') startRun();
      else if (state === 'playing') {
        // v4: all wash stages are drag-based; Space only skips the wax bonus.
        if (car && car.stage === 'wax') finishCar(); // skip the wax bonus
      }
      else if (state === 'shop') { state = 'playing'; spawnNextCar(); }
      else if (state === 'paused') resumeGame();
      else if (state === 'over') {
        var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
        if (now - overAt > 600) startRun();
      }
    } else if (e.code === 'KeyP' || e.code === 'Escape') {
      if (state === 'playing' || state === 'shop') pauseGame('user');
      else if (state === 'paused') resumeGame();
    } else if (e.code === 'KeyM') {
      toggleMute();
    }
  }

  function setupInput() {
    canvas.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove, { passive: false });
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', onPointerUp);
    window.addEventListener('keydown', onKeyDown);
    canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden && (state === 'playing' || state === 'shop')) pauseGame('tab');
    });
    window.addEventListener('blur', function () {
      if (state === 'playing' || state === 'shop') pauseGame('tab');
    });
    window.addEventListener('resize', resize);
  }

  // ============================== Main loop ==============================
  function loop(ts) {
    requestAnimationFrame(loop);
    var dt = lastTs ? (ts - lastTs) / 1000 : 0.016;
    lastTs = ts;
    if (dt > 0.05) dt = 0.05;
    if (dt < 0) dt = 0;
    time += dt;
    if (state === 'playing') updatePlaying(dt);
    else if (state === 'menu') updateMenu(dt);
    else if (state === 'shop') updateShop(dt);
    else if (state === 'over') updateOver(dt);
    if (state !== 'paused') updateCamera(dt); // v4: camera eases toward its target
    render(dt);
  }

  // ============================== Boot ==============================
  function boot() {
    resize();
    setupInput();
    initScenery();
    resetRun();
    // A dirty car waits in the bay from the very first frame (instant hook).
    car = newCar(randomCarSpec(false));
    car.x = CAR_CX;
    car.stage = 'foam';
    car.patience = car.patienceMax;
    state = 'loading';
    requestAnimationFrame(loop);

    Bridge.init().then(function (ok) {
      var rawLang = '';
      if (ok) {
        try { rawLang = window.bridge.platform.language || ''; } catch (e) {}
      }
      if (!rawLang && typeof navigator !== 'undefined' && navigator.language) rawLang = navigator.language;
      setLanguage(rawLang);
      if (ok) {
        Bridge.subscribe();
        Bridge.applyInitialPlatformState();
      }
      return Bridge.loadProgress();
    }).then(function (progress) {
      best = progress.best || 0;
      AudioSys.setUserMuted(!!progress.muted);
      bank = progress.bank || 0;
      unlockedTier = clamp(progress.unlockedTier || 1, 1, TIERS.length);
      initMissions(); // re-roll missions with the loaded tier (new types may qualify)
      state = 'menu';
      render(0); // first playable frame
      Bridge.send('game_ready');
    }).catch(function () {
      // Never block the game on Bridge/storage failures.
      state = 'menu';
      render(0);
      Bridge.send('game_ready');
    });
  }

  // Debug hook for automated testing (?debug=1): read-only state + patience control.
  // Harmless in production: it only exposes game state and test helpers.
  try {
    if (typeof window !== 'undefined' && window.location && window.location.search.indexOf('debug') !== -1) {
      window.CARWASH_DEBUG = {
        getState: function () {
          return {
            state: state,
            stage: car ? car.stage : null,
            score: score, wallet: wallet, best: best,
            bank: bank, unlockedTier: unlockedTier,
            hearts: hearts, combo: combo, carsWashed: carsWashed, carsLost: carsLost,
            patience: car ? car.patience : null,
            patienceMax: car ? car.patienceMax : null,
            washProgress: car ? car.washProgress : null,
            dirtRemaining: car ? dirtRemaining(car) : null,
            carType: car ? car.spec.type.id : null,
            carLen: car ? car.spec.type.len : null,
            carTop: car ? car.spec.type.top : null,
            carVip: car ? car.spec.vip : null,
            request: car ? car.request : null,
            waxed: car ? car.waxed : null,
            waxProgress: car ? car.waxProgress : null,
            dirtKinds: car ? car.dirt.map(function (d) { return d.kind; }) : null,
            missions: missions.map(function (m) {
              return { id: m.def.id, kind: m.def.kind, target: m.def.target,
                       reward: m.def.reward, progress: m.progress };
            }),
            mStats: mStats,
            // v3 state.
            tools: { washer: tools.washer, cannon: tools.cannon, brush: tools.brush,
                     oil: tools.oil, dryer: tools.dryer, polish: tools.polish },
            selectedTool: selectedTool,
            perfectStreak: perfectStreak,
            streakMult: streakMult(),
            vipStreak: vipStreak,
            activeEvent: activeEvent,
            outageT: outageT,
            pendingNextEvent: pendingNextEvent,
            scratched: car ? car.scratched : null,
            scratchPenalty: car ? car.scratchPenalty : null,
            soaped: car ? car.soaped : null,
            perfectOK: car ? car.perfectOK : null,
            heavyMud: car ? car.dirt.some(function (d) { return d.heavy && d.amount > 0; }) : null,
            foamCount: car ? car.foam.length : null,
            eventUrgent: car ? car.eventUrgent : null,
            eventTipper: car ? car.eventTipper : null,
            eventDoubletip: car ? car.eventDoubletip : null,
            // v4 state.
            foamCoverage: car ? foamCoverage(car) : null,
            heavyMudRemaining: car ? heavyMudRemaining(car) : null,
            foamTotal: car ? foamTotal(car) : null,
            dropsRemaining: car ? dropsRemaining(car) : null,
            puddle: car ? car.puddle : null,
            camScale: cam.scale,
            camPanX: cam.panX,
            camPanY: cam.panY
          };
        },
        drainPatience: function () { if (car) car.patience = 0.05; },
        setPatience: function (v) { if (car) car.patience = v; },
        setWallet: function (v) { wallet = v; },
        setBank: function (v) { bank = v; Bridge.saveProgress('bank', bank); },
        setUnlockedTier: function (n) { unlockedTier = clamp(n, 1, TIERS.length); Bridge.saveProgress('unlocked_tier', unlockedTier); },
        forceNext: function (typeId, vip) {
          var type = vehicleTypeById(typeId);
          var color = vip ? '#ffd700' : pick(CAR_COLORS);
          if (type.id === 'taxi') color = '#f7c948';
          if (type.id === 'tank' && !vip) color = pick(TANK_COLORS);
          if (type.id === 'jet' && !vip) color = pick(JET_COLORS);
          queue[0] = { type: type, color: color, vip: !!vip, seed: Math.random() * 1000 };
        },
        setNextRequest: function (kind) {
          pendingRequest = kind ? { type: kind, bonus: (REQUEST_DEFS[kind] || {}).bonus || 0 } : null;
        },
        // v3 test hooks: force events, grant tools, force the next car's dirt.
        triggerEvent: function (kind) { triggerEvent(kind); },
        setOutage: function (secs) { // test-only: control the outage clock
          outageT = secs;
          activeEvent = secs > 0 ? 'outage' : null;
        },
        setTool: function (id, owned) { tools[id] = !!owned; },
        setSelectedTool: function (id) { selectedTool = id; },
        setNextDirt: function (kind) { pendingDirt = kind; }
      };
    }
  } catch (e) {}

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

})();

</script>
</body>
</html>
