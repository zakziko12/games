   Plain JS canvas (480x800 portrait), Playgama Bridge v2.4.4, 5 languages.

   Gameplay: drag the magnet with one finger. Metal pieces inside the
   pull radius fly to the magnet and stick in a cluster ring. Collect
   the required number to open the finish gate, then drag the magnet
   (with its pieces) into the finish zone. Hazards: spike zones knock
   pieces off, blockers and wood decoys block the way, enemy attractor
   magnets steal attached pieces, repellers push the magnet away, gates

   Studio in this workspace: Bridge wrapper with localStorage fallback,

    c.arcTo(x + w, y + h, x, y + h, r);

      var a = -Math.PI / 2 + i * Math.PI / 5;
      var x = cx + Math.cos(a) * rad, y = cy + Math.sin(a) * rad;

    noteAt: function (freq, t0, dur, type, vol, attack) {
      if (!this.ctx || !this.musicGain) return;
      try {
        var o = this.ctx.createOscillator();
        var g = this.ctx.createGain();
        o.type = type || 'sine';
        o.frequency.value = freq;

        g.gain.setValueAtTime(vol || 0.05, t0 + Math.max(0.05, dur - 0.18));
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    scheduleMusic: function () {
      if (!this.ctx) return;
      var stepDur = this.music.mode === 'tense' ? 0.28 : (this.music.mode === 'level' ? 0.42 : 0.6);
      while (this.music.nextT < this.ctx.currentTime + 0.35) {
        var t0 = this.music.nextT;
        var step = this.music.step;
        var chordIdx = Math.floor(step / 4) % 4;
        if (this.music.mode === 'menu') {
          if (step % 4 === 0) {
            for (var i = 0; i < 4; i++) this.noteAt(this.MUSIC_CHORDS[chordIdx][i], t0, 2.4, 'triangle', 0.035, 0.4);
            this.noteAt(this.MUSIC_BASS[chordIdx], t0, 2.4, 'sine', 0.05, 0.3);
          }
          if (step % 2 === 0) this.noteAt(this.MUSIC_MELODY[step % 16], t0, 0.9, 'sine', 0.03, 0.05);
        } else if (this.music.mode === 'level') {
          if (step % 4 === 0) {
            for (var j = 0; j < 3; j++) this.noteAt(this.MUSIC_CHORDS[chordIdx][j], t0, 1.6, 'triangle', 0.04, 0.1);
            this.noteAt(this.MUSIC_BASS[chordIdx], t0, 0.5, 'sine', 0.07, 0.02);
          }
          this.noteAt(this.MUSIC_MELODY[step % 16], t0, 0.35, 'sine', 0.045, 0.02);
          if (step % 2 === 0) this.noteAt(this.MUSIC_BASS[chordIdx] * 2, t0, 0.2, 'sine', 0.03, 0.02);
        } else { // tense
          this.noteAt(this.MUSIC_TENSE[step % 8], t0, 0.24, 'triangle', 0.055, 0.01);
          if (step % 4 === 0) this.noteAt(110, t0, 1.0, 'sine', 0.07, 0.05);

  function slotOffset(slot) {
    // Golden-angle spiral ring around the magnet.
    var ring = Math.floor(slot / 7);
    var r = 36 + ring * 12;
    var a = slot * 2.39996;
    return { x: Math.cos(a) * r, y: Math.sin(a) * r };
  }

  function loadLevel(idx, daily) {
    isDaily = !!daily;
    levelIndex = daily ? -1 : idx;
    levelDef = daily ? dailyDef() : LEVELS[idx];
    var def = levelDef;
    pieces = []; spikes = []; blocks = []; woods = [];
    attractors = []; repellers = []; gates = []; keyPieces = [];
    particles = []; floaters = []; confetti = [];
    var pc = 0;
    var ci, i, j;
    for (ci = 0; ci < (def.clusters || []).length; ci++) {
      var cl = def.clusters[ci];
      for (j = 0; j < cl[2]; j++) {
        var r = 8 + 11 * Math.sqrt(j);
        var a = j * 2.39996;
        pieces.push({
          x: cl[0] + Math.cos(a) * r, y: cl[1] + Math.sin(a) * r,
          vx: 0, vy: 0, type: PIECE_TYPES[pc % PIECE_TYPES.length],
          state: 'free', slot: -1, scatterT: 0, stealBy: null, orbitA: 0
        });
        pc++;
      }
    }
    for (i = 0; i < (def.keys || []).length; i++) {
      keyPieces.push({ x: def.keys[i][0], y: def.keys[i][1], taken: false });
      pieces.push({
        x: def.keys[i][0], y: def.keys[i][1], vx: 0, vy: 0,
        type: 'key', state: 'free', slot: -1, scatterT: 0,
        stealBy: null, orbitA: 0, keyIdx: i
      });
      pc++;
    }
    totalInLevel = pieces.length;
    for (i = 0; i < (def.blocks || []).length; i++) {
      blocks.push({ x: def.blocks[i][0], y: def.blocks[i][1], w: def.blocks[i][2], h: def.blocks[i][3] });
    }
    for (i = 0; i < (def.wood || []).length; i++) {
      woods.push({ x: def.wood[i][0], y: def.wood[i][1], r: def.wood[i][2] });
    }
    for (i = 0; i < (def.spikes || []).length; i++) {
      var sp = def.spikes[i];
      if (Array.isArray(sp)) {
        spikes.push({ x0: sp[0], y0: sp[1], x: sp[0], y: sp[1], r: sp[2], moving: false });
      } else {
        spikes.push({ x0: sp.x, y0: sp.y, x: sp.x, y: sp.y, r: sp.r,
                      dx: sp.dx, dy: sp.dy, range: sp.range, speed: sp.speed, moving: true });
      }
    }
    for (i = 0; i < (def.attractors || []).length; i++) {
      attractors.push({ x: def.attractors[i][0], y: def.attractors[i][1] });
    }
    for (i = 0; i < (def.repellers || []).length; i++) {
      repellers.push({ x: def.repellers[i][0], y: def.repellers[i][1] });
    }
    for (i = 0; i < (def.gates || []).length; i++) {
      var g = def.gates[i];
      gates.push({ x: g.x, y: g.y, w: g.w, h: g.h, kind: g.kind,
                   openAt: g.openAt || def.req, keyIdx: g.keyIdx || 0,
                   period: g.period || 4, openFor: g.openFor || 2, phase: g.phase || 0,
                   open: false, wasOpen: false, anim: 0 });
    }
    magnet.x = def.start[0]; magnet.y = def.start[1];
    magnet.vx = 0; magnet.vy = 0; magnet.squash = 0;
    pointer.x = def.start[0]; pointer.y = def.start[1]; pointer.down = false;
    collected = 0; knockoffs = 0; immunity = 0;

  function attachPiece(p) {
    p.state = 'attached';
    p.slot = nextSlot++;
    p.stealBy = null;
    p.vx = 0; p.vy = 0;
    collected++;
    totalPieces++;
    if (p.type === 'key' && p.keyIdx !== undefined) keyPieces[p.keyIdx].taken = true;
    magnet.squash = 1;
    spawnBurst(p.x, p.y, '#ffd76a', 8);
    spawnRing(p.x, p.y, '#ffd76a');
    AudioSys.clink();
  }

  function detachPiece(p, reason) {
    // reason: 'spike' | 'steal' — both count as knock-offs for stars.
    p.state = 'free';
    p.slot = -1;
    p.stealBy = null;
    collected = Math.max(0, collected - 1);
    knockoffs++;
    if (reason === 'steal') {
      p.state = 'stolen';
      p.orbitA = Math.random() * Math.PI * 2;
    }
  }

      var sp = 60 + Math.random() * 160;
      particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                       life: 0, maxLife: 0.4 + Math.random() * 0.3,
                       size: 2 + Math.random() * 3, color: color, type: 'spark' });
    }
    if (particles.length > 220) particles.splice(0, particles.length - 220);
  }
  function spawnRing(x, y, color) {
    particles.push({ x: x, y: y, vx: 0, vy: 0, life: 0, maxLife: 0.35,
                     size: 6, color: color, type: 'ring' });
  }
  function spawnTrail(x, y, color) {
    particles.push({ x: x, y: y, vx: 0, vy: 0, life: 0, maxLife: 0.3,
                     size: 3 + Math.random() * 2, color: color, type: 'trail' });
  }
  function spawnFloater(x, y, text, color) {
    floaters.push({ x: x, y: y, text: text, color: color, t: 0 });
    if (floaters.length > 8) floaters.shift();
  }
  function spawnConfetti() {
    var colors = ['#ffd700', '#ff6b6b', '#4ecdc4', '#a855f7', '#38bdf8', '#f97316'];
    for (var i = 0; i < 90; i++) {
      confetti.push({ x: 40 + Math.random() * 400, y: -20 - Math.random() * 200,
                      vx: rand(-30, 30), vy: rand(120, 260), rot: Math.random() * Math.PI,
                      vr: rand(-6, 6), color: colors[i % colors.length],
                      size: 5 + Math.random() * 5, life: 0 });
    }
  }

  // ---- Collision helpers ----
  function circleRectResolve(px, py, r, rect) {
    // Returns corrected {x, y} pushing the circle out of the rect.
    var cx = clamp(px, rect.x, rect.x + rect.w);
    var cy = clamp(py, rect.y, rect.y + rect.h);
    var dx = px - cx, dy = py - cy;
    var d2 = dx * dx + dy * dy;
    if (d2 >= r * r) return { x: px, y: py };
    if (d2 > 0.0001) {
      var d = Math.sqrt(d2);
      var push = (r - d) / d;
      return { x: px + dx * push, y: py + dy * push };
    }
    // Center inside the rect: push out along the smallest penetration.
    var left = px - rect.x, right = rect.x + rect.w - px;
    var top = py - rect.y, bottom = rect.y + rect.h - py;
    var m = Math.min(left, right, top, bottom);
    if (m === left) return { x: rect.x - r, y: py };
    if (m === right) return { x: rect.x + rect.w + r, y: py };
    if (m === top) return { x: px, y: rect.y - r };
    return { x: px, y: rect.y + rect.h + r };
  }
  function collideWorld(x, y, r) {
    // Arena bounds + blockers + closed gates + wood decoys.
    x = clamp(x, ARENA.x + r, ARENA.x + ARENA.w - r);
    y = clamp(y, ARENA.y + r, ARENA.y + ARENA.h - r);
    var i, res;
    for (i = 0; i < blocks.length; i++) {
      res = circleRectResolve(x, y, r, blocks[i]);
      x = res.x; y = res.y;
    }
    for (i = 0; i < gates.length; i++) {
      if (gates[i].open) continue;
      // Fairness grace: a moving gate closing on the magnet must not
      // shove it back — if the magnet's centre is already inside the
      // doorway, let it slide through. (The centre can only get inside
      // while the gate was open; circle collision keeps it out when
      // approaching from outside.)
      var g = gates[i];
      if (g.kind === 'moving' && x > g.x && x < g.x + g.w && y > g.y && y < g.y + g.h) continue;
      res = circleRectResolve(x, y, r, gates[i]);
      x = res.x; y = res.y;
    }
    for (i = 0; i < woods.length; i++) {
      var w = woods[i];
      var d = dist(x, y, w.x, w.y);
      var min = r + w.r;
      if (d < min && d > 0.001) {
        x = w.x + (x - w.x) / d * min;
        y = w.y + (y - w.y) / d * min;
      }
    }
    return { x: x, y: y };
  }

  // ---- Per-frame physics ----
  function updatePlaying(dt) {
    if (phase !== 'play') {
      if (phase === 'complete') completeT += dt;
      updateFx(dt);
      return;
    }
    levelTime += dt;
    if (immunity > 0) immunity -= dt;
    if (magnet.squash > 0) magnet.squash = Math.max(0, magnet.squash - dt * 4);

    // Timed levels.
    if (levelDef.time) {
      var left = levelDef.time - levelTime;
      if (left <= 10) AudioSys.setMusicMode('tense');
      else AudioSys.setMusicMode('level');
      if (left <= 0) { failLevel(); return; }
    }

    // Moving spikes.
    for (var si = 0; si < spikes.length; si++) {
      var sp = spikes[si];
      if (sp.moving) {
        var off = Math.sin(levelTime * sp.speed) * sp.range;
        sp.x = sp.x0 + sp.dx * off;
        sp.y = sp.y0 + sp.dy * off;
      }
    }

    // Gates.
    for (var gi = 0; gi < gates.length; gi++) {
      var g = gates[gi];
      var wasOpen = g.open;
      if (g.kind === 'pieces') g.open = collected >= g.openAt;
      else if (g.kind === 'key') g.open = !!(keyPieces[g.keyIdx] && keyPieces[g.keyIdx].taken);
      else g.open = ((levelTime + g.phase) % g.period) < g.openFor;
      g.anim = clamp(g.anim + (g.open ? dt * 4 : -dt * 4), 0, 1);
      if (g.open && !wasOpen && g.kind !== 'moving') {
        AudioSys.gateOpen();
        spawnBurst(g.x + g.w / 2, g.y + g.h / 2, '#7CFC00', 14);
      }
    }

    // Finish gate.
    if (!gateOpen && collected >= levelDef.req) {
      gateOpen = true;
      gateOpenT = 0;
      AudioSys.gateOpen();
      showToast(t('gateOpen'));
      spawnBurst(levelDef.finish[0], levelDef.finish[1], '#7CFC00', 20);
      spawnRing(levelDef.finish[0], levelDef.finish[1], '#7CFC00');
    }
    if (gateOpen) gateOpenT += dt;

    // Magnet follow: spring toward the pointer, repellers push back.
    var md = magnetDef(selectedMagnet);
    var pullR = md.pullR;
    var tx = pointer.down ? pointer.x : magnet.x;
    var ty = pointer.down ? pointer.y : magnet.y;
    var dvx = (tx - magnet.x) * 16;
    var dvy = (ty - magnet.y) * 16;
    var dv = Math.sqrt(dvx * dvx + dvy * dvy);
    if (dv > 1000) { dvx = dvx / dv * 1000; dvy = dvy / dv * 1000; }
    for (var ri = 0; ri < repellers.length; ri++) {
      var rp = repellers[ri];
      var rd = dist(magnet.x, magnet.y, rp.x, rp.y);
      if (rd < REPELLER_R && rd > 0.01) {
        var fall = 1 - rd / REPELLER_R;
        dvx += (magnet.x - rp.x) / rd * 250 * fall;
        dvy += (magnet.y - rp.y) / rd * 250 * fall;
        if (time - whooshT > 1.2) { whooshT = time; AudioSys.whoosh(); }
      }
    }
    var k = 1 - Math.exp(-20 * dt);
    magnet.vx += (dvx - magnet.vx) * k;
    magnet.vy += (dvy - magnet.vy) * k;
    magnet.x += magnet.vx * dt;
    magnet.y += magnet.vy * dt;
    var mc = collideWorld(magnet.x, magnet.y, MAGNET_R);
    magnet.x = mc.x; magnet.y = mc.y;

    // Drag trail + hum.
    if (pointer.down) {
      trailT -= dt;
      if (trailT <= 0) {
        trailT = 0.05;
        spawnTrail(magnet.x + rand(-8, 8), magnet.y + rand(-8, 8), skinDef(selectedSkin).glow);
      }
      AudioSys.startHum();
    } else {
      AudioSys.stopHum();
    }

    // Spike knock-off.
    if (immunity <= 0) {
      for (var ski = 0; ski < spikes.length; ski++) {
        var sk = spikes[ski];
        if (dist(magnet.x, magnet.y, sk.x, sk.y) < sk.r + 11) {
          knockOffPieces(2, sk.x, sk.y);
          break;
        }
      }
    }

    // Pieces.
    updatePieces(dt, md, pullR);

    // Finish.
    if (gateOpen && dist(magnet.x, magnet.y, levelDef.finish[0], levelDef.finish[1]) < FINISH_R) {
      completeLevel();
      return;
    }

    updateFx(dt);
  }

  function knockOffPieces(n, sx, sy) {
    var knocked = 0;
    for (var i = pieces.length - 1; i >= 0 && knocked < n; i--) {
      var p = pieces[i];
      if (p.state !== 'attached') continue;
      p.state = 'free';
      p.slot = -1;
      p.scatterT = 1.2;
      var a = Math.atan2(p.y - sy, p.x - sx) + rand(-0.6, 0.6);
      var sp = rand(280, 420);
      p.vx = Math.cos(a) * sp;
      p.vy = Math.sin(a) * sp;
      collected = Math.max(0, collected - 1);
      knockoffs++;
      knocked++;
      spawnBurst(p.x, p.y, '#ff5555', 6);
    }
    if (knocked > 0) {
      immunity = 1.2;
      shake = 9;
      AudioSys.knockoff();
      spawnFloater(magnet.x, magnet.y - 40, '-' + knocked, '#ff5555');
    }
  }

  function updatePieces(dt, md, pullR) {
    var i, p;
    // Attractor steal: each attractor pulls the nearest attached piece.
    for (var ai = 0; ai < attractors.length; ai++) {
      var at = attractors[ai];
      var mdAt = dist(magnet.x, magnet.y, at.x, at.y);
      if (mdAt > ATTRACTOR_R) continue;
      var best = null, bestD = 1e9;
      for (i = 0; i < pieces.length; i++) {
        p = pieces[i];
        if (p.state !== 'attached') continue;
        var d = dist(p.x, p.y, at.x, at.y);
        if (d < bestD) { bestD = d; best = p; }
      }
      if (best) {
        best.state = 'stealing';
        best.stealBy = at;
      }
    }
    for (i = 0; i < pieces.length; i++) {
      p = pieces[i];
      if (p.state === 'free') {
        if (p.scatterT > 0) {
          p.scatterT -= dt;
        } else {
          var d = dist(p.x, p.y, magnet.x, magnet.y);
          if (d < pullR) {
            var a = 1700 * md.pull * (1 - 0.4 * d / pullR);
            p.vx += (magnet.x - p.x) / Math.max(1, d) * a * dt;
            p.vy += (magnet.y - p.y) / Math.max(1, d) * a * dt;
            var sp = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
            if (sp > 620) { p.vx = p.vx / sp * 620; p.vy = p.vy / sp * 620; }
          }
        }
        var drag = Math.exp(-1.2 * dt);
        p.vx *= drag; p.vy *= drag;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        var pc = collideWorld(p.x, p.y, PIECE_R);
        p.x = pc.x; p.y = pc.y;
        if (p.scatterT <= 0 && dist(p.x, p.y, magnet.x, magnet.y) < 36) {
          attachPiece(p);
        }
      } else if (p.state === 'attached') {
        var off = slotOffset(p.slot);
        var wob = Math.sin(time * 3 + p.slot * 1.7) * 2;
        var tx = magnet.x + off.x + wob;
        var ty = magnet.y + off.y + wob * 0.5;
        p.vx += ((tx - p.x) * 60 - p.vx * 12) * dt;
        p.vy += ((ty - p.y) * 60 - p.vy * 12) * dt;
        var sp2 = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
        if (sp2 > 900) { p.vx = p.vx / sp2 * 900; p.vy = p.vy / sp2 * 900; }
        p.x += p.vx * dt;
        p.y += p.vy * dt;
      } else if (p.state === 'stealing') {
        var at2 = p.stealBy;
        if (!at2 || dist(magnet.x, magnet.y, at2.x, at2.y) > ATTRACTOR_R + 20) {
          // Escaped the attractor's reach — the piece springs back.
          p.state = 'attached';
          p.stealBy = null;
        } else {
          var d2 = dist(p.x, p.y, at2.x, at2.y);
          if (d2 < 30) {
            detachPiece(p, 'steal');
            AudioSys.steal();
            spawnBurst(p.x, p.y, '#38bdf8', 8);
            spawnFloater(p.x, p.y - 20, '!', '#38bdf8');
          } else {
            p.x += (at2.x - p.x) / d2 * 280 * dt;
            p.y += (at2.y - p.y) / d2 * 280 * dt;
          }
        }
      } else if (p.state === 'stolen') {
        // Orbit the attractor that stole it; the player can re-steal it
        // by bringing the magnet close (it becomes free and flies back).
        var at3 = p.stealBy;
        if (!at3) { p.state = 'free'; continue; }
        p.orbitA += dt * 1.2;
        p.x = at3.x + Math.cos(p.orbitA) * 36;
        p.y = at3.y + Math.sin(p.orbitA) * 36;
        if (dist(p.x, p.y, magnet.x, magnet.y) < pullR) {
          p.state = 'free';
          p.stealBy = null;
          p.vx = (magnet.x - p.x) * 2;
          p.vy = (magnet.y - p.y) * 2;
        }
      }
    }
  }

  function updateFx(dt) {
    for (var i = particles.length - 1; i >= 0; i--) {
      var pt = particles[i];
      pt.life += dt;
      if (pt.life >= pt.maxLife) { particles.splice(i, 1); continue; }
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.vy += (pt.type === 'spark' ? 300 : 0) * dt;
    }
    for (var j = floaters.length - 1; j >= 0; j--) {
      floaters[j].t += dt;
      floaters[j].y -= 30 * dt;
      if (floaters[j].t > 1.1) floaters.splice(j, 1);
    }
    for (var k = confetti.length - 1; k >= 0; k--) {
      var cf = confetti[k];
      cf.life += dt;
      cf.x += cf.vx * dt;
      cf.y += cf.vy * dt;
      cf.rot += cf.vr * dt;
      if (cf.y > H + 20 || cf.life > 4) confetti.splice(k, 1);
    }
    if (shake > 0) shake *= Math.exp(-6 * dt);
    if (shake < 0.2) shake = 0;
  }

  // ============================== Tutorial (FTUE) ==============================
  // Level 1 is guided on a fresh save: the phase is derived from live game
  // state (never a blocking script), the correct action advances it
  // immediately, and SKIP is always visible.
  function tutorialPhase() {
    if (!tutorialActive || panel) return null;
    if (!hasDragged && collected === 0) return 'drag';
    if (collected < levelDef.req) return 'collect';
    if (gateOpen) return 'finish';
    return 'collect';
  }
  function tutorialSkip() {
    if (!tutorialActive) return;
    tutorialDone = true;
    tutorialActive = false;
    Bridge.saveProgress('tutorial', '1');
    AudioSys.click();
  }
  function tutorialComplete() {
    if (!tutorialActive) return;
    tutorialDone = true;
    tutorialActive = false;
    tutorialJustDone = true;
    Bridge.saveProgress('tutorial', '1');
  }

  // ============================== Daily challenge ==============================
  function dailyKey(date) {
    var d = date || new Date();
    var m = d.getMonth() + 1, day = d.getDate();
    return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
  }
  function dailySeed() {
    var d = new Date();
    return d.getFullYear() * 372 + (d.getMonth() + 1) * 31 + d.getDate();
  }
  function dailyDef() {
    return DAILY_TEMPLATES[dailySeed() % DAILY_TEMPLATES.length];
  }
  function dailyAvailable() {
    return lastDaily !== dailyKey();
  }
  function dailyCountdown() {
    var now = new Date();
    var midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0);
    var s = Math.max(0, Math.floor((midnight - now) / 1000));
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
    return h + 'h ' + (m < 10 ? '0' : '') + m + 'm';
  }

  // ============================== Level end ==============================
  function completeLevel() {
    phase = 'complete';
    completeT = 0;
    panel = 'complete';
    AudioSys.stopHum();
    if (isDaily) {
      lastStars = 0;
      lastTimeBonus = 0;
      lastIsNewBest = false;
      if (dailyAvailable()) {
        lastDailyReward = 200;
        lastCoins = 200;
        coins += 200;
        lastDaily = dailyKey();
        Bridge.saveProgress('lastDaily', lastDaily);
        Bridge.saveProgress('coins', coins);
      } else {
        lastDailyReward = 0;
        lastCoins = 0;
      }
      levelsCompleted++;
      Bridge.saveProgress('levelsCompleted', levelsCompleted);
      Bridge.saveProgress('totalPieces', totalPieces);
      AudioSys.win();
      AudioSys.coin();
      if (levelsCompleted % 3 === 0) Bridge.showInterstitial();
      Bridge.send('level_completed');
      checkMissions();
      return;
    }
    var s = 1;
    if (knockoffs === 0) s = 2;
    if (knockoffs === 0 && levelTime <= levelDef.par) s = 3;
    lastStars = s;
    var prev = stars[levelIndex] || 0;
    lastIsNewBest = s > prev;
    stars[levelIndex] = Math.max(prev, s);
    var timeBonus = levelTime <= levelDef.par ? 50 : Math.max(0, 50 - Math.floor((levelTime - levelDef.par) * 2));
    lastTimeBonus = timeBonus;
    var total = 100 + 25 * s + timeBonus;
    var md = magnetDef(selectedMagnet);
    if (md.coinBonus) total = Math.round(total * (1 + md.coinBonus));
    lastCoins = total;
    coins += total;
    unlocked = Math.max(unlocked, Math.min(TOTAL_LEVELS, levelIndex + 2));
    levelsCompleted++;
    Bridge.saveProgress('stars', stars);
    Bridge.saveProgress('coins', coins);
    Bridge.saveProgress('unlocked', unlocked);
    Bridge.saveProgress('levelsCompleted', levelsCompleted);
    Bridge.saveProgress('totalPieces', totalPieces);
    if (tutorialActive) tutorialComplete();
    AudioSys.win();
    AudioSys.coin();
    if (s === 3) spawnConfetti();
    if (levelsCompleted % 3 === 0) Bridge.showInterstitial();
    Bridge.send('level_completed');
    checkMissions();
  }

  function failLevel() {
    phase = 'failed';
    panel = 'failed';
    AudioSys.stopHum();
    AudioSys.fail();
    Bridge.saveProgress('totalPieces', totalPieces);
    Bridge.send('level_failed');
  }

  // ============================== Shop actions ==============================
  function saveShop() {
    Bridge.saveProgress('shop', {
      magnets: { owned: ownedMagnets, selected: selectedMagnet },
      skins: { owned: ownedSkins, selected: selectedSkin },
      envs: { owned: ownedEnvs, selected: selectedEnv }
    });
  }
  function buyOrSelect(list, owned, selectedKey, id, price) {
    if (owned.indexOf(id) !== -1) {
      if (selectedKey === 'magnet') selectedMagnet = id;
      else if (selectedKey === 'skin') selectedSkin = id;
      else selectedEnv = id;
      saveShop();
      AudioSys.click();
      if (selectedKey === 'env') rebuildBackground();
      return true;
    }
    if (coins < price) {
      AudioSys.denied();
      showToast(t('notEnough'));
      return false;
    }
    coins -= price;
    owned.push(id);
    if (selectedKey === 'magnet') selectedMagnet = id;
    else if (selectedKey === 'skin') selectedSkin = id;
    else selectedEnv = id;
    Bridge.saveProgress('coins', coins);
    saveShop();
    AudioSys.unlockSound();
    AudioSys.coin();
    showToast(t('owned') + '!');
    if (selectedKey === 'env') rebuildBackground();
    return true;
  }

    var i = LANG_ORDER.indexOf(lang);
    setLanguage(LANG_ORDER[(i + 1) % LANG_ORDER.length]);
    Bridge.saveProgress('lang', lang);
    AudioSys.click();
  }

  function levelCellRect(i) {
    var col = i % 5, row = Math.floor(i / 5);
    return { x: 24 + col * 92, y: 110 + row * 92 - levelsScroll, w: 84, h: 84 };
  }
  function shopRowRect(i) {
    return { x: 16, y: 130 + i * 140 - shopScroll, w: 448, h: 128 };
  }
  function shopActionRect(i) {
    var r = shopRowRect(i);
    return { x: r.x + 314, y: r.y + 40, w: 110, h: 48 };
  }
  function shopItems() {
    if (shopTab === 'magnets') return MAGNETS;
    if (shopTab === 'skins') return SKINS;
    return ENVS;
  }

  function onPointerDown(e) {
    AudioSys.unlock();
    var p = toLogical(e);
    if (state === 'menu') {
      if (panel === 'howto') {
        if (hit(p.x, p.y, BTN.howtoClose)) { press('howtoClose'); panel = null; }
        return;
      }
      if (hit(p.x, p.y, BTN.menuMute)) { toggleMute(); return; }
      if (hit(p.x, p.y, BTN.menuHowto)) {
        // "?" replays the interactive tutorial (level 1, guided).
        press('menuHowto');
        tutorialReplay = true;
        loadLevel(0, false);
        return;
      }
      if (hit(p.x, p.y, BTN.menuLang)) { cycleLang(); return; }
      if (hit(p.x, p.y, BTN.menuInfo)) { press('menuInfo'); panel = 'howto'; return; }
      if (hit(p.x, p.y, BTN.menuPlay)) { press('menuPlay'); startLevel(Math.min(unlocked, TOTAL_LEVELS)); return; }
      if (hit(p.x, p.y, BTN.menuLevels)) { press('menuLevels'); goLevels(); return; }
      if (hit(p.x, p.y, BTN.menuShop)) { press('menuShop'); goShop(); return; }
      if (hit(p.x, p.y, BTN.menuDaily)) { press('menuDaily'); startDaily(); return; }
      return;
    }
    if (state === 'levels') {
      if (hit(p.x, p.y, BTN.back)) { press('back'); goMenu(); return; }
      scrollDrag = { screen: 'levels', startY: p.y, startScroll: levelsScroll, moved: 0 };
      return;
    }
    if (state === 'shop') {
      if (hit(p.x, p.y, BTN.back)) { press('back'); goMenu(); return; }
      if (hit(p.x, p.y, BTN.tabMagnets)) { press('tabMagnets'); shopTab = 'magnets'; shopScroll = 0; return; }
      if (hit(p.x, p.y, BTN.tabSkins)) { press('tabSkins'); shopTab = 'skins'; shopScroll = 0; return; }
      if (hit(p.x, p.y, BTN.tabEnvs)) { press('tabEnvs'); shopTab = 'envs'; shopScroll = 0; return; }
      scrollDrag = { screen: 'shop', startY: p.y, startScroll: shopScroll, moved: 0 };
      return;
    }
    if (state === 'playing') {
      if (panel === 'complete') {
        if (hit(p.x, p.y, BTN.next)) { nextLevel(); return; }
        if (hit(p.x, p.y, BTN.replay)) { press('replay'); loadLevel(isDaily ? -1 : levelIndex, isDaily); return; }
        if (hit(p.x, p.y, BTN.toMenu)) { press('toMenu'); goMenu(); return; }
        return;
      }
      if (panel === 'failed') {
        if (hit(p.x, p.y, BTN.retry)) { press('retry'); loadLevel(isDaily ? -1 : levelIndex, isDaily); return; }
        if (hit(p.x, p.y, BTN.failMenu)) { press('failMenu'); goMenu(); return; }
        return;
      }
      if (panel === 'paused') {
        if (hit(p.x, p.y, BTN.resume)) { resumeGame(); return; }
        if (hit(p.x, p.y, BTN.pauseRestart)) { press('pauseRestart'); AudioSys.setPaused(false); loadLevel(isDaily ? -1 : levelIndex, isDaily); return; }
        if (hit(p.x, p.y, BTN.pauseMenu)) { press('pauseMenu'); AudioSys.setPaused(false); goMenu(); return; }
        return;
      }
      if (hit(p.x, p.y, BTN.pause)) { press('pause'); pauseGame(); return; }
      if (hit(p.x, p.y, BTN.hudMute)) { toggleMute(); return; }
      if (hit(p.x, p.y, BTN.hudRestart)) { press('hudRestart'); loadLevel(isDaily ? -1 : levelIndex, isDaily); return; }
      if (tutorialActive && hit(p.x, p.y, BTN.tutSkip)) { tutorialSkip(); return; }
      // Start dragging the magnet (anywhere in the arena, or anywhere at all).
      pointer.down = true;
      pointer.x = p.x; pointer.y = p.y;
      hasDragged = true;
      return;
    }
  }

  function onPointerMove(e) {
    var p = toLogical(e);
    if (scrollDrag) {
      var dy = scrollDrag.startY - p.y;
      scrollDrag.moved = Math.max(scrollDrag.moved, Math.abs(dy));
      if (scrollDrag.screen === 'levels') {
        var maxL = Math.max(0, 110 + 9 * 92 - 800 + 16);
        levelsScroll = clamp(scrollDrag.startScroll + dy, 0, maxL);
      } else {
        var n = shopItems().length;
        var maxS = Math.max(0, 130 + n * 140 - 800 + 16);
        shopScroll = clamp(scrollDrag.startScroll + dy, 0, maxS);
      }
      return;
    }
    if (state === 'playing' && pointer.down && !panel) {
      pointer.x = p.x; pointer.y = p.y;
    }
  }

  function onPointerUp(e) {
    AudioSys.stopHum();
    pointer.down = false;
    if (scrollDrag) {
      var sd = scrollDrag;
      scrollDrag = null;
      if (sd.moved >= 12) return; // it was a scroll, not a tap
      var p = toLogical(e);
      if (sd.screen === 'levels') {
        for (var i = 0; i < TOTAL_LEVELS; i++) {
          if (hit(p.x, p.y, levelCellRect(i))) {
            if (i + 1 <= unlocked) { press('lvl' + i); startLevel(i + 1); }
            else { AudioSys.denied(); showToast(t('locked')); }
            return;
          }
        }
      } else if (sd.screen === 'shop') {
        var items = shopItems();
        for (var j = 0; j < items.length; j++) {
          if (hit(p.x, p.y, shopActionRect(j))) {
            var it = items[j];
            if (shopTab === 'magnets') buyOrSelect(MAGNETS, ownedMagnets, 'magnet', it.id, it.price);
            else if (shopTab === 'skins') buyOrSelect(SKINS, ownedSkins, 'skin', it.id, it.price);
            else buyOrSelect(ENVS, ownedEnvs, 'env', it.id, it.price);
            return;
          }
        }
      }
    }
  }

  function onKeyDown(e) {
    if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
      if (state === 'playing' && !panel) pauseGame();
      else if (panel === 'paused') resumeGame();
    }
  }

  // ============================== Rendering ==============================
  var bgCanvas = null;
  var bgEnv = '';

  function rebuildBackground() {
    bgEnv = selectedEnv;
    bgCanvas = document.createElement('canvas');
    bgCanvas.width = W; bgCanvas.height = H;
    var b = bgCanvas.getContext('2d');
    var g, i;
    if (selectedEnv === 'workshop') {
      g = b.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#7a5a3c'); g.addColorStop(1, '#5d4329');
      b.fillStyle = g; b.fillRect(0, 0, W, H);
      // Wood planks.
      b.strokeStyle = 'rgba(0,0,0,0.18)'; b.lineWidth = 2;
      for (i = 0; i < 10; i++) {
        b.beginPath(); b.moveTo(0, i * 80 + 40); b.lineTo(W, i * 80 + 40); b.stroke();
      }
      // Arena floor: light workbench.
      g = b.createLinearGradient(0, ARENA.y, 0, ARENA.y + ARENA.h);
      g.addColorStop(0, '#e8d9b8'); g.addColorStop(1, '#d3bd93');
      b.fillStyle = g;
      rr(b, ARENA.x, ARENA.y, ARENA.w, ARENA.h, 18); b.fill();
      b.strokeStyle = 'rgba(0,0,0,0.15)';
      for (i = 1; i < 8; i++) {
        b.beginPath(); b.moveTo(ARENA.x, ARENA.y + i * 80); b.lineTo(ARENA.x + ARENA.w, ARENA.y + i * 80); b.stroke();
      }
    } else if (selectedEnv === 'scrapyard') {
      g = b.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#33382f'); g.addColorStop(1, '#22261f');
      b.fillStyle = g; b.fillRect(0, 0, W, H);
      g = b.createLinearGradient(0, ARENA.y, 0, ARENA.y + ARENA.h);
      g.addColorStop(0, '#5a6055'); g.addColorStop(1, '#454a41');
      b.fillStyle = g;
      rr(b, ARENA.x, ARENA.y, ARENA.w, ARENA.h, 18); b.fill();
      // Rust blobs (deterministic).
      for (i = 0; i < 26; i++) {
        var rx = ARENA.x + hash(i * 3 + 1) * ARENA.w;
        var ry = ARENA.y + hash(i * 7 + 2) * ARENA.h;
        var rr2 = 8 + hash(i * 5 + 3) * 22;
        var rg = b.createRadialGradient(rx, ry, 1, rx, ry, rr2);
        rg.addColorStop(0, 'rgba(150,80,30,0.35)'); rg.addColorStop(1, 'rgba(150,80,30,0)');
        b.fillStyle = rg;
        b.beginPath(); b.arc(rx, ry, rr2, 0, Math.PI * 2); b.fill();
      }
      // Hazard stripes along the arena top edge.
      b.save();
      b.beginPath(); rr(b, ARENA.x, ARENA.y, ARENA.w, ARENA.h, 18); b.clip();
      for (i = 0; i < 12; i++) {
        b.fillStyle = i % 2 === 0 ? 'rgba(250,200,0,0.25)' : 'rgba(0,0,0,0.2)';
        b.beginPath();
        b.moveTo(ARENA.x + i * 40, ARENA.y);
        b.lineTo(ARENA.x + i * 40 + 20, ARENA.y);
        b.lineTo(ARENA.x + i * 40 + 8, ARENA.y + 12);
        b.lineTo(ARENA.x + i * 40 - 12, ARENA.y + 12);
        b.closePath(); b.fill();
      }
      b.restore();
    } else if (selectedEnv === 'neon') {
      g = b.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#141233'); g.addColorStop(1, '#0a0920');
      b.fillStyle = g; b.fillRect(0, 0, W, H);
      g = b.createLinearGradient(0, ARENA.y, 0, ARENA.y + ARENA.h);
      g.addColorStop(0, '#1d1a4d'); g.addColorStop(1, '#14123a');
      b.fillStyle = g;
      rr(b, ARENA.x, ARENA.y, ARENA.w, ARENA.h, 18); b.fill();
      // Neon grid.
      b.strokeStyle = 'rgba(56,189,248,0.14)'; b.lineWidth = 1;
      for (i = 1; i < 11; i++) {
        b.beginPath(); b.moveTo(ARENA.x + i * 40, ARENA.y); b.lineTo(ARENA.x + i * 40, ARENA.y + ARENA.h); b.stroke();
        b.beginPath(); b.moveTo(ARENA.x, ARENA.y + i * 56); b.lineTo(ARENA.x + ARENA.w, ARENA.y + i * 56); b.stroke();
      }
      for (i = 0; i < 14; i++) {
        var nx = ARENA.x + hash(i * 11 + 5) * ARENA.w;
        var ny = ARENA.y + hash(i * 13 + 7) * ARENA.h;
        b.fillStyle = i % 2 ? 'rgba(168,85,247,0.5)' : 'rgba(56,189,248,0.5)';
        b.beginPath(); b.arc(nx, ny, 2.5, 0, Math.PI * 2); b.fill();
      }
    } else { // space
      g = b.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#0a0a1e'); g.addColorStop(1, '#030308');
      b.fillStyle = g; b.fillRect(0, 0, W, H);
      for (i = 0; i < 90; i++) {
        var sx = hash(i * 17 + 1) * W, sy = hash(i * 19 + 2) * H;
        b.fillStyle = 'rgba(255,255,255,' + (0.2 + hash(i * 23 + 3) * 0.6) + ')';
        b.beginPath(); b.arc(sx, sy, 0.6 + hash(i * 29 + 4) * 1.4, 0, Math.PI * 2); b.fill();
      }
      g = b.createLinearGradient(0, ARENA.y, 0, ARENA.y + ARENA.h);
      g.addColorStop(0, '#191936'); g.addColorStop(1, '#101024');
      b.fillStyle = g;
      rr(b, ARENA.x, ARENA.y, ARENA.w, ARENA.h, 18); b.fill();
      b.strokeStyle = 'rgba(255,255,255,0.06)'; b.lineWidth = 1;
      for (i = 1; i < 6; i++) {
        b.beginPath(); b.moveTo(ARENA.x, ARENA.y + i * 100); b.lineTo(ARENA.x + ARENA.w, ARENA.y + i * 100); b.stroke();
      }
    }
    // Arena rim.
    b.strokeStyle = 'rgba(0,0,0,0.35)'; b.lineWidth = 3;
    rr(b, ARENA.x, ARENA.y, ARENA.w, ARENA.h, 18); b.stroke();
  }

  function drawShadowCard(c, x, y, w, h, r, fill) {
    c.fillStyle = 'rgba(0,0,0,0.28)';
    rr(c, x + 3, y + 5, w, h, r); c.fill();
    var g = c.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, fill[0]); g.addColorStop(1, fill[1]);
    c.fillStyle = g;
    rr(c, x, y, w, h, r); c.fill();
  }

  function drawButton(c, rect, label, kind, id, fontSize) {
    var s = id ? pressScale(id) : 1;
    var cx = rect.x + rect.w / 2, cy = rect.y + rect.h / 2;
    c.save();
    c.translate(cx, cy);
    c.scale(s, s);
    c.translate(-cx, -cy);
    var colors = {
      green: ['#4ade80', '#16a34a'], blue: ['#60a5fa', '#2563eb'],
      steel: ['#94a3b8', '#475569'], gold: ['#fbbf24', '#d97706'],
      red: ['#f87171', '#dc2626'], dark: ['#475569', '#1e293b']
    }[kind] || ['#94a3b8', '#475569'];
    drawShadowCard(c, rect.x, rect.y, rect.w, rect.h, 14, colors);
    c.fillStyle = '#ffffff';
    c.font = 'bold ' + (fontSize || 20) + 'px Arial';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(label, cx, cy + 1);
    c.restore();
  }

  function drawCoinIcon(c, x, y, r) {
    var g = c.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
    g.addColorStop(0, '#fef08a'); g.addColorStop(0.6, '#facc15'); g.addColorStop(1, '#ca8a04');
    c.fillStyle = g;
    c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
    c.strokeStyle = '#a16207'; c.lineWidth = 1.5;
    c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.stroke();
    c.fillStyle = '#a16207';
    c.font = 'bold ' + Math.round(r * 1.1) + 'px Arial';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('$', x, y + 1);
  }

  function drawCoinsBadge(c, x, y, w, h) {
    drawShadowCard(c, x, y, w, h, 12, ['#3b3b4d', '#23232f']);
    drawCoinIcon(c, x + 22, y + h / 2, 11);
    c.fillStyle = '#fde68a';
    c.font = 'bold 19px Arial';
    c.textAlign = 'left'; c.textBaseline = 'middle';
    c.fillText(String(coins), x + 40, y + h / 2 + 1);
  }

  function drawIconButton(c, rect, glyph, id, active) {
    var s = id ? pressScale(id) : 1;
    var cx = rect.x + rect.w / 2, cy = rect.y + rect.h / 2;
    c.save();
    c.translate(cx, cy); c.scale(s, s); c.translate(-cx, -cy);
    drawShadowCard(c, rect.x, rect.y, rect.w, rect.h, 10, active ? ['#f87171', '#dc2626'] : ['#4b5563', '#1f2937']);
    c.fillStyle = '#ffffff';
    c.font = 'bold 20px Arial';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(glyph, cx, cy + 1);
    c.restore();
  }

  // ---- Metal pieces: radial gradient + specular highlight ----
  function metalGradient(c, x, y, r, light, mid, dark) {
    var g = c.createRadialGradient(x - r * 0.4, y - r * 0.45, r * 0.1, x, y, r * 1.15);
    g.addColorStop(0, light); g.addColorStop(0.55, mid); g.addColorStop(1, dark);
    return g;
  }
  function drawMetalPiece(c, x, y, type, r, rot) {
    c.save();
    c.translate(x, y);
    c.rotate(rot || 0);
    var steel = function () { return metalGradient(c, 0, 0, r, '#f8fafc', '#a8b6c4', '#5b6b7c'); };
    var gold = function () { return metalGradient(c, 0, 0, r, '#fef08a', '#facc15', '#b45309'); };
    if (type === 'screw' || type === 'bolt') {
      c.fillStyle = steel();
      c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fill();
      c.strokeStyle = '#334155'; c.lineWidth = 1.5;
      c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.stroke();
      c.strokeStyle = '#334155'; c.lineWidth = 2.5;
      c.beginPath(); c.moveTo(-r * 0.55, 0); c.lineTo(r * 0.55, 0); c.stroke();
      if (type === 'bolt') {
        c.beginPath(); c.arc(0, 0, r * 0.35, 0, Math.PI * 2);
        c.fillStyle = '#64748b'; c.fill();
      }
    } else if (type === 'nail') {
      c.fillStyle = steel();
      rr(c, -r * 0.35, -r * 1.1, r * 0.7, r * 2.2, r * 0.35); c.fill();
      c.beginPath(); c.arc(0, -r * 1.1, r * 0.55, 0, Math.PI * 2);
      c.fillStyle = '#cbd5e1'; c.fill();
      c.strokeStyle = '#334155'; c.lineWidth = 1;
      c.beginPath(); c.arc(0, -r * 1.1, r * 0.55, 0, Math.PI * 2); c.stroke();
    } else if (type === 'nut') {
      c.fillStyle = steel();
      c.beginPath();
      for (var i = 0; i < 6; i++) {
        var a = i * Math.PI / 3;
        var px = Math.cos(a) * r, py = Math.sin(a) * r;
        if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
      }
      c.closePath(); c.fill();
      c.strokeStyle = '#334155'; c.lineWidth = 1.5; c.stroke();
      c.fillStyle = '#334155';
      c.beginPath(); c.arc(0, 0, r * 0.45, 0, Math.PI * 2); c.fill();
    } else if (type === 'gear' || type === 'key') {
      c.fillStyle = type === 'key' ? gold() : steel();
      c.beginPath();
      var teeth = 8;
      for (var j = 0; j < teeth * 2; j++) {
        var aa = j * Math.PI / teeth;
        var rr2 = j % 2 === 0 ? r * 1.15 : r * 0.8;
        var qx = Math.cos(aa) * rr2, qy = Math.sin(aa) * rr2;
        if (j === 0) c.moveTo(qx, qy); else c.lineTo(qx, qy);
      }
      c.closePath(); c.fill();
      c.strokeStyle = type === 'key' ? '#92400e' : '#334155'; c.lineWidth = 1.5; c.stroke();
      c.fillStyle = type === 'key' ? '#fef3c7' : '#e2e8f0';
      c.beginPath(); c.arc(0, 0, r * 0.4, 0, Math.PI * 2); c.fill();
    } else { // coin
      c.fillStyle = gold();
      c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fill();
      c.strokeStyle = '#92400e'; c.lineWidth = 1.5;
      c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.stroke();
      drawStarShape(c, 0, 0, r * 0.5, '#92400e');
    }
    // Specular highlight.
    c.fillStyle = 'rgba(255,255,255,0.75)';
    c.beginPath(); c.arc(-r * 0.35, -r * 0.4, r * 0.22, 0, Math.PI * 2); c.fill();
    c.restore();
  }

  // ---- Horseshoe magnet (top-down): two-tone arc + pole tips ----
  function drawMagnetShape(c, x, y, r, skin, squash, glowAlpha) {
    var sq = 1 - 0.12 * (squash || 0);
    c.save();
    c.translate(x, y);
    c.scale(2 - sq, sq);
    // Glow.
    if (glowAlpha > 0) {
      var gg = c.createRadialGradient(0, 0, r * 0.3, 0, 0, r * 2.1);
      gg.addColorStop(0, skin.ring);
      gg.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = gg;
      c.globalAlpha = glowAlpha;
      c.beginPath(); c.arc(0, 0, r * 2.1, 0, Math.PI * 2); c.fill();
      c.globalAlpha = 1;
    }
    // Horseshoe: arc from 200deg to 340deg (opening at bottom), two halves.
    var lw = r * 0.62;
    c.lineCap = 'round';
    c.strokeStyle = skin.a;
    c.lineWidth = lw;
    c.beginPath(); c.arc(0, 0, r * 0.62, Math.PI * 1.1, Math.PI * 1.6); c.stroke();
    c.strokeStyle = skin.b;
    c.beginPath(); c.arc(0, 0, r * 0.62, Math.PI * 1.6, Math.PI * 1.9); c.stroke();
    // Pole tips.
    c.fillStyle = skin.a;
    c.beginPath(); c.arc(Math.cos(Math.PI * 1.1) * r * 0.62, Math.sin(Math.PI * 1.1) * r * 0.62, lw * 0.5, 0, Math.PI * 2); c.fill();
    c.fillStyle = skin.b;
    c.beginPath(); c.arc(Math.cos(Math.PI * 1.9) * r * 0.62, Math.sin(Math.PI * 1.9) * r * 0.62, lw * 0.5, 0, Math.PI * 2); c.fill();
    // Outline + N/S.
    c.strokeStyle = 'rgba(0,0,0,0.35)'; c.lineWidth = 1.5;
    c.beginPath(); c.arc(0, 0, r * 0.62 + lw / 2, Math.PI * 1.1, Math.PI * 1.9); c.stroke();
    c.fillStyle = '#1e293b';
    c.font = 'bold ' + Math.round(r * 0.42) + 'px Arial';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('N', Math.cos(Math.PI * 1.28) * r * 0.62, Math.sin(Math.PI * 1.28) * r * 0.62);
    c.fillStyle = '#475569';
    c.fillText('S', Math.cos(Math.PI * 1.72) * r * 0.62, Math.sin(Math.PI * 1.72) * r * 0.62);
    c.restore();
  }

  function drawEnemyMagnet(c, x, y, kind, pulse) {
    // kind: 'attractor' (blue, pulls in) | 'repeller' (red, pushes out)
    var r = 18;
    var skin = kind === 'attractor'
      ? { a: '#2563eb', b: '#dbeafe', ring: 'rgba(37,99,235,0.3)', glow: '#60a5fa' }
      : { a: '#dc2626', b: '#fee2e2', ring: 'rgba(220,38,38,0.3)', glow: '#f87171' };
    // Range ring (pulsing).
    c.strokeStyle = skin.ring;
    c.lineWidth = 2;
    c.setLineDash([6, 8]);
    c.beginPath(); c.arc(x, y, (kind === 'attractor' ? ATTRACTOR_R : REPELLER_R) * (0.97 + 0.03 * pulse), 0, Math.PI * 2); c.stroke();
    c.setLineDash([]);
    drawMagnetShape(c, x, y, r, skin, 0, 0.8);
    // Direction arrows.
    c.fillStyle = skin.a;
    c.font = 'bold 13px Arial';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(kind === 'attractor' ? '↓↑' : '↔', x, y + r + 14);
  }

  function drawSpikeZone(c, x, y, r, pulse) {
    c.save();
    c.translate(x, y);
    // Danger halo.
    var g = c.createRadialGradient(0, 0, r * 0.4, 0, 0, r * 1.35);
    g.addColorStop(0, 'rgba(220,38,38,0.30)');
    g.addColorStop(1, 'rgba(220,38,38,0)');
    c.fillStyle = g;
    c.beginPath(); c.arc(0, 0, r * 1.35, 0, Math.PI * 2); c.fill();
    // Spikes.
    c.fillStyle = '#b91c1c';
    var n = 10;
    for (var i = 0; i < n; i++) {
      var a = i * Math.PI * 2 / n + pulse * 0.2;
      var bx = Math.cos(a) * r * 0.75, by = Math.sin(a) * r * 0.75;
      var tx = Math.cos(a) * r * 1.25, ty = Math.sin(a) * r * 1.25;
      var px = Math.cos(a + 0.28) * r * 0.75, py = Math.sin(a + 0.28) * r * 0.75;
      c.beginPath(); c.moveTo(bx, by); c.lineTo(tx, ty); c.lineTo(px, py); c.closePath(); c.fill();
    }
    c.fillStyle = '#7f1d1d';
    c.beginPath(); c.arc(0, 0, r * 0.72, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#fca5a5';
    c.beginPath(); c.arc(-r * 0.2, -r * 0.25, r * 0.14, 0, Math.PI * 2); c.fill();
    c.restore();
  }

  function drawBlock(c, b) {
    var g = c.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
    g.addColorStop(0, '#8b98a9'); g.addColorStop(0.5, '#64748b'); g.addColorStop(1, '#475569');
    c.fillStyle = g;
    rr(c, b.x, b.y, b.w, b.h, 6); c.fill();
    c.strokeStyle = '#334155'; c.lineWidth = 2;
    rr(c, b.x, b.y, b.w, b.h, 6); c.stroke();
    // Top highlight.
    c.fillStyle = 'rgba(255,255,255,0.25)';
    rr(c, b.x + 3, b.y + 3, b.w - 6, 6, 3); c.fill();
    // Rivets.
    c.fillStyle = '#334155';
    var riv = [[b.x + 8, b.y + 8], [b.x + b.w - 8, b.y + 8], [b.x + 8, b.y + b.h - 8], [b.x + b.w - 8, b.y + b.h - 8]];
    for (var i = 0; i < riv.length; i++) {
      c.beginPath(); c.arc(riv[i][0], riv[i][1], 3, 0, Math.PI * 2); c.fill();
    }
  }

  function drawWood(c, w) {
    var g = c.createRadialGradient(w.x - w.r * 0.3, w.y - w.r * 0.3, 2, w.x, w.y, w.r);
    g.addColorStop(0, '#c89b6d'); g.addColorStop(0.7, '#a9764b'); g.addColorStop(1, '#7c5330');
    c.fillStyle = g;
    c.beginPath(); c.arc(w.x, w.y, w.r, 0, Math.PI * 2); c.fill();
    c.strokeStyle = '#5d3d22'; c.lineWidth = 2;
    c.beginPath(); c.arc(w.x, w.y, w.r, 0, Math.PI * 2); c.stroke();
    c.strokeStyle = 'rgba(93,61,34,0.6)'; c.lineWidth = 1.5;
    c.beginPath(); c.arc(w.x, w.y, w.r * 0.6, 0, Math.PI * 2); c.stroke();
    c.beginPath(); c.arc(w.x, w.y, w.r * 0.3, 0, Math.PI * 2); c.stroke();
  }

  function drawGate(c, g) {
    var slide = (1 - g.anim) * 0; // barrier slides up as it opens
    var openH = g.h * (1 - g.anim);
    if (g.anim >= 1) {
      // Fully open: just the posts + glow.
      c.fillStyle = 'rgba(124,252,0,0.25)';
      rr(c, g.x, g.y, g.w, g.h, 4); c.fill();
      return;
    }
    // Barrier with hazard stripes.
    c.save();
    c.beginPath(); rr(c, g.x, g.y + slide, g.w, openH, 4); c.clip();
    c.fillStyle = '#facc15';
    c.fillRect(g.x, g.y + slide, g.w, openH);
    c.fillStyle = '#1e293b';
    for (var i = -1; i < g.w / 16 + 1; i++) {
      c.beginPath();
      c.moveTo(g.x + i * 16, g.y + slide + openH);
      c.lineTo(g.x + i * 16 + 8, g.y + slide + openH);
      c.lineTo(g.x + i * 16 + 8 + openH, g.y + slide);
      c.lineTo(g.x + i * 16 + openH, g.y + slide);
      c.closePath(); c.fill();
    }
    c.restore();
    c.strokeStyle = '#1e293b'; c.lineWidth = 2;
    rr(c, g.x, g.y + slide, g.w, openH, 4); c.stroke();
    if (g.kind === 'key' || g.kind === 'pieces') {
      // Lock icon.
      var cx = g.x + g.w / 2, cy = g.y + slide + openH / 2;
      c.fillStyle = '#1e293b';
      rr(c, cx - 8, cy - 2, 16, 12, 3); c.fill();
      c.strokeStyle = '#1e293b'; c.lineWidth = 3;
      c.beginPath(); c.arc(cx, cy - 2, 6, Math.PI, 0); c.stroke();
    }
  }

  function drawFinishZone(c, x, y, open, pulse) {
    var r = FINISH_R;
    c.save();
    c.translate(x, y);
    if (open) {
      var g = c.createRadialGradient(0, 0, r * 0.3, 0, 0, r * 1.7);
      g.addColorStop(0, 'rgba(74,222,128,0.55)');
      g.addColorStop(1, 'rgba(74,222,128,0)');
      c.fillStyle = g;
      c.beginPath(); c.arc(0, 0, r * 1.7, 0, Math.PI * 2); c.fill();
      c.strokeStyle = '#22c55e';
      c.lineWidth = 3;
      c.setLineDash([10, 6]);
      c.lineDashOffset = -time * 30;
      c.beginPath(); c.arc(0, 0, r * (1 + 0.05 * pulse), 0, Math.PI * 2); c.stroke();
      c.setLineDash([]);
      c.fillStyle = 'rgba(74,222,128,0.35)';
      c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fill();
      // Checkered flag.
      c.fillStyle = '#166534';
      c.fillRect(-2, -r * 0.7, 3, r * 1.1);
      for (var i = 0; i < 3; i++) for (var j = 0; j < 2; j++) {
        c.fillStyle = (i + j) % 2 === 0 ? '#166534' : '#ffffff';
        c.fillRect(1 + i * 7, -r * 0.7 + j * 7, 7, 7);
      }
    } else {
      c.strokeStyle = 'rgba(148,163,184,0.8)';
      c.lineWidth = 3;
      c.setLineDash([8, 8]);
      c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.stroke();
      c.setLineDash([]);
      c.fillStyle = 'rgba(100,116,139,0.25)';
      c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#64748b';
      rr(c, -9, -2, 18, 13, 3); c.fill();
      c.strokeStyle = '#64748b'; c.lineWidth = 3;
      c.beginPath(); c.arc(0, -2, 7, Math.PI, 0); c.stroke();
    }
    c.restore();
  }

  function wrapText(c, text, x, y, maxW, lineH) {
    var words = text.split(' ');
    var line = '', yy = y;
    for (var i = 0; i < words.length; i++) {
      var test = line ? line + ' ' + words[i] : words[i];
      if (c.measureText(test).width > maxW && line) {
        c.fillText(line, x, yy);
        line = words[i];
        yy += lineH;
      } else {
        line = test;
      }
    }
    c.fillText(line, x, yy);
  }

  function renderPlaying() {
    var c = ctx;
    var def = levelDef;
    var pulse = Math.sin(time * 4) * 0.5 + 0.5;

    // Finish zone (under everything else in the arena).
    drawFinishZone(c, def.finish[0], def.finish[1], gateOpen, pulse);

    for (var bi = 0; bi < blocks.length; bi++) drawBlock(c, blocks[bi]);
    for (var gi = 0; gi < gates.length; gi++) drawGate(c, gates[gi]);
    for (var wi = 0; wi < woods.length; wi++) drawWood(c, woods[wi]);
    for (var si = 0; si < spikes.length; si++) drawSpikeZone(c, spikes[si].x, spikes[si].y, spikes[si].r, pulse);
    for (var ai = 0; ai < attractors.length; ai++) drawEnemyMagnet(c, attractors[ai].x, attractors[ai].y, 'attractor', pulse);
    for (var ri = 0; ri < repellers.length; ri++) drawEnemyMagnet(c, repellers[ri].x, repellers[ri].y, 'repeller', pulse);

    // Free + stolen pieces.
    for (var pi = 0; pi < pieces.length; pi++) {
      var p = pieces[pi];
      if (p.state === 'free' || p.state === 'stolen') {
        drawMetalPiece(c, p.x, p.y, p.type, p.type === 'key' ? 14 : PIECE_R, p.x * 0.01 + p.y * 0.013);
      }
    }

    // Pull-radius field ring.
    var md = magnetDef(selectedMagnet);
    var skin = skinDef(selectedSkin);
    var ringA = pointer.down ? 0.55 : 0.28;
    c.strokeStyle = skin.ring;
    c.globalAlpha = ringA;
    c.lineWidth = 2;
    c.setLineDash([10, 10]);
    c.beginPath(); c.arc(magnet.x, magnet.y, md.pullR, 0, Math.PI * 2); c.stroke();
    c.setLineDash([]);
    var fg = c.createRadialGradient(magnet.x, magnet.y, MAGNET_R, magnet.x, magnet.y, md.pullR);
    fg.addColorStop(0, skin.ring);
    fg.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = fg;
    c.globalAlpha = ringA * 0.5;
    c.beginPath(); c.arc(magnet.x, magnet.y, md.pullR, 0, Math.PI * 2); c.fill();
    c.globalAlpha = 1;

    // Magnet + attached / stealing pieces.
    drawMagnetShape(c, magnet.x, magnet.y, MAGNET_R, skin, magnet.squash, pointer.down ? 1 : 0.7);
    for (var qi = 0; qi < pieces.length; qi++) {
      var q = pieces[qi];
      if (q.state === 'attached' || q.state === 'stealing') {
        drawMetalPiece(c, q.x, q.y, q.type, q.type === 'key' ? 13 : PIECE_R - 1, q.slot * 0.7);
      }
    }

    // Particles + floaters.
    for (var xi = 0; xi < particles.length; xi++) {
      var pt = particles[xi];
      var f = 1 - pt.life / pt.maxLife;
      c.globalAlpha = f;
      if (pt.type === 'ring') {
        c.strokeStyle = pt.color;
        c.lineWidth = 2;
        c.beginPath(); c.arc(pt.x, pt.y, 6 + (1 - f) * 34, 0, Math.PI * 2); c.stroke();
      } else {
        c.fillStyle = pt.color;
        c.beginPath(); c.arc(pt.x, pt.y, pt.size * f + 0.5, 0, Math.PI * 2); c.fill();
      }
    }
    c.globalAlpha = 1;
    c.textAlign = 'center'; c.textBaseline = 'middle';
    for (var fi = 0; fi < floaters.length; fi++) {
      var fl = floaters[fi];
      c.globalAlpha = 1 - fl.t / 1.1;
      c.fillStyle = fl.color;
      c.font = 'bold 18px Arial';
      c.fillText(fl.text, fl.x, fl.y);
    }
    c.globalAlpha = 1;

    renderHud();
    if (tutorialActive) renderTutorial();

    if (panel === 'complete') renderCompletePanel();
    else if (panel === 'failed') renderFailedPanel();
    else if (panel === 'paused') renderPausedPanel();

    // Confetti on top.
    for (var ci = 0; ci < confetti.length; ci++) {
      var cf = confetti[ci];
      c.save();
      c.translate(cf.x, cf.y);
      c.rotate(cf.rot);
      c.fillStyle = cf.color;
      c.fillRect(-cf.size / 2, -cf.size / 4, cf.size, cf.size / 2);
      c.restore();
    }
  }

  function renderHud() {
    var c = ctx;
    drawIconButton(c, BTN.pause, '❚❚', 'pause', false);
    drawIconButton(c, BTN.hudMute, AudioSys.userMuted ? '✕' : '♪', 'hudMute', AudioSys.userMuted);
    drawIconButton(c, BTN.hudRestart, '↺', 'hudRestart', false);
    drawCoinsBadge(c, 316, 14, 150, 40);
    c.fillStyle = '#ffffff';
    c.font = 'bold 19px Arial';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(isDaily ? t('dailyTitle') : t('level') + ' ' + (levelIndex + 1), 240, 34);
    // Progress bar.
    var pct = clamp(collected / levelDef.req, 0, 1);
    c.fillStyle = 'rgba(0,0,0,0.35)';
    rr(c, 16, 66, 448, 34, 10); c.fill();
    c.fillStyle = 'rgba(255,255,255,0.15)';
    rr(c, 16, 66, 448, 34, 10); c.fill();
    var pg = c.createLinearGradient(16, 0, 464, 0);
    pg.addColorStop(0, '#4ade80'); pg.addColorStop(1, '#22c55e');
    c.fillStyle = pg;
    if (pct > 0) { rr(c, 18, 68, 444 * pct, 30, 8); c.fill(); }
    c.fillStyle = '#ffffff';
    c.font = 'bold 17px Arial';
    c.fillText(collected + ' / ' + levelDef.req + '  ' + t('pieces'), 240, 84);
    // Bottom bar: goal + timer/par.
    c.fillStyle = 'rgba(0,0,0,0.35)';
    rr(c, 16, 712, 448, 72, 12); c.fill();
    c.fillStyle = '#e2e8f0';
    c.font = '15px Arial';
    c.textAlign = 'left';
    c.fillText(t('goal') + ' ' + levelDef.req + ' ' + t('pieces'), 32, 736);
    c.textAlign = 'right';
    if (levelDef.time) {
      var left = Math.max(0, levelDef.time - levelTime);
      var mm = Math.floor(left / 60), ss = Math.floor(left % 60);
      c.fillStyle = left <= 10 ? '#f87171' : '#fde68a';
      c.font = 'bold 20px Arial';
      c.fillText(mm + ':' + (ss < 10 ? '0' : '') + ss, 448, 736);
      c.fillStyle = '#cbd5e1';
      c.font = '13px Arial';
      c.fillText(t('level') + ' ' + (isDaily ? '•' : (levelIndex + 1)) + '  •  ' + t('stars') + ': ' + (stars[levelIndex] || 0) + '/3', 448, 762);
    } else {
      c.fillStyle = '#fde68a';
      c.font = 'bold 16px Arial';
      c.fillText('★3 ≤ ' + levelDef.par + t('sec'), 448, 736);
      c.fillStyle = '#cbd5e1';
      c.font = '13px Arial';
      c.fillText(t('level') + ' ' + (isDaily ? '•' : (levelIndex + 1)) + '  •  ' + t('stars') + ': ' + (stars[levelIndex] || 0) + '/3', 448, 762);
    }
    c.textAlign = 'left';
  }

  function drawHand(c, x, y, angle) {
    // Stylized white-glove pointer hand.
    c.save();
    c.translate(x, y);
    c.rotate(angle || 0);
    c.fillStyle = '#ffffff';
    c.strokeStyle = '#334155'; c.lineWidth = 2;
    c.beginPath(); c.arc(0, 0, 15, 0, Math.PI * 2); c.fill(); c.stroke();
    rr(c, -5, -34, 10, 26, 5); c.fill(); c.stroke();
    c.beginPath(); c.arc(-13, -6, 6, 0, Math.PI * 2); c.fill(); c.stroke();
    c.restore();
    c.strokeStyle = 'rgba(255,255,255,0.8)';
    c.lineWidth = 2;
    c.beginPath(); c.arc(x, y, 24 + Math.sin(time * 5) * 4, 0, Math.PI * 2); c.stroke();
  }

  function renderTutorial() {
    var c = ctx;
    var ph = tutorialPhase();
    if (!ph) return;
    // Banner.
    drawShadowCard(c, 24, 124, 432, 48, 12, ['rgba(30,30,46,0.92)', 'rgba(20,20,32,0.92)']);
    c.fillStyle = '#ffffff';
    c.font = 'bold 15px Arial';
    c.textAlign = 'left'; c.textBaseline = 'middle';
    var text = ph === 'drag' ? t('tut1') : ph === 'collect' ? t('tut3') : t('tut4');
    c.fillText(text, 40, 149);
    drawButton(c, BTN.tutSkip, t('skip'), 'red', 'tutSkip', 13);
    if (ph === 'drag') {
      // Hand loops from the magnet toward the first cluster.
      var cl = levelDef.clusters[0];
      var f = (Math.sin(tutT * 1.4) * 0.5 + 0.5);
      var hx = magnet.x + (cl[0] - magnet.x) * f;
      var hy = magnet.y + (cl[1] - magnet.y) * f;
      c.strokeStyle = 'rgba(255,255,255,0.6)';
      c.lineWidth = 2;
      c.setLineDash([6, 8]);
      c.beginPath(); c.moveTo(magnet.x, magnet.y); c.lineTo(cl[0], cl[1]); c.stroke();
      c.setLineDash([]);
      drawHand(c, hx, hy, 0.5);
    } else if (ph === 'finish') {
      // Bouncing arrow over the finish zone.
      var fx = levelDef.finish[0], fy = levelDef.finish[1];
      var bob = Math.sin(time * 5) * 6;
      c.fillStyle = '#4ade80';
      c.beginPath();
      c.moveTo(fx, fy - FINISH_R - 34 + bob);
      c.lineTo(fx - 14, fy - FINISH_R - 52 + bob);
      c.lineTo(fx + 14, fy - FINISH_R - 52 + bob);
      c.closePath(); c.fill();
      drawHand(c, fx + 52, fy - 30, -0.6);
    }
  }

  function renderCompletePanel() {
    var c = ctx;
    c.fillStyle = 'rgba(0,0,0,0.55)';
    c.fillRect(0, 0, W, H);
    drawShadowCard(c, 40, 180, 400, 440, 18, ['#f8fafc', '#e2e8f0']);
    c.fillStyle = '#1e293b';
    c.font = 'bold 26px Arial';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(isDaily ? t('dailyTitle') : t('complete'), 240, 222);
    if (!isDaily) {
      for (var s = 0; s < 3; s++) {
        var pop = clamp((completeT - 0.25 - s * 0.3) / 0.3, 0, 1);
        var sc = pop > 0 ? easeOutBack(pop) : 0;
        var filled = s < lastStars;
        c.save();
        c.translate(170 + s * 70, 285);
        c.scale(Math.max(0.01, sc), Math.max(0.01, sc));
        drawStarShape(c, 0, 0, 26, filled ? '#facc15' : '#cbd5e1');
        c.restore();
        if (filled && pop > 0 && pop < 1) { /* pop-in handled by scale */ }
      }
      if (lastIsNewBest) {
        c.fillStyle = '#d97706';
        c.font = 'bold 16px Arial';
        c.fillText('★ ' + t('newBest'), 240, 330);
      }
      c.fillStyle = '#475569';
      c.font = '17px Arial';
      c.textAlign = 'left';
      c.fillText(t('level') + ' ' + (levelIndex + 1) + '  •  ' + Math.floor(levelTime) + t('sec'), 70, 360);
      c.fillText(t('timeBonus') + ': +' + lastTimeBonus, 70, 388);
      c.fillText(t('stars') + ': +' + (25 * lastStars), 70, 416);
      c.fillStyle = '#16a34a';
      c.font = 'bold 22px Arial';
      c.fillText(t('total') + ': +' + lastCoins + '  🪙', 70, 448);
      c.textAlign = 'center';
    } else {
      c.fillStyle = '#16a34a';
      c.font = 'bold 22px Arial';
      c.fillText(lastDailyReward > 0 ? t('dailyWin') : t('dailyDone'), 240, 300);
      c.fillStyle = '#475569';
      c.font = '17px Arial';
      c.fillText(lastDailyReward > 0 ? '+' + lastDailyReward + ' ' + t('coins') : '', 240, 340);
      if (tutorialActive) {
        c.fillStyle = '#1e293b';
        c.font = 'bold 16px Arial';
        c.fillText(t('tutDone'), 240, 380);
      }
    }
    if (tutorialJustDone) {
      c.fillStyle = '#1e293b';
      c.font = 'bold 15px Arial';
      c.fillText(t('tutDone'), 240, 604);
    }
    drawButton(c, BTN.next, isDaily ? t('menu') : (levelIndex + 1 < TOTAL_LEVELS ? t('next') : t('menu')), 'green', 'next', 20);
    drawButton(c, BTN.replay, t('replay'), 'steel', 'replay', 17);
    drawButton(c, BTN.toMenu, t('menu'), 'blue', 'toMenu', 17);
  }

  function renderFailedPanel() {
    var c = ctx;
    c.fillStyle = 'rgba(0,0,0,0.55)';
    c.fillRect(0, 0, W, H);
    drawShadowCard(c, 40, 240, 400, 280, 18, ['#f8fafc', '#e2e8f0']);
    c.fillStyle = '#dc2626';
    c.font = 'bold 28px Arial';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(t('failed'), 240, 290);
    c.fillStyle = '#475569';
    c.font = '16px Arial';
    c.fillText(collected + ' / ' + levelDef.req + ' ' + t('pieces'), 240, 330);
    drawButton(c, BTN.retry, t('retry'), 'green', 'retry', 20);
    drawButton(c, BTN.failMenu, t('menu'), 'blue', 'failMenu', 18);
  }

  function renderPausedPanel() {
    var c = ctx;
    c.fillStyle = 'rgba(0,0,0,0.55)';
    c.fillRect(0, 0, W, H);
    drawShadowCard(c, 40, 240, 400, 300, 18, ['#f8fafc', '#e2e8f0']);
    c.fillStyle = '#1e293b';
    c.font = 'bold 28px Arial';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(t('pause'), 240, 290);
    drawButton(c, BTN.resume, t('resume'), 'green', 'resume', 20);
    drawButton(c, BTN.pauseRestart, t('restart'), 'steel', 'pauseRestart', 18);
    drawButton(c, BTN.pauseMenu, t('menu'), 'blue', 'pauseMenu', 18);
  }

  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    if (!bgCanvas || bgEnv !== selectedEnv) rebuildBackground();
    ctx.drawImage(bgCanvas, 0, 0, W, H);
    ctx.save();
    if (shake > 0 && state === 'playing') {
      ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);
    }
    if (state === 'loading') {
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 24px Arial';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('MAGNET MASTER', 240, 400);
    } else if (state === 'menu') renderMenu();
    else if (state === 'levels') renderLevels();
    else if (state === 'shop') renderShop();
    else if (state === 'playing') renderPlaying();
    ctx.restore();
    // Toast.
    if (toast && time < toastUntil) {
      var c = ctx;
      c.font = 'bold 15px Arial';
      var tw = Math.min(440, c.measureText(toast).width + 36);
      drawShadowCard(c, 240 - tw / 2, 392, tw, 36, 18, ['#1e293b', '#0f172a']);
      c.fillStyle = '#fde68a';
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(toast, 240, 411);
    }
  }

  // ============================== Main loop ==============================
  var tutorialJustDone = false;
  function frame(ts) {
    requestAnimationFrame(frame);
    var dt = Math.min(0.05, (ts - lastTs) / 1000 || 0.016);
    lastTs = ts;
    time += dt;
    if (tutorialActive) tutT += dt;
    if (state === 'playing') {
      if (!panel) updatePlaying(dt);
      else {
        if (panel === 'complete') completeT += dt;
        updateFx(dt);
      }
    } else {
      updateFx(dt);
    }
    render();
  }

  // ============================== Boot ==============================
  function boot() {
    resize();
    window.addEventListener('resize', resize);
    window.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove, { passive: false });
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', onPointerUp);
    window.addEventListener('keydown', onKeyDown);
    document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
    render();
    Bridge.init().then(function () {
      var rawLang = '';
      try { rawLang = window.bridge.platform.language || ''; } catch (e) {}
      Bridge.subscribe();
      Bridge.applyInitialPlatformState();
      return Bridge.loadProgress().then(function (p) {
        coins = p.coins;
        stars = p.stars || [];
        unlocked = clamp(p.unlocked, 1, TOTAL_LEVELS);
        mClaimed = p.mprogress || { levels10: 0, pieces250: 0, stars5: 0 };
        totalPieces = p.totalPieces || 0;
        lastDaily = p.lastDaily || '';
        levelsCompleted = p.levelsCompleted || 0;
        tutorialDone = !!p.tutorial;
        if (p.shop) {
          if (p.shop.magnets) {
            ownedMagnets = p.shop.magnets.owned || ['classic'];
            selectedMagnet = p.shop.magnets.selected || 'classic';
          }
          if (p.shop.skins) {
            ownedSkins = p.shop.skins.owned || ['classic'];
            selectedSkin = p.shop.skins.selected || 'classic';
          }
          if (p.shop.envs) {
            ownedEnvs = p.shop.envs.owned || ['workshop'];
            selectedEnv = p.shop.envs.selected || 'workshop';
          }
        }
        // Migration: a player with any stars has played before — never
        // tutorialize them mid-game.
        var anyStars = false;
        for (var i = 0; i < stars.length; i++) if (stars[i] > 0) { anyStars = true; break; }
        if (anyStars) tutorialDone = true;
        AudioSys.setUserMuted(!!p.muted);
        setLanguage(p.lang || rawLang || 'en');
        state = 'menu';
        AudioSys.setMusicMode('menu');
        rebuildBackground();
        requestAnimationFrame(frame);
        Bridge.send('game_ready');
      });
    }).catch(function () {
      state = 'menu';
      rebuildBackground();
      requestAnimationFrame(frame);
    });
  }

  // Debug hook for automated testing (?debug=1): read-only state + helpers.
  // Harmless in production: it only exposes game state and test helpers.
  try {
    if (typeof window !== 'undefined' && window.location && window.location.search.indexOf('debug') !== -1) {
      window.MAGNET_DEBUG = {
        getState: function () {
          var byState = { free: 0, attached: 0, stealing: 0, stolen: 0 };
          for (var i = 0; i < pieces.length; i++) byState[pieces[i].state]++;
          return {
            state: state, panel: panel, phase: phase,
            level: isDaily ? -1 : levelIndex + 1, isDaily: isDaily,
            coins: coins, stars: stars.slice(), unlocked: unlocked,
            collected: collected, req: levelDef ? levelDef.req : 0,
            totalInLevel: totalInLevel, gateOpen: gateOpen,
            knockoffs: knockoffs, levelTime: Math.round(levelTime * 10) / 10,
            timeLeft: levelDef && levelDef.time ? Math.max(0, levelDef.time - levelTime) : null,
            magnet: { x: Math.round(magnet.x), y: Math.round(magnet.y) },
            piecesByState: byState,
            gates: gates.map(function (g) { return { open: g.open, kind: g.kind, x: g.x, y: g.y, w: g.w, h: g.h }; }),
            spikes: spikes.map(function (s) { return { x: Math.round(s.x), y: Math.round(s.y), r: s.r, moving: s.moving }; }),
            attractors: attractors.map(function (a) { return { x: a.x, y: a.y }; }),
            keysTaken: keyPieces.map(function (k) { return k.taken; }),
            lastStars: lastStars, lastCoins: lastCoins, lastTimeBonus: lastTimeBonus,
            lastDailyReward: lastDailyReward,
            tutorialActive: tutorialActive, tutorialDone: tutorialDone,
            tutorialPhase: tutorialPhase(),
            missions: MISSION_DEFS.map(function (def) {
              var prog = missionProgress(def);
              return { id: def.id, progress: prog, target: def.target, reward: def.reward, done: prog >= def.target, claimed: !!mClaimed[def.id] };
            }),
            totalPieces: totalPieces, levelsCompleted: levelsCompleted,
            muted: AudioSys.userMuted,
            musicStarted: AudioSys.music.started, musicMode: AudioSys.music.mode,
            musicAudible: AudioSys.music.started && !AudioSys.isMuted() && !!AudioSys.ctx && AudioSys.ctx.state === 'running',
            humOn: AudioSys.hum.on,
            audioLog: AudioSys.log.slice(-30).map(function (e) { return e.name; }),
            ownedMagnets: ownedMagnets.slice(), selectedMagnet: selectedMagnet,
            ownedSkins: ownedSkins.slice(), selectedSkin: selectedSkin,
            ownedEnvs: ownedEnvs.slice(), selectedEnv: selectedEnv,
            shopTab: shopTab, lang: lang,
            dailyAvailable: dailyAvailable(), dailyKey: dailyKey(),
            buttons: JSON.parse(JSON.stringify(BTN))
          };
        },
        getLevels: function () {
          return {
            levels: JSON.parse(JSON.stringify(LEVELS)),
            daily: JSON.parse(JSON.stringify(DAILY_TEMPLATES))
          };
        },
        getShop: function () {
          return {
            magnets: JSON.parse(JSON.stringify(MAGNETS)),
            skins: JSON.parse(JSON.stringify(SKINS)),
            envs: JSON.parse(JSON.stringify(ENVS))
          };
        },
        levelCellRect: function (i) { return levelCellRect(i); },
        shopActionRect: function (i) { return shopActionRect(i); },
        setLevel: function (n) {
          loadLevel(clamp(n, 1, TOTAL_LEVELS) - 1, false);
          state = 'playing';
        },
        setDaily: function () { loadLevel(-1, true); state = 'playing'; },
        setCoins: function (n) { coins = n; Bridge.saveProgress('coins', coins); },
        setStars: function (arr) { stars = arr.slice(); Bridge.saveProgress('stars', stars); },
        setUnlocked: function (n) { unlocked = clamp(n, 1, TOTAL_LEVELS); Bridge.saveProgress('unlocked', unlocked); },
        setTotalPieces: function (n) { totalPieces = n; Bridge.saveProgress('totalPieces', totalPieces); },
        setLastDaily: function (s) { lastDaily = s; Bridge.saveProgress('lastDaily', lastDaily); },
        setTutorialDone: function (b) { tutorialDone = b; Bridge.saveProgress('tutorial', b ? '1' : '0'); },
        setPointer: function (x, y, down) { pointer.x = x; pointer.y = y; pointer.down = !!down; if (down) hasDragged = true; },
        setLevelTime: function (t) { levelTime = t; },
        simulateWin: function (starsWanted) {
          starsWanted = clamp(starsWanted || 3, 1, 3);
          knockoffs = starsWanted === 1 ? 1 : 0;
          levelTime = starsWanted === 3 ? Math.max(0, levelDef.par - 1) : levelDef.par + 10;
          totalPieces += levelDef.req;
          collected = levelDef.req;
          gateOpen = true;
          magnet.x = levelDef.finish[0];
          magnet.y = levelDef.finish[1];
          phase = 'play';
          panel = null;
          completeLevel();
          return true;
        }
      };
    }
  } catch (e) {}

  boot();
})();

</script>
</body>
</html>
