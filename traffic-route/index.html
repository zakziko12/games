  function renderCompletePanel() {
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(0, 0, W, H);
    rr(ctx, 40, 170, 400, 520, 20);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#27ae60';
    ctx.font = 'bold 28px Arial';
    ctx.fillText(t('levelComplete'), 240, 222);
    // Stars pop in sequence.
    var panelT = completeT - 0.9;
    var visible = panelT > 0 ? Math.min(lastStars, Math.floor(panelT / 0.3) + 1) : 0;
    if (visible > starPop) {
      starPop = visible;
      if (visible <= lastStars) AudioSys.star();
    }
    for (var i = 0; i < 3; i++) {
      var sx = 240 + (i - 1) * 78;
      var sy = 300 - (i === 1 ? 14 : 0);
      var earned = i < lastStars;
      var shown = i < visible;
      var scale = 1;
      if (earned && shown) {
        var popT = clamp((panelT - i * 0.3) / 0.3, 0, 1);
        scale = Math.max(0.2, easeOutBack(popT));
      }
      ctx.save();
      ctx.translate(sx, sy);
      ctx.scale(scale, scale);
      drawStar(ctx, 0, 0, 30, (earned && shown) ? '#ffc107' : '#dddddd');
      ctx.restore();
    }
    // Coins.
    drawCoinIcon(ctx, 190, 382, 16);
    ctx.fillStyle = '#b8860b';
    ctx.font = 'bold 26px Arial';
    ctx.textAlign = 'left';
    ctx.fillText('+' + lastCoins, 214, 383);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#7f8c8d';
    ctx.font = '14px Arial';
    ctx.fillText(t('star3Tip'), 240, 424);
    drawButton(ctx, BTN.replay, t('replay'), { bg: '#ecf0f1', fg: '#2c3e50', fontSize: 18 });
    drawButton(ctx, BTN.next, levelIndex + 1 < levelList(levelPack).length ? t('next') : t('levels'),
               { bg: '#27ae60', fg: '#ffffff', fontSize: 20 });
    drawButton(ctx, BTN.compLevels, t('levels'), { bg: '#ffffff', fg: '#2c3e50', fontSize: 16 });
  }

  function renderFailedPanel() {
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(0, 0, W, H);
    rr(ctx, 40, 210, 400, 410, 20);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#e74c3c';
    ctx.font = 'bold 36px Arial';
    ctx.fillText(t('crash'), 240, 272);
    ctx.fillStyle = '#2c3e50';
    ctx.font = '18px Arial';
    ctx.fillText(t('crashDesc'), 240, 322);
    ctx.fillStyle = '#7f8c8d';
    ctx.font = '15px Arial';
    var lines = wrapText(ctx, t('tapCarClear'), 340);
    for (var l = 0; l < lines.length; l++) {
      ctx.fillText(lines[l], 240, 380 + l * 20);
    }
    drawButton(ctx, BTN.retry, t('retry'), { bg: '#27ae60', fg: '#ffffff', fontSize: 18 });
    drawButton(ctx, BTN.newPlan, t('newPlan'), { bg: '#ecf0f1', fg: '#2c3e50', fontSize: 18 });
    drawButton(ctx, BTN.failLevels, t('levels'), { bg: '#ffffff', fg: '#2c3e50', fontSize: 16 });
  }

  function renderPaused() {
    renderPlayingWorld();
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, W, H);
    rr(ctx, 60, 200, 360, 440, 20);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#2c3e50';
    ctx.font = 'bold 32px Arial';
    ctx.fillText(t('paused'), 240, 258);
    drawButton(ctx, BTN.resume, t('resume'), { bg: '#27ae60', fg: '#ffffff', fontSize: 20 });
    drawButton(ctx, BTN.pauseRestart, t('restart'), { bg: '#ecf0f1', fg: '#2c3e50', fontSize: 18 });
    drawButton(ctx, BTN.pauseLevels, t('levels'), { bg: '#ecf0f1', fg: '#2c3e50', fontSize: 18 });
    drawButton(ctx, BTN.pauseMenu, t('menu'), { bg: '#ffffff', fg: '#2c3e50', fontSize: 18 });
  }

  function renderPlayingWorld() {
    ctx.fillStyle = theme().bg;
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    if (shakeT > 0) {
      ctx.translate(rand(-4, 4), rand(-4, 4));
    }
    drawBoardBase();
    drawDestinations();
    drawPaths();
    drawObstacles();
    drawCars();
    drawTrees();
    drawParticles();
    drawPopups();
    ctx.restore();
    drawTopBar();
    drawBottomBar();
    drawToast();
    drawMissionToast();
  }

  function renderPlaying() {
    renderPlayingWorld();
    if (panel === 'complete') renderCompletePanel();
    else if (panel === 'failed') renderFailedPanel();
  }

  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (state === 'menu') renderMenu();
    else if (state === 'levels') renderLevels();
    else if (state === 'shop') renderShop();
    else if (state === 'playing') renderPlaying();
    else if (state === 'paused') renderPaused();
    else {
      ctx.fillStyle = theme().bg;
      ctx.fillRect(0, 0, W, H);
    }
  }

  // ============================== Main loop ==============================
  function loop(ts) {
    requestAnimationFrame(loop);
    var dt = lastTs ? (ts - lastTs) / 1000 : 0.016;
    lastTs = ts;
    if (dt > 0.05) dt = 0.05;
    if (dt < 0) dt = 0;
    time += dt;
    // Toasts decay in every state (the shop shows purchase toasts too).
    if (toast) { toast.t -= dt; if (toast.t <= 0) toast = null; }
    if (missionToast) { missionToast.t -= dt; if (missionToast.t <= 0) missionToast = null; }
    if (state === 'playing') updatePlaying(dt);
    else if (state === 'menu') updateMenu(dt);
    render();
  }

  // ============================== Boot ==============================
  function boot() {
    resize();
    setupInput();
    loadLevel(null, 0);
    state = 'loading';
    requestAnimationFrame(loop);

    Bridge.init().then(function (ok) {
      var rawLang = '';
      if (ok) {
        try { rawLang = window.bridge.platform.language || ''; } catch (e) {}
      }
      if (!rawLang && typeof navigator !== 'undefined' && navigator.language) rawLang = navigator.language;
      setLanguage(rawLang);
      if (ok) {
        Bridge.subscribe();
        Bridge.applyInitialPlatformState();
      }
      return Bridge.loadProgress();
    }).then(function (progress) {
      coins = progress.coins || 0;
      stars = Array.isArray(progress.stars) ? progress.stars : [];
      unlocked = clamp(progress.unlocked || 1, 1, LEVELS.length);
      mProgress = progress.mprogress || { nocoll5: 0, stars3: 0 };
      if (typeof mProgress.nocoll5 !== 'number') mProgress.nocoll5 = 0;
      if (typeof mProgress.stars3 !== 'number') mProgress.stars3 = 0;
      if (!mProgress.done || typeof mProgress.done !== 'object') mProgress.done = {};
      hints = progress.hints || 0;
      packUnlocked = progress.packs || { truck: 0, bus: 0 };
      if (typeof packUnlocked.truck !== 'number') packUnlocked.truck = 0;
      if (typeof packUnlocked.bus !== 'number') packUnlocked.bus = 0;
      var col = progress.colors || {};
      ownedColors = Array.isArray(col.owned) && col.owned.length > 0 ? col.owned : ['default'];
      if (ownedColors.indexOf('default') === -1) ownedColors.unshift('default');
      selectedColor = ownedColors.indexOf(col.selected) !== -1 ? col.selected : 'default';
      var mp = progress.maps || {};
      ownedMaps = Array.isArray(mp.owned) && mp.owned.length > 0 ? mp.owned : ['suburb'];
      if (ownedMaps.indexOf('suburb') === -1) ownedMaps.unshift('suburb');
      selectedMap = ownedMaps.indexOf(mp.selected) !== -1 ? mp.selected : 'suburb';
      AudioSys.setUserMuted(!!progress.muted);
      loadLevel(null, 0); // reload so the saved paint theme colors the cars
      state = 'menu';
      render();
      Bridge.send('game_ready');
    }).catch(function () {
      // Never block the game on Bridge/storage failures.
      state = 'menu';
      render();
      Bridge.send('game_ready');
    });
  }

  // Debug hook for automated testing (?debug=1): read-only state + test helpers.
  // Harmless in production: it only exposes game state and test helpers.
  try {
    if (typeof window !== 'undefined' && window.location && window.location.search.indexOf('debug') !== -1) {
      window.TRAFFIC_DEBUG = {
        getState: function () {
          return {
            state: state, phase: phase, panel: panel,
            level: levelIndex + 1, pack: levelPack, levelLabel: packLabel(levelPack, levelIndex),
            unlocked: unlocked, coins: coins,
            stars: stars.slice(), goEnabled: phase === 'draw' && allPathsReady(),
            cars: cars.map(function (car) {
              return {
                type: car.type, speed: car.speed, radius: car.radius, pad: car.pad,
                x: Math.round(car.x), y: Math.round(car.y),
                sx: car.sx, sy: car.sy, dx: car.dx, dy: car.dy, color: car.color,
                hasPath: !!car.path, pathLen: car.path ? Math.round(car.totalLen) : 0,
                arrived: car.arrived, crashed: car.crashed, moving: car.moving
              };
            }),
            retried: retried, redraws: redraws, crashCount: crashCount,
            lastStars: lastStars, lastCoins: lastCoins,
            missions: MISSION_DEFS.map(function (def) {
              var prog = missionProgress(def);
              return { id: def.id, progress: prog, target: def.target, reward: def.reward, done: prog >= def.target };
            }),
            muted: AudioSys.userMuted,
            musicStarted: AudioSys.music.started,
            musicAudible: AudioSys.music.started && !AudioSys.isMuted() && !!AudioSys.ctx && AudioSys.ctx.state === 'running',
            engineOn: AudioSys.engine.on,
            hints: hints, hintActive: !!hintPath, usedHint: usedHint,
            packs: { truck: packUnlocked.truck, bus: packUnlocked.bus },
            ownedColors: ownedColors.slice(), selectedColor: selectedColor,
            ownedMaps: ownedMaps.slice(), selectedMap: selectedMap,
            shopTab: shopTab, selectTab: selectTab
          };
        },
        getLevels: function () {
          // All 40 levels in global order (main 1-30, truck 31-35, bus 36-40).
          var all = [];
          for (var i = 0; i < LEVELS.length; i++) {
            var m = JSON.parse(JSON.stringify(LEVELS[i]));
            m.pack = null; m.num = i + 1;
            all.push(m);
          }
          var pk;
          for (pk = 0; pk < PACKS.truck.levels.length; pk++) {
            var tl = JSON.parse(JSON.stringify(PACKS.truck.levels[pk]));
            tl.pack = 'truck'; tl.num = pk + 1;
            all.push(tl);
          }
          for (pk = 0; pk < PACKS.bus.levels.length; pk++) {
            var bl = JSON.parse(JSON.stringify(PACKS.bus.levels[pk]));
            bl.pack = 'bus'; bl.num = pk + 1;
            all.push(bl);
          }
          return all;
        },
        getMeta: function () {
          return {
            board: BOARD, carTypes: CAR_TYPES, carR: CAR_R,
            crashDist: CRASH_DIST, destSize: DEST_SIZE, destSnap: DEST_SNAP,
            destBlockAfter: DEST_BLOCK_AFTER
          };
        },
        getShop: function () {
          return {
            hintSingle: SHOP.hintSingle, hintPack: SHOP.hintPack,
            packTruck: SHOP.packTruck, packBus: SHOP.packBus,
            palettes: JSON.parse(JSON.stringify(PALETTES)),
            themes: JSON.parse(JSON.stringify(THEMES))
          };
        },
        setLevel: function (n) {
          // Global level number: 1-30 main, 31-35 truck, 36-40 bus.
          n = clamp(n, 1, 40);
          if (n <= 30) loadLevel(null, n - 1);
          else if (n <= 35) loadLevel('truck', n - 31);
          else loadLevel('bus', n - 36);
          state = 'playing';
        },
        setPackLevel: function (pack, n) {
          loadLevel(pack, clamp(n, 1, 5) - 1);
          state = 'playing';
        },
        setHints: function (n) { hints = n; Bridge.saveProgress('hints', hints); },
        setCoins: function (n) { coins = n; Bridge.saveProgress('coins', coins); },
        setUnlocked: function (n) { unlocked = clamp(n, 1, LEVELS.length); Bridge.saveProgress('unlocked', unlocked); },
        setStars: function (arr) { stars = arr.slice(); Bridge.saveProgress('stars', stars); },
        setPath: function (carIdx, pts) {
          var car = cars[carIdx];
          if (!car || !pts || pts.length < 1) return false;
          var full = [{ x: car.sx, y: car.sy }];
          for (var i = 0; i < pts.length; i++) full.push({ x: pts[i][0], y: pts[i][1] });
          var len = 0;
          for (var j = 1; j < full.length; j++) {
            var d = dist(full[j - 1].x, full[j - 1].y, full[j].x, full[j].y);
            if (!segmentValidForPath(full[j - 1].x, full[j - 1].y, full[j].x, full[j].y, car, len)) return false;
            len += d;
          }
          var last = full[full.length - 1];
          if (dist(last.x, last.y, car.dx, car.dy) > DEST_SNAP) return false;
          full.push({ x: car.dx, y: car.dy });
          return finalizePath(car, full);
        },
        simulateWin: function (starsWanted) {
          starsWanted = clamp(starsWanted || 3, 1, 3);
          retried = starsWanted === 1;
          redraws = starsWanted === 2 ? 1 : 0;
          crashCount = starsWanted === 1 ? 1 : 0;
          for (var i = 0; i < cars.length; i++) {
            cars[i].arrived = true;
            cars[i].moving = false;
            cars[i].x = cars[i].dx;
            cars[i].y = cars[i].dy;
          }
          phase = 'complete';
          completeT = 0;
          completeLevel();
          panel = 'complete';
          return true;
        }
      };
    }
  } catch (e) {}

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

})();

</script>
</body>
</html>
